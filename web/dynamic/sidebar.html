    <script>
        let userEmail = "";
        let userMobile = "";
        async function onProcessedUserIdentityInfo(args) {
            const response = args.response;
            const responseJson = await response.json();

            if (!responseJson.errorMessage) {
                if (responseJson.errorid === 1) {
                    console.log('useridentityinfo: ' + responseJson.message);
                } else {
                    // ذخیره مقادیر ایمیل و موبایل در متغیرهای global
                    userEmail = responseJson.emailInfo ? responseJson.emailInfo.email : "";
                    userMobile = responseJson.mobileInfo ? `+98${responseJson.mobileInfo.mobile}` : "";


                }
            }
        }
    </script>
    <script>
        window.currencyTitle = "";
        window.currencyId = "";

        async function onProcessedGetCurrency(args) {
            try {
                const responseJson = await args.response.json();

                let row = null;
                if (responseJson && typeof responseJson === "object" && ("id" in responseJson || "title" in responseJson)) {
                    row = responseJson;
                }

                window.currencyTitle = (row?.title ?? "").toString();
                window.currencyId = (row?.id ?? "").toString();
                document.querySelectorAll('.panel-currency__title').forEach((el) => {
                    el.textContent = window.currencyTitle;
                });

            } catch (e) {
                console.error(e);
                window.currencyTitle = "";
                window.currencyId = "";

                document.querySelectorAll('.panel-currency__title').forEach((el) => {
                    el.textContent = "";
                });
            }
        }


        async function onProcessedVerifyUserCredit(args) {
            const formatNumber = (val) => {
                const num = Number(val ?? 0) || 0;
                return Intl.NumberFormat().format(num);
            };
            
            try {
                const responseJson = await args.response.json();
                const rawList = Array.isArray(responseJson) ? responseJson : [];
                const item = rawList[0] || {};

                const agencyOwnerid = item?.agency?.id;
                const agencyName = String(item?.agency?.name ?? '').trim();
                const credit = item?.credit ?? {};

                $bc.setSource("cms.ownerid", [{
                    reciverownerid: agencyOwnerid,
                    run: true,
                }]);
                $bc.setSource("cms.credit", {
                    total_credit: formatNumber(credit.total_credit),
                    debtor: formatNumber(credit.debtor),
                    creditor: formatNumber(credit.creditor),
                    Remaining_credit: formatNumber(credit.Remaining_credit),
                });

                // --- agency name render (replaces comgroupAgencySidebarcallback) ---
                const el = document.querySelector('.panel-userProfile__agancy');
                if (el) {
                    if (!agencyName) {
                        el.textContent = '';
                        el.classList.add('panel-hidden');
                    } else {
                        el.textContent = translate("from_agency") + " " + agencyName;
                        el.classList.remove('panel-hidden');
                    }
                }
            } catch (e) {
                console.log(e);
                $bc.setSource("cms.ownerid", []);
                $bc.setSource("cms.credit", {});

                // optional: hide agency on error too
                const el = document.querySelector('.panel-userProfile__agancy');
                if (el) {
                    el.textContent = '';
                    el.classList.add('panel-hidden');
                }
            }
        }
    </script>
