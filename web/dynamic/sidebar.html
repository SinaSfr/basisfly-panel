    <script>
        let userEmail = "";
        let userMobile = "";
        async function onProcessedUserIdentityInfo(args) {
            const response = args.response;
            const responseJson = await response.json();

            if (!responseJson.errorMessage) {
                if (responseJson.errorid === 1) {
                    console.log('useridentityinfo: ' + responseJson.message);
                } else {
                    // ذخیره مقادیر ایمیل و موبایل در متغیرهای global
                    userEmail = responseJson.emailInfo ? responseJson.emailInfo.email : "";
                    userMobile = responseJson.mobileInfo ? `+98${responseJson.mobileInfo.mobile}` : "";


                }
            }
        }
    </script>
    <script>
        async function comgroupAgencySidebarcallback(args) {
            try {
                let rows =
                    args?.source?.rows ||
                    args?.source?._rows ||
                    args?.source?.source?.rows ||
                    args?.source?.source?._rows ||
                    null

                const item = Array.isArray(rows) && rows.length ? rows[0] : null
                const agencyName = String(item?.agency?.name ?? '').trim()

                const el = document.querySelector('.panel-userProfile__agancy')
                if (!el) return

                if (!agencyName) {
                    el.textContent = ''
                    el.classList.add('panel-hidden')
                    return
                }

                el.textContent = `از آژانس ${agencyName}`
                el.classList.remove('panel-hidden')
            } catch (e) {
                console.error('comgroupAgencySidebarcallback error:', e)
            }
        }
        window.currencyTitle = "";
        window.currencyId = "";

        async function onProcessedGetCurrency(args) {
            try {
                const responseJson = await args.response.json();

                let row = null;

                if (responseJson && typeof responseJson === "object" && ("id" in responseJson || "title" in responseJson)) {
                    row = responseJson;
                }

                window.currencyTitle = (row?.title ?? "").toString();
                window.currencyId = (row?.id ?? "").toString();

            } catch (e) {
                console.error(e);
                window.currencyTitle = "";
                window.currencyId = "";
            }
        }
    </script>
