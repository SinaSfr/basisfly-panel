<basis core="api" name="api.verify_user_credit" run="atclient"
    url="https://basisfly.com/panel/main/[##cms.cookie.rkey##]" method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "list",
                "name": "q",
                "request": "verify_user_credit"
            }
        ]
    } ' content-type="application/json">
</basis>
<basis core="callback" run="atclient" triggers="api.comgroup_agency_by_user" if="{##api.comgroup_agency_by_user##}"
    method="comgroupAgencySidebarcallback">
</basis>

<basis core="api" name="api.useridentityinfo" run="atclient"
    url="https://api.trust-login.com/[##cms.cookie.rkey##]/useridentityinfo" method="get"
    onprocessed="onProcessedUserIdentityInfo">
</basis>


<basis core="api" name="api.currency_unit_view" run="atclient"
    url="https://basisfly.com/panel/main/[##cms.cookie.rkey##]" method="post" body='{
        "name": "db",
        "method":"cms",
        "mid": "20",
        "member":[{ "type":"list",
        "name": "q",
        "request": "currency_unit_view"}]} ' content-type="application/json" onProcessed="onProcessedGetCurrency">
</basis>
