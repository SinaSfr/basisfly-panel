<basis core="api" name="find_user_list" run="atclient" url="https://basisfly.com/panel/[##cms.cookie.rkey##]"
    method="post" body='{ 
        "name": "db",
        "mid": "20",
        "member":[{ 
            "name": "q", 
            "type":"list",
            "request": "find_user_list"
        }]} ' content-type="application/json" onProcessed="onProcessedFindUserList" triggers="cms.refreshCounters">
</basis>


<basis core="api" name="usersinfo" run="atclient" url="https://api.trust-login.com/[##cms.cookie.rkey##]/fa/usersinfo"
    method="post" body='{
        "users": [{##cms.userID.users##}],
        "type": "userid"
    }' content-type="application/json" onProcessed="onProcessedUserInfo" triggers="cms.userID">
</basis>


<basis core="api" name="commission_counter_add" run="atclient"
    url="https://basisfly.com/panel/update/[##cms.cookie.rkey##]" method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "list",
                "name": "q",
                "request": "commission_counter_add",
                "user": "{##cms.trustUserId.result##}",
                "commissonid": "{##cms.userProfile.comgroupid##}",
                "companyid": "{##cms.userProfile.agencyid##}"
            }
        ]
    } ' content-type="application/json" triggers="cms.trustUserId" if="{##cms.trustUserId.run|(false)##}"
    onProcessed="onProcessedCounterAdd">
</basis>

<basis core="api" name="agency_delete_user" run="atclient" url="https://basisfly.com/panel/new/[##cms.cookie.rkey##]"
    method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "scalar",
                "name": "q",
                "request": "agency_delete_user",
                "agency_userid": "{##cms.refreshCounters.userid##}",
                "groupid": "{##cms.userProfile.comgroupid##}"
            }
        ]
    } ' content-type="application/json" onProcessed="onProcessedDeleteUser" triggers="cms.refreshCounters"
    if="{##cms.refreshCounters.run|(false)##}">
</basis>

<basis core="api" name="comgroup_agency_by_user" run="atclient" url="https://basisfly.com/panel/[##cms.cookie.rkey##]"
    method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "list",
                "name": "q",
                "request": "comgroup_agency_by_user"
            }
        ]
    } ' content-type="application/json" onProcessed="onProcessedComgroupAgency">
</basis>



<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <basis core="call" file="book/taglist" lid="1"></basis>
    <title>لیست اعضا</title>
    <meta name="description" content="لیست اعضا">
    <link href="[##cms.cms.cdn##]/userPanel/css/user-panel.ui.min.css?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/css" rel="stylesheet" />
</head>

<body class="panel-bg-zinc-50">
    <!-- Header -->
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <!-- main -->
    <main>
        <div class="panel-flex panel-gap-2 panel-mx-auto max-xl:panel-w-[97%] xl:panel-max-w-7xl panel-mt-14">
            <basis core="call" file="userPanel/sidebar" lid="1" pageindexid="1"></basis>

            <div class="panel-flex-1">
                <section class="panel-memberlist__container panel-bg-white panel-rounded-2xl panel-py-6 panel-px-3">
                    <div class="panel-flex panel-items-stretch panel-justify-between panel-mb-6">
                        <div class="panel-flex panel-flex-col panel-justify-between">
                            <h1 class="panel-font-bold panel-text-zinc-900">لیست اعضا</h1>
                            <p id="comgroupAgencyText" class="panel-text-xs panel-text-zinc-900 panel-hidden">گروه
                                کمیسیونی آلوینی
                                آژانس بیسیس فلای</p>
                        </div>
                        <button
                            class="userlist__modal-open panel-relative panel-group panel-overflow-hidden panel-z-10 panel-flex panel-justify-center panel-w-44 panel-h-14 panel-border panel-border-solid panel-border-primary-800 panel-rounded-xl panel-bg-primary-800 panel-text-xs panel-text-white panel-mr-auto panel-transition-all panel-duration-300 hover:panel-text-primary-800">
                            <div class="panel-relative panel-z-10 panel-flex panel-items-center">
                                <svg width="48" height="48">
                                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-plus-person"></use>
                                </svg>
                                <span>افزودن عضو جدید</span>
                            </div>
                            <span
                                class="panel-absolute panel-w-full panel-inset-0 panel-transition-transform panel-duration-300 panel-h-14 panel-origin-right panel-scale-x-0 panel-bg-white group-hover:panel-scale-x-100"></span>
                        </button>
                    </div>
                    <div class="panel_grid_style">
                        <basis core="component.grid.grid" run="atclient" dataMemberName="cms.list" options="UsersList">
                        </basis>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <div
        class="userlist__modal panel-modal-overlay panel-fixed panel-inset-0 panel-z-50 panel-flex panel-items-center panel-justify-center panel-bg-black/50 panel-backdrop-blur-sm panel-hidden">
        <div
            class="userlist__modal-content panel-modal-content panel-bg-white panel-rounded-xl panel-p-4 panel-max-w-4xl panel-w-full panel-mx-auto">
            <div
                class="panel-modal-header panel-flex panel-items-center panel-justify-between panel-border-b panel-border-solid panel-border-zinc-200 panel-pb-5 panel-mb-5">
                <h2 class="panel-modal-title panel-font-bold panel-text-zinc-900">افزودن عضو جدید</h2>
                <button
                    class="userlist__modal-close panel-modal-close-button panel-w-12 panel-h-12 panel-rounded-full panel-flex panel-items-center panel-justify-center panel-text-zinc-600 hover:panel-bg-zinc-100 panel-transition-all panel-duration-300"
                    aria-label="Close">
                    <svg width="48" height="48">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-close"></use>
                    </svg>
                </button>
            </div>
            <h3 class="panel-text-zinc-900 panel-mb-6">مشخصات</h3>
            <form class="userlist__trust-form panel-flex panel-items-center panel-gap-6" method="post" novalidate>
                <input type="text" name="Username" data-name="@Field"
                    class="userlist__trust-input panel-w-full panel-bg-zinc-100 panel-rounded-xl panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-h-14 panel-placeholder-zinc-400 panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white focus:panel-shadow-md panel-transition panel-duration-300"
                    placeholder="ایمیل یا شماره تماس" autocomplete="off" />

                <input type="hidden" value="[##cms.cms.ownerid##]" name="Ownerid" />
                <input type="hidden" value="[##cms.cms.domainid##]" name="Dmnid" />
                <input type="hidden" value="[##cms.request.clientip##]" name="Ipaddress" />
                <input type="hidden" value="1" name="Lid" />

                <button type="submit"
                    class="userlist__trust-submit panel-flex panel-shrink-0 panel-items-center panel-justify-center panel-w-40 panel-h-14 panel-font-medium panel-text-sm panel-rounded-xl panel-bg-primary-800 panel-text-white panel-transition-all panel-duration-300 hover:panel-shadow-xl hover:panel-scale-90">
                    ثبت
                </button>
            </form>

            <div class="userlist__trust-message panel-mt-6"></div>

            <div class="userlist__trust-loading panel-flex panel-items-center panel-justify-center panel-hidden">
                <div class="panel-loading__content"></div>
            </div>
        </div>
    </div>
    <div id="removeUserModal"
        class="panel-fixed panel-inset-0 panel-z-50 panel-flex panel-items-center panel-justify-center panel-bg-black/50 panel-hidden">
        <div class="panel-bg-white panel-rounded-2xl panel-w-96
                panel-p-6 panel-shadow-xl">

            <h3 class="panel-text-lg panel-font-bold panel-text-zinc-800 panel-mb-3">
                حذف کاربر
            </h3>

            <p class="panel-text-sm panel-text-zinc-600 panel-mb-6">
                آیا از حذف این کاربر مطمئن هستید؟
            </p>

            <input type="hidden" id="removeUserId" />

            <div class="panel-flex panel-justify-end panel-gap-3">
                <button type="button" class="panel-px-4 panel-py-2 panel-rounded-lg
                           panel-bg-zinc-200 panel-text-zinc-700
                           hover:panel-bg-zinc-300" onclick="closeRemoveUserModal()">
                    انصراف
                </button>

                <button type="button" class="panel-px-4 panel-py-2 panel-rounded-lg
                           panel-bg-red-500 panel-text-white
                           hover:panel-bg-red-700" onclick="confirmRemoveUser()">
                    حذف
                </button>
            </div>

            <div id="removeUserMsg" class="panel-hidden panel-text-sm panel-rounded-lg panel-p-2 panel-mt-3"></div>
        </div>
    </div>
    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.querySelector('.userlist__modal')
            const modalContent = document.querySelector('.userlist__modal-content')
            const openBtn = document.querySelector('.userlist__modal-open')
            const closeBtn = document.querySelector('.userlist__modal-close')

            if (!modal || !openBtn || !closeBtn) return

            function openModal() {
                modal.classList.remove('panel-hidden')
            }

            function closeModal() {
                modal.classList.add('panel-hidden')
            }

            openBtn.addEventListener('click', (e) => {
                e.preventDefault()
                openModal()
            })

            closeBtn.addEventListener('click', (e) => {
                e.preventDefault()
                closeModal()
            })

            modal.addEventListener('click', (e) => {
                if (modalContent && modalContent.contains(e.target)) return
                closeModal()
            })

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal()
            })
        })
    </script>
    <script>
        let userListloader
        let userListbtn
        let userListmsgBox

        function setLoading(isLoading) {
            if (userListloader) userListloader.classList.toggle('panel-hidden', !isLoading)
            if (userListbtn) userListbtn.disabled = isLoading
        }

        function setMessage(html) {
            if (!userListmsgBox) return
            userListmsgBox.innerHTML = html || ''
        }

        // --- DOMContentLoaded ---
        document.addEventListener('DOMContentLoaded', () => {
            const userListForm = document.querySelector('.userlist__trust-form')
            const userListinput = userListForm?.querySelector('.userlist__trust-input')

            userListloader = document.querySelector('.userlist__trust-loading')
            userListbtn = userListForm?.querySelector('.userlist__trust-submit')
            userListmsgBox = document.querySelector('.userlist__trust-message')

            userListForm?.addEventListener('submit', (event) => {
                event.preventDefault()
                setMessage('')
                setLoading(true)

                const username = userListinput?.value?.trim() || ''
                if (!username) {
                    setLoading(false)
                    setMessage('<p class="Error panel-text-red-500">لطفاً ایمیل یا شماره تماس را وارد کنید.</p>')
                    return
                }

                try {
                    $bc.setSource("cms.trustUserId", [{
                        result: username,
                        run: true,
                    }])

                } catch (err) {
                    setLoading(false)
                    setMessage('<p class="Error panel-text-red-500">خطا در اجرای عملیات.</p>')
                    console.error(err)
                }
            })
        })

        async function onProcessedUserInfo(args) {
            try {
                const responseJson = await args.response.json()

                $bc.setSource("cms.list",
                    Array.isArray(responseJson) ? responseJson : []
                )

            } catch (err) {
                console.log(err)
                $bc.setSource("cms.list", [])
            }
        }

        async function onProcessedComgroupAgency(args) {
            const responseJson = await args.response.json()

            const item = Array.isArray(responseJson) ? responseJson[0] : responseJson
            const title = (item?.title || '').trim()
            const agencyName = (item?.agency?.name || '').trim()

            const el = document.getElementById('comgroupAgencyText')
            if (!el) return

            if (!title && !agencyName) {
                el.textContent = ''
                el.classList.add('panel-hidden')
                return
            }

            el.textContent = agencyName
                ? `گروه کمیسیونی ${title} آژانس ${agencyName}`
                : `گروه کمیسیونی ${title}`

            el.classList.remove('panel-hidden')
        }

        window.usedForId = Number("{##cms.refreshCounters.userid##}")
        window.usedForAction = "{##cms.refreshCounters.action##}"

        async function onProcessedFindUserList(args) {
            const responseJson = await args.response.json()

            const isEmpty =
                !responseJson ||
                (typeof responseJson === "object" && Object.keys(responseJson).length === 0) ||
                !String(responseJson.userid || "").trim()

            if (isEmpty) {
                const container = document.querySelector(".panel-memberlist__container")
                if (container) {
                    container.innerHTML = `
            <div class="panel-memberlist__error panel-text-red-600 panel-bg-red-100 panel-text-center panel-rounded-lg panel-p-3 panel-mb-3">
                شما ادمین نیستید
            </div>
        `
                }
                return
            }

            $bc.setSource("cms.userProfile", [{
                ...responseJson,
                run: true,
            }])

            const baseUsersArr = String(responseJson.userid || "")
                .split(",")
                .map((x) => Number(String(x).trim()))
                .filter((x) => Number.isFinite(x) && x !== 0)

            const usersSet = new Set(baseUsersArr)

            const id = Number(window.usedForId)
            const action = String(window.usedForAction || "").toLowerCase()

            if (Number.isFinite(id) && id !== 0) {
                if (action === "remove") {
                    usersSet.delete(id)
                } else if (action === "add") {
                    usersSet.add(id)
                }
                window.usedForId = null
                window.usedForAction = null
            }

            $bc.setSource("cms.userID", [{
                users: Array.from(usersSet),
                run: true,
            }])
        }
        async function onProcessedCounterAdd(args) {
            try {
                const responseJson = await args.response.json()

                setLoading(false)

                const errorid = responseJson.errorid
                let message = ''

                switch (errorid) {
                    case 5:
                        message = '<p class="success panel-text-green-600">با موفقیت ثبت شد.</p>'
                        addUsedForId = Number(responseJson.usedforid)
                        window.usedForId = Number(addUsedForId)
                        window.usedForAction = "add"
                        $bc.setSource("cms.refreshCounters", [{
                            userid: addUsedForId
                        }])
                        break
                    case 31:
                        message = '<p class="Error panel-text-red-500">این کاربر در Trustlogin ثبت نشده است.</p>'
                        break
                    case 9:
                        message = `<p class="Error panel-text-red-500">${responseJson.description || responseJson.message || 'خطای نامشخص رخ داد.'}</p>`
                        break
                    case 8:
                        message = `<p class="Error panel-text-red-500">${responseJson.message || 'خطا در سرویس trust.'}</p>`
                        break
                    default:
                        if (errorid && errorid != 0) {
                            message = `<p class="Error panel-text-red-500">${responseJson.message || 'خطای نامشخص رخ داد.'}</p>`
                        } else {
                            message = '<p class="success panel-text-green-600">با موفقیت ثبت شد.</p>'
                        }
                }

                const messageEl = document.querySelector('.userlist__trust-message')
                const inputEl = document.querySelector('.userlist__trust-input')

                messageEl.innerHTML = message

                setTimeout(() => {
                    messageEl.innerHTML = ''
                    if (inputEl) inputEl.value = ''
                }, 3500)

            } catch (err) {
                console.error(err)
                document.querySelector('.userlist__trust-message').innerHTML =
                    '<p class="Error panel-text-red-500">خطا در پردازش پاسخ سرور.</p>'
            }
        }

        function setRemoveUserMsg(text, isSuccess) {
            const el = document.getElementById('removeUserMsg')
            if (!el) return

            el.classList.remove('panel-hidden')
            el.classList.toggle('panel-text-green-700', !!isSuccess)
            el.classList.toggle('panel-bg-green-50', !!isSuccess)
            el.classList.toggle('panel-text-red-700', !isSuccess)
            el.classList.toggle('panel-bg-red-50', !isSuccess)

            el.textContent = text
        }

        function clearRemoveUserMsg() {
            const el = document.getElementById('removeUserMsg')
            if (!el) return
            el.textContent = ''
            el.classList.add('panel-hidden')
            el.classList.remove('panel-text-green-600', 'panel-bg-green-50', 'panel-text-red-600', 'panel-bg-red-50')
        }

        function openRemoveUserModal(userid) {
            selectedUserId = userid
            document.querySelector('#removeUserId').value = userid
            clearRemoveUserMsg()
            document.querySelector('#removeUserModal')?.classList.remove('panel-hidden')
        }

        function closeRemoveUserModal() {
            selectedUserId = null;
            document.querySelector('#removeUserModal')?.classList.add('panel-hidden');
        }

        function confirmRemoveUser() {
            const removedId = (document.getElementById('removeUserId')?.value || '').trim()
            if (!removedId) {
                closeRemoveUserModal()
                return
            }

            window.usedForId = Number(removedId)
            window.usedForAction = "remove"

            $bc.setSource("cms.refreshCounters", [{
                userid: removedId,
                run: true,
            }])
        }

        async function onProcessedDeleteUser(args) {
            const res = await args.response.json()
            const ok = Number(res?.errorid) === 1

            if (ok) {
                setRemoveUserMsg('حذف با موفقیت انجام شد', true)
                setTimeout(() => closeRemoveUserModal(), 900)
            } else {
                setRemoveUserMsg(res?.message || 'حذف انجام نشد', false)
            }
        }

        var UsersList = {
            columns: {

                firstName: {
                    title: "نام",
                    filter: true,
                    sort: false,
                    cellMaker: (row) =>
                        `<p>${row.firstName ?? "-"}</p>`,
                },

                lastName: {
                    title: "نام خانوادگی",
                    filter: true,
                    sort: false,
                    cellMaker: (row) =>
                        `<p>${row.lastName ?? "-"}</p>`,
                },

                email: {
                    title: "ایمیل",
                    filter: true,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row.email ?? "-"}</p>`,
                },

                mobile: {
                    title: "موبایل",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const code = row.code ?? ""
                        const mobile = row.mobile ?? ""
                        return `<p class="panel-ltr">${code}${mobile}</p>`
                    },
                },
                operation: {
                    title: "حذف",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        return `
        <div class="panel-flex panel-items-center panel-justify-center panel-gap-2">

            <button
                type="button"
                class="panel-group panel-flex panel-items-center panel-justify-center
                       panel-w-12 panel-h-12 panel-bg-red-100 panel-rounded-xl
                       panel-transition-all panel-duration-200 hover:panel-bg-red-500"
                onclick="openRemoveUserModal(${row.userid})"
                title="حذف">

                <svg width="24" height="24">
                    <use class="panel-text-red-500 panel-transition-all panel-duration-200
                            group-hover:panel-text-white"
                        href="/userPanel/images/panel-sprite-icons.svg#icon-trash"></use>
                </svg>
            </button>

        </div>
        `;
                    }
                }
            },

            filter: 'row',
            rowNumber: 'ردیف',
            defaultSort: false,
            direction: "rtl",
            paging: 50,
            information: true,
            firstAndLastBtn: true,
            culture: {
                labels: {
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },

            noData: (td) => {
                td.innerHTML = `<div class="noData">
            <div class="icon panel-flex panel-justify-center panel-mb-3">
                <svg width="70" height="70">
                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                </svg>
            </div>
            <div class="text">
                ${translate('no_items_found')}
            </div>
        </div>`
            },

            mode: "grid",
            pageCount: false
        }

    </script>
</body>

</html>
