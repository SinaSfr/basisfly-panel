<basis core="api" name="find_user_list" run="atclient" url="https://basisfly.com/panel/[##cms.cookie.rkey##]"
    method="post" body='{ 
        "name": "db",
        "mid": "20",
        "member":[{ 
            "name": "q", 
            "type":"list",
            "request": "find_user_list"
        }]} ' content-type="application/json" onProcessed="onProcessedFindUserList" triggers="cms.refreshCounters">
</basis>


<basis core="api" name="usersinfo" run="atclient" url="https://api.trust-login.com/[##cms.cookie.rkey##]/fa/usersinfo"
    method="post" body='{
        "users": [{##cms.userID.users##}],
        "type": "userid"
    }' content-type="application/json" onProcessed="onProcessedUserInfo" triggers="cms.userID" if="{##cms.userID##}">
</basis>


<basis core="api" name="commission_counter_add" run="atclient"
    url="https://basisfly.com/panel/update/[##cms.cookie.rkey##]" method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "list",
                "name": "q",
                "request": "commission_counter_add",
                "user": "{##cms.trustUserId.result##}",
                "commissonid": "{##cms.userProfile.comgroupid##}",
                "companyid": "{##cms.userProfile.agencyid##}"
            }
        ]
    } ' content-type="application/json" triggers="cms.trustUserId" if="{##cms.trustUserId.run|(false)##}"
    onProcessed="onProcessedCounterAdd">
</basis>

<basis core="api" name="agency_delete_user" run="atclient" url="https://basisfly.com/panel/new/[##cms.cookie.rkey##]"
    method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "scalar",
                "name": "q",
                "request": "agency_delete_user",
                "agency_userid": "{##cms.refreshCounters.userid##}",
                "groupid": "{##cms.userProfile.comgroupid##}"
            }
        ]
    } ' content-type="application/json" onProcessed="onProcessedDeleteUser" triggers="cms.refreshCounters"
    if="{##cms.refreshCounters.run|(false)##}">
</basis>

<basis core="callback" run="atclient" triggers="api.comgroup_agency_by_user" if="{##api.comgroup_agency_by_user##}"
    method="comgroupAgencyUserListCallback">
</basis>

<basis core="callback" run="atclient" triggers="cms.form" if="{##cms.form|(false)##}" method="callbackAddUser">
</basis>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const modal = document.querySelector(".userlist__modal");
            const modalContent = document.querySelector(".userlist__modal-content");
            const openBtn = document.querySelector(".userlist__modal-open");
            const closeBtn = document.querySelector(".userlist__modal-close");

            if (!modal || !openBtn) return;

            function resetMessages() {
                if (typeof hideMessages === "function") hideMessages(modal);
            }

            function resetInputs() {
                const input = modal.querySelector(".userlist__trust-input");
                if (input) input.value = "";
            }

            function openModal() {
                resetMessages();
                resetInputs();
                modal.classList.remove("panel-hidden");
            }

            function closeModal() {
                resetMessages();
                resetInputs();
                modal.classList.add("panel-hidden");
            }

            openBtn.addEventListener("click", (e) => {
                e.preventDefault();
                openModal();
            });

            if (closeBtn) {
                closeBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    closeModal();
                });
            }

            // بستن با کلیک بیرون محتوا
            modal.addEventListener("click", (e) => {
                if (modalContent && modalContent.contains(e.target)) return;
                closeModal();
            });

            // بستن با Escape
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closeModal();
            });
        });
    </script>
    <script>
        function buttonLoading(btn, state = true) {
            if (!btn) return;

            if (state) {
                // جلوگیری از تکرار
                if (btn.classList.contains("is-loading")) return;

                btn.classList.add("is-loading");

                // ذخیره وضعیت قبلی
                if (btn.dataset.wasDisabled == null) {
                    btn.dataset.wasDisabled = btn.disabled ? "1" : "0";
                }

                // ذخیره محتوا (فقط یک بار)
                if (btn.dataset.oldText == null) {
                    btn.dataset.oldText = btn.innerHTML;
                }

                btn.disabled = true;
                btn.setAttribute("aria-busy", "true");

                // جایگزینی کامل با لودینگ
                btn.innerHTML = '<div class="panel-loading__btn"></div>';
            } else {
                btn.classList.remove("is-loading");
                btn.removeAttribute("aria-busy");

                // برگرداندن محتوا
                if (btn.dataset.oldText != null) {
                    btn.innerHTML = btn.dataset.oldText;
                }

                // برگرداندن disabled به حالت قبل
                btn.disabled = btn.dataset.wasDisabled === "1";

                // پاکسازی
                delete btn.dataset.oldText;
                delete btn.dataset.wasDisabled;
            }
        }
        function ensureMessages(hostEl) {
            if (!hostEl) return null;
            if (hostEl.__messagesReady) return hostEl;

            const tpl = document.getElementById("panel-message__template");
            if (!tpl) return null;

            hostEl.appendChild(tpl.content.cloneNode(true));
            hostEl.__messagesReady = true;
            return hostEl;
        }

        function resolveHost(fromElOrHost) {
            // 1) اگر چیزی پاس داده نشد، اولین host صفحه
            if (!fromElOrHost) return document.querySelector(".panel-message__host");

            // 2) اگر یک Element پاس داده شد
            if (fromElOrHost instanceof Element) {
                // اگر خود host بود
                if (fromElOrHost.classList.contains("panel-message__host")) return fromElOrHost;

                // ✅ اول داخل خودش بگرد (برای وقتی host "داخل" parent است)
                const inside = fromElOrHost.querySelector?.(".panel-message__host");
                if (inside) return inside;

                // ✅ بعد اگر داخلش نبود، برو بالا (closest)
                return fromElOrHost.closest(".panel-message__host") || document.querySelector(".panel-message__host");
            }

            // 3) fallback
            return document.querySelector(".panel-message__host");
        }

        function showSuccessMessage(fromElOrHost, text = "تکمیل شد") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__success-text");

            failedWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            successWrap?.classList.remove("panel-hidden");
        }

        function showFailedMessage(fromElOrHost, text = "به‌روزرسانی ناموفق بود") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__failed-text");

            successWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            failedWrap?.classList.remove("panel-hidden");
        }

        function hideMessages(fromElOrHost) {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            host.querySelector(".panel-successed__message__content")?.classList.add("panel-hidden");
            host.querySelector(".panel-failed__message__content")?.classList.add("panel-hidden");
        }
    </script>
    <script>
        function clearMessage(scopeEl) {
            if (typeof hideMessages === "function") hideMessages(scopeEl);
        }

        function showError(scopeEl, text) {
            if (typeof showFailedMessage === "function") showFailedMessage(scopeEl, text);
        }

        function showSuccess(scopeEl, text) {
            if (typeof showSuccessMessage === "function") showSuccessMessage(scopeEl, text);
        }
        async function callbackAddUser(args) {
            const userListForm = document.querySelector(".userlist__trust-form");
            const userListinput = userListForm?.querySelector(".userlist__trust-input");
            const userListbtn = userListForm?.querySelector(".userlist__trust-submit");

            hideMessages(userListForm);

            const username = userListinput?.value?.trim() || "";
            if (!username) {
                showFailedMessage(userListForm, "لطفاً ایمیل یا شماره تماس را وارد کنید.");
                return;
            }

            buttonLoading(userListbtn, true);

            try {
                $bc.setSource("cms.trustUserId", [{ result: username, run: true }]);
            } catch (err) {
                buttonLoading(userListbtn, false);
                showFailedMessage(userListForm, "خطا در اجرای عملیات.");
                console.error(err);
            }
        }

        async function onProcessedUserInfo(args) {
            try {
                const responseJson = await args.response.json()

                $bc.setSource("cms.list",
                    Array.isArray(responseJson) ? responseJson : []
                )

            } catch (err) {
                console.log(err)
                $bc.setSource("cms.list", [])
            }
        }

        async function comgroupAgencyUserListCallback(args) {
            try {

                let rows = null

                if (args?.source) {
                    rows =
                        args.source.rows ||
                        args.source._rows ||
                        args.source.source?.rows ||
                        args.source.source?._rows ||
                        null
                }

                const item = Array.isArray(rows) && rows.length ? rows[0] : null
                const title = String(item?.title ?? '').trim()
                const agencyName = String(item?.agency?.name ?? '').trim()

                const el = document.getElementById('comgroupAgencyText')
                if (!el) return

                if (!title && !agencyName) {
                    el.textContent = ''
                    el.classList.add('panel-hidden')
                    return
                }

                el.textContent = agencyName
                    ? `گروه کمیسیونی ${title} آژانس ${agencyName}`
                    : `گروه کمیسیونی ${title}`

                el.classList.remove('panel-hidden')
            } catch (e) {
                console.error('comgroupAgencyUserListCallback error:', e)
            }
        }
        window.usedForId = Number("{##cms.refreshCounters.userid##}")
        window.usedForAction = "{##cms.refreshCounters.action##}"

        async function onProcessedFindUserList(args) {
            const responseJson = await args.response.json()

            const isEmpty =
                !responseJson ||
                (typeof responseJson === "object" && Object.keys(responseJson).length === 0) ||
                !String(responseJson.userid || "").trim()

            if (isEmpty) {
                const container = document.querySelector(".panel-memberlist__container")
                if (container) {
                    container.innerHTML = `
            <div class="panel-memberlist__error panel-text-red-600 panel-bg-red-100 panel-text-center panel-rounded-lg panel-p-3 panel-mb-3">
                شما ادمین نیستید
            </div>
        `
                }
                return
            }

            $bc.setSource("cms.userProfile", [{
                ...responseJson,
                run: true,
            }])

            const baseUsersArr = String(responseJson.userid || "")
                .split(",")
                .map((x) => Number(String(x).trim()))
                .filter((x) => Number.isFinite(x) && x !== 0)

            const usersSet = new Set(baseUsersArr)

            const id = Number(window.usedForId)
            const action = String(window.usedForAction || "").toLowerCase()

            if (Number.isFinite(id) && id !== 0) {
                if (action === "remove") {
                    usersSet.delete(id)
                } else if (action === "add") {
                    usersSet.add(id)
                }
                window.usedForId = null
                window.usedForAction = null
            }

            $bc.setSource("cms.userID", [{
                users: Array.from(usersSet),
                run: true,
            }])
        }
        async function onProcessedCounterAdd(args) {
            const userListForm = document.querySelector(".userlist__trust-form");
            const btn = userListForm?.querySelector(".userlist__trust-submit");

            try {
                const responseJson = await args.response.json();

                // خاموش کردن لودینگ دکمه
                buttonLoading(btn, false);

                const errorid = Number(responseJson?.errorid || 0);

                switch (errorid) {
                    case 5: {
                        showSuccessMessage(userListForm, "با موفقیت ثبت شد.");

                        addUsedForId = Number(responseJson.usedforid);
                        window.usedForId = Number(addUsedForId);
                        window.usedForAction = "add";

                        $bc.setSource("cms.refreshCounters", [{
                            userid: addUsedForId
                        }]);

                        break;
                    }

                    case 31: {
                        showFailedMessage(userListForm, "این کاربر در Trustlogin ثبت نشده است.");
                        break;
                    }

                    case 9: {
                        showFailedMessage(
                            userListForm,
                            responseJson.description || responseJson.message || "خطای نامشخص رخ داد."
                        );
                        break;
                    }

                    case 8: {
                        showFailedMessage(
                            userListForm,
                            responseJson.message || "خطا در سرویس trust."
                        );
                        break;
                    }

                    default: {
                        if (errorid && errorid !== 0) {
                            showFailedMessage(userListForm, responseJson.message || "خطای نامشخص رخ داد.");
                        } else {
                            showSuccessMessage(userListForm, "با موفقیت ثبت شد.");
                        }
                    }
                }
            } catch (err) {
                buttonLoading(btn, false);
                showFailedMessage(userListForm, "خطا در پردازش پاسخ سرویس.");
                console.error(err);
            }
        }

        function openRemoveUserModal(userid) {
            selectedUserId = userid;
            document.querySelector("#removeUserId").value = userid;

            hideMessages(document.querySelector("#removeUserModal"));

            document.querySelector("#removeUserModal")?.classList.remove("panel-hidden");
        }

        function closeRemoveUserModal() {
            selectedUserId = null;
            document.querySelector("#removeUserModal")?.classList.add("panel-hidden");
        }

        function confirmRemoveUser(btn) {
            const removedId = (document.getElementById("removeUserId")?.value || "").trim();
            if (!removedId) {
                closeRemoveUserModal();
                return;
            }

            // پیام قبلی پاک
            hideMessages(document.querySelector("#removeUserModal"));

            // لودینگ روی دکمه تایید
            if (btn) {
                btn.dataset.loading = "true";
                buttonLoading(btn, true);
            }

            window.usedForId = Number(removedId);
            window.usedForAction = "remove";

            $bc.setSource("cms.refreshCounters", [{
                userid: removedId,
                run: true,
            }]);
        }

        async function onProcessedDeleteUser(args) {
            const modal = document.querySelector("#removeUserModal");

            // دکمه‌ای که در حال لودینگ بوده
            const btn = modal?.querySelector('[data-loading="true"]') || document.querySelector('[data-loading="true"]');

            try {
                const res = await args.response.json();
                const ok = Number(res?.errorid) === 1;

                // خاموش کردن لودینگ
                if (btn) {
                    buttonLoading(btn, false);
                    delete btn.dataset.loading;
                }

                if (ok) {
                    showSuccessMessage(modal, "حذف با موفقیت انجام شد");
                    setTimeout(() => closeRemoveUserModal(), 1500);
                } else {
                    showFailedMessage(modal, res?.message || "حذف انجام نشد");
                }
            } catch (err) {
                if (btn) {
                    buttonLoading(btn, false);
                    delete btn.dataset.loading;
                }
                showFailedMessage(modal, "خطا در پردازش پاسخ سرویس");
                console.error(err);
            }
        }

        var UsersList = {
            columns: {
