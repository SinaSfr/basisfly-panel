    method="post" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "list",
                "name": "q",
                "request": "currency_conversion",
                "dmnid": [##cms.cms.domainid##],
                "price": "{##cms.price.priceValue##}",
                "unit": "{##cms.unit.value##}"
            }
        ]
    }' content-type="application/json" onProcessed="onProcessedACurrencyConversion" triggers="cms.unit"
    if="{##cms.unit.run|(false)##}">
</basis>

    <script>
        function ensureMessages(hostEl) {
            if (!hostEl) return null;
            if (hostEl.__messagesReady) return hostEl;

            const tpl = document.getElementById("panel-message__template");
            if (!tpl) return null;

            hostEl.appendChild(tpl.content.cloneNode(true));
            hostEl.__messagesReady = true;
            return hostEl;
        }

        function resolveHost(fromElOrHost) {
            if (!fromElOrHost) return document.querySelector(".panel-message__host");

            if (fromElOrHost instanceof Element) {
                if (fromElOrHost.classList.contains("panel-message__host")) return fromElOrHost;
                return fromElOrHost.closest(".panel-message__host") || document.querySelector(".panel-message__host");
            }

            return document.querySelector(".panel-message__host");
        }

        function showSuccessMessage(fromElOrHost, text = "تکمیل شد") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__success-text");

            failedWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            successWrap?.classList.remove("panel-hidden");
        }

        function showFailedMessage(fromElOrHost, text = "به‌روزرسانی ناموفق بود") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__failed-text");

            successWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            failedWrap?.classList.remove("panel-hidden");
        }

        function hideMessages(fromElOrHost) {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            host.querySelector(".panel-successed__message__content")?.classList.add("panel-hidden");
            host.querySelector(".panel-failed__message__content")?.classList.add("panel-hidden");
        }
    </script>
    <script>
        window.pricePayment = 0;

        (function () {
            "use strict";

            function getSectionRoot(el) {
                return el?.closest?.("section") || document;
            }

            function getPopup(root) {
                return root.querySelector(".panel-increase-balance__popup");
            }

            function getAmountInput(root) {
                return root.querySelector(".panel-increase-balance__amount-input");
            }

            function getGateways(root) {
                return root.querySelector(".panel-increase-balance__gateways");
            }

            function getMessageHost(root) {
                return root.querySelector(".panel-message__host");
            }

            function normalizeNumber(val) {
                return String(val || "").replace(/[^\d]/g, "");
            }

            function hideGateways(root) {
                const gateways = getGateways(root);
                if (gateways) gateways.classList.add("panel-hidden");
            }

            function showGateways(root) {
                const gateways = getGateways(root);
                if (gateways) gateways.classList.remove("panel-hidden");
            }

            // ✅ جایگزین showError/clearError با پیام Failed + استایل input
            function showError(root, msg) {
                const amountInput = getAmountInput(root);
                if (!amountInput) return;

                showFailedMessage(root, msg);

                amountInput.classList.add("panel-border-red-500");
                amountInput.classList.remove("panel-border-zinc-200");
                amountInput.setAttribute("aria-invalid", "true");

                hideGateways(root);
            }

            function clearError(root) {
                const amountInput = getAmountInput(root);
                if (!amountInput) return;

                hideMessages(root);

                amountInput.classList.remove("panel-border-red-500");
                amountInput.classList.add("panel-border-zinc-200");
                amountInput.removeAttribute("aria-invalid");
            }

            function failPayment(root, messageText) {
                showError(root, messageText);
                window.pricePayment = 0;
                return;
            }

            function openPopup(root) {
                const popup = getPopup(root);
                if (!popup) return;

                clearError(root);
                hideGateways(root);
                window.pricePayment = 0;

                const amountInput = getAmountInput(root);
                if (amountInput) amountInput.value = "";

                popup.classList.remove("panel-hidden");
                popup.setAttribute("aria-hidden", "false");
                document.body.style.overflow = "hidden";
            }

            function closePopup(root) {
                const popup = getPopup(root);
                if (!popup) return;

                clearError(root);
                hideGateways(root);
                window.pricePayment = 0;

                const amountInput = getAmountInput(root);
                if (amountInput) amountInput.value = "";

                popup.classList.add("panel-hidden");
                popup.setAttribute("aria-hidden", "true");
                document.body.style.overflow = "";
            }

            document.addEventListener("click", (e) => {
                const openBtn = e.target.closest(".panel-increase-balance__open-btn");
                if (!openBtn) return;

                e.preventDefault();
                const root = getSectionRoot(openBtn);
                openPopup(root);
            });

            document.addEventListener("click", (e) => {
                const closeBtn = e.target.closest(".panel-increase-balance__close-btn");
                if (!closeBtn) return;

                e.preventDefault();
                const root = getSectionRoot(closeBtn);
                closePopup(root);
            });

            document.addEventListener("click", (e) => {
                const popupEl = e.target.closest(".panel-increase-balance__popup");
                if (!popupEl) return;

                if (e.target !== popupEl) return;

                const root = getSectionRoot(popupEl);
                closePopup(root);
            });

            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;

                const popup = document.querySelector(".panel-increase-balance__popup:not(.panel-hidden)");
                if (!popup) return;

                const root = getSectionRoot(popup);
                closePopup(root);
            });

            document.addEventListener("keydown", (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;

                const closeBtn = e.target.closest(".panel-increase-balance__close-btn");
                if (!closeBtn) return;

                e.preventDefault();
                const root = getSectionRoot(closeBtn);
                closePopup(root);
            });

            document.addEventListener("input", (e) => {
                const input = e.target;
                if (!(input instanceof HTMLInputElement)) return;
                if (!input.classList.contains("panel-increase-balance__amount-input")) return;

                const root = getSectionRoot(input);

                const cleaned = normalizeNumber(input.value);
                if (input.value !== cleaned) input.value = cleaned;

                if (!cleaned || cleaned.length < 5) {
                    hideGateways(root);
                    window.pricePayment = 0;
                }

                clearError(root);
            });

            document.addEventListener("click", (e) => {
                const payBtn = e.target.closest(".panel-increase-balance__pay-btn");
                if (!payBtn) return;

                const root = getSectionRoot(payBtn);
                const amountInput = getAmountInput(root);
                if (!amountInput) return;

                e.preventDefault();

                const cleaned = normalizeNumber(amountInput.value);

                if (!cleaned) {
                    return failPayment(root, translate("enter_amount"));
                }

                if (cleaned.length < 5) {
                    return failPayment(root, translate("amount_min_5_digits"));
                }

                window.pricePayment = Number(cleaned);

                $bc.setSource("cms.setTrueWebservice", [{ run: true }]);
                $bc.setSource("cms.price", [{ priceValue: cleaned }]);

                clearError(root);
                showGateways(root);
            });
        })();
    </script>

        function tokenCallback(args) {
            try {
                const paymentDiv = document.querySelector('div[data-payment-type]');
                const invoicetypeElement = document.querySelector('.panel-invoice__value');
                const id = invoicetypeElement?.getAttribute('data-factorid') || 0;

                const source = args.source?.rows;
                if (source && source[0].url_gateway) {
                    // ارسال داده‌ها به cms.save-inputs اگر payment-type برابر با 'invoice' باشد
                    if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'invoice') {
                        $bc.setSource("cms.save-inputs", {
                            randomId: sixDigitNumber,
                            provider: window.bankProviderId,
                            bankid: window.bankId,
                            factorid: id,
                            session: source[0].session,
                            orderid: source[0].orderid,
                            doc_type: 6,
                        });
                    } else if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'onlineCharging') {
                        $bc.setSource("cms.save-inputs", {
                            randomId: sixDigitNumber,
                            provider: window.bankProviderId,
                            bankid: window.bankId,
                            factorid: id,
                            session: source[0].session,
                            orderid: source[0].orderid,
                            doc_type: 7,
                        });

                        $bc.setSource("cms.paymentid", {
                            orderid: source[0].orderid,
                        });
                    }

                    // بررسی متد درخواست و ارسال فرم یا انتقال به درگاه
                    if (source[0].method === 'POST') {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = source[0].form;
                        const form = tempDiv.querySelector('form');
                        if (form) {
                            document.body.appendChild(form);  // فرم را به body اضافه می‌کنیم
                            form.submit();
                        }
                    } else {
                        window.location = source[0].url_gateway;
                    }



                } else {
                    const paymentBtn = document.querySelector('.panel-handlePayment__btn[data-loading="true"]');

                    if (paymentBtn) {
                        buttonLoading(paymentBtn, false);
                        delete paymentBtn.dataset.loading; // یا paymentBtn.dataset.loading = "false"
                    }

                    const msg = "امکان اتصال به درگاه پرداخت الکترونیک وجود ندارد.";

                    const container = document.querySelector(".panel-online-charging__content");
                    const host = container?.querySelector(".panel-message__host");

                    // اگر سیستم پیام‌ها هست و host درست پیدا شد
                    if (host && typeof showFailedMessage === "function" && typeof hideMessages === "function") {
                        hideMessages(host);
                        showFailedMessage(host, msg);
                        return;
                    }

                    // fallback: UI بزرگ (اگر پیام‌ها نبود یا host نبود)
                    if (container && !document.getElementById("payment-gateway-error")) {
                        container.insertAdjacentHTML("beforeend", errorHtml);
                    }
                }
            } catch (err) {
                console.error('tokenCallback=' + err.lineNumber + ',' + err.message);
            }
        }

        function padJalaliDate(dateString) {
            if (!dateString) return '';

            const parts = dateString.split('/');
            if (parts.length !== 3) return dateString;

            let [y, m, d] = parts;

            m = String(parseInt(m)).padStart(2, '0');
            d = String(parseInt(d)).padStart(2, '0');

            return `${y}/${m}/${d}`;
        }


        function replaceSlashWithDash(dateString) {
            if (!dateString) return '';
            return dateString.replace(/\//g, '-');
        }


        function jalaliToGregorian(dateString) {
            if (!dateString) return '';

            const parts = dateString.split('/');
            if (parts.length !== 3) return '';

            let jy = parseInt(parts[0]);
            let jm = parseInt(parts[1]);
            let jd = parseInt(parts[2]);

            jy += 1595;
            let days = -355668 + (365 * jy) +
                Math.floor(jy / 33) * 8 +
                Math.floor(((jy % 33) + 3) / 4) +
                jd +
                (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);

            let gy = 400 * Math.floor(days / 146097);
            days %= 146097;

            if (days > 36524) {
                gy += 100 * Math.floor(--days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }

            gy += 4 * Math.floor(days / 1461);
            days %= 1461;

            if (days > 365) {
                gy += Math.floor((days - 1) / 365);
                days = (days - 1) % 365;
            }

            let gd = days + 1;

            const months = [
                0, 31,
                (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0 ? 29 : 28,
                31, 30, 31, 30, 31, 31, 30, 31, 30, 31
            ];

            let gm;
            for (gm = 1; gm <= 12 && gd > months[gm]; gm++) {
                gd -= months[gm];
            }

            return `${gy}-${String(gm).padStart(2, '0')}-${String(gd).padStart(2, '0')}`;
        }

        function buttonLoading(btn, state = true) {
            if (!btn) return;

            if (state) {
                // جلوگیری از تکرار
                if (btn.classList.contains("is-loading")) return;

                btn.classList.add("is-loading");

                // ذخیره وضعیت قبلی
                if (btn.dataset.wasDisabled == null) {
                    btn.dataset.wasDisabled = btn.disabled ? "1" : "0";
                }

                // ذخیره محتوا (فقط یک بار)
                if (btn.dataset.oldText == null) {
                    btn.dataset.oldText = btn.innerHTML;
                }

                btn.disabled = true;
                btn.setAttribute("aria-busy", "true");

                // جایگزینی کامل با لودینگ
                btn.innerHTML = '<div class="panel-loading__btn"></div>';
            } else {
                btn.classList.remove("is-loading");
                btn.removeAttribute("aria-busy");

                // برگرداندن محتوا
                if (btn.dataset.oldText != null) {
                    btn.innerHTML = btn.dataset.oldText;
                }

                // برگرداندن disabled به حالت قبل
                btn.disabled = btn.dataset.wasDisabled === "1";

                // پاکسازی
                delete btn.dataset.oldText;
                delete btn.dataset.wasDisabled;
            }
        }
        async function callbackWalletSearch(args) {
            let btn = null
            try {
                const form =
                    args?.source?.el || document.querySelector('form[name="cms.form"]')

                // دکمه submit فرم
                btn = form.querySelector('.panel-submit__btn')

                buttonLoading(btn, true)

                const getVal = (sel) => {
                    const el = form.querySelector(sel)
                    return el ? String(el.value ?? '').trim() : ''
                }

                const setHidden = (sel, value) => {
                    const el = form.querySelector(sel)
                    if (!el) return
                    el.value = value || ''
                    el.dispatchEvent(new Event('input', { bubbles: true }))
                    el.dispatchEvent(new Event('change', { bubbles: true }))
                }

                const factorid = getVal('input[name="factorid"]')
                const doctypeid = getVal('input[name="doctypeid"]')

                const dp = form.querySelector('.date-picker-input')
                const fJalaliRaw = dp
                    ? String(dp.getAttribute('data-datepicker-sstring') || '').trim()
                    : ''
                const tJalaliRaw = dp
                    ? String(dp.getAttribute('data-datepicker-to-sstring') || '').trim()
                    : ''

                const fJalali = padJalaliDate(fJalaliRaw)
                const tJalali = padJalaliDate(tJalaliRaw)

                const begindate = fJalali ? jalaliToGregorian(fJalali) : ''
                const enddate = tJalali ? jalaliToGregorian(tJalali) : ''

                setHidden('.fdate-string', begindate)
                setHidden('.tdate-string', enddate)

                const main_json = {
                    factorid: factorid || '',
                    doctype: doctypeid || '',
                    fromdate: begindate || '',
                    todate: enddate || '',
                }

                $bc.setSource('cms.search', main_json)
