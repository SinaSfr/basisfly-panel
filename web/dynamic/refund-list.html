<basis core="api" name="invoice_refund_list" url="https://basisfly.com/panel/main/list/[##cms.cookie.rkey##]"
    method="post" body='{
"member" : [
    {
        "search" : {
            "lid": 1,
            "user_id": 1006946
        },
        "pageindex" : "{##cms.paging.pageno|(1)##}",
        "perpage" : "{##cms.paging.perpage|(1000)##}",
        "request" : "invoice_refund_list",
        "lid" : "1"
    }
]
}' content-type="application/json" run="atclient" triggers="cms.refundlist cms.paging"
    onProcessed="onProcessedRefundList"></basis>
<basis core="dbsource" source="basisfly" name="cms" procedurename="dbsource" run="atclient" triggers="cms.edit"
    if="{##cms.edit.run|(false)##}">
    <member name="invoice_refund_request_view" method="panel" query='{ 
        "name": "db", 
        "mid": "20",
        "member":
        [
            { 
                "name": "q",
                "type":"list",
                "request": "invoice_refund_request_view",
                "id" : "{##cms.edit.id##}"
            }
        ] 
    }' preview=""></member>
</basis>
<basis core="callback" run="atclient" triggers="cms.invoice_refund_request_view" method="callback_sourceRefundItem">
</basis>

<basis core="api" name="api.rest" url="https://basisfly.com/panel/main/update/[##cms.cookie.rkey##]" method="post"
    content-type="application/json" run="atclient" triggers="cms.close" if="{##cms.close.run|(false)##}" body='{
        "name": "db",
        "mid": "20",
        "member": [
            {
                "type": "scalar",
                "name": "q",
                "request": "invoice_refund_request_close",
                "id": "{##cms.close.id##}"
            }
        ]
    }' onprocessed="onProcessedCloseRefund">
</basis>

<basis core="api" name="invoice_refund_save" url="https://basisfly.com/panel/main/update/[##cms.cms.rkey##]"
    method="post" content-type="application/json" run="atclient" triggers="cms.save" if="{##cms.save.run|(false)##}"
    body='{ 
      "name": "db", 
      "mid": "20",
      "member":
      [ 
          { 
              "type":"list",
              "name": "q", 
              "request": "invoice_refund_save", 
              "username": "Arash Saeidi",
              "invoicetype": "1",
              "query":{##cms.save.query##}

          }
      ]
  }' onprocessed="onProcessed_save">
</basis>

<basis core="callback" run="atclient" triggers="cms.form" if="{##cms.form.run|(false)##}" method="callback_save">
</basis>

                                        </div>
                                
                                        <div class="">

                                    <textarea
                                        class="panel-w-full panel-bg-zinc-100 panel-rounded-xl panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-pt-4 panel-h-14 panel-placeholder-zinc-400 panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white focus:panel-shadow-md panel-transition panel-duration-300"

                            </textarea>

    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modalOverlay = document.querySelector('.panel-modal-overlay');
            const modalContent = document.querySelector('.panel-modal-content');
            const closeModalButton = document.getElementById('closeRefundModal');

            if (!modalOverlay || !modalContent || !closeModalButton) return;

            // تابع بستن مودال
            const closeModal = () => {
                modalOverlay.classList.add('panel-hidden');  // مخفی کردن مودال
            };

            // بستن با کلیک روی ضربدر
            closeModalButton.addEventListener('click', closeModal);

            // بستن با کلیک روی overlay
            modalOverlay.addEventListener('click', (event) => {
                if (!modalContent.contains(event.target)) {
                    closeModal();
                }
            });
        });
    </script>
    <script>
        async function onProcessedRefundList(args) {

            var emptyOptions = {
                "tableName": "cms.orders",
                "keyFieldName": null,
                "statusFieldName": null,
                "mergeType": 0,
                "extra": { 'total': 0, 'from': 0 }
            };
            try {
                const response = args.response;
                const responseJson = await response.json();
                const data = responseJson.sources[0].data;
                var options = responseJson.sources[0].options;
                if (data.length) {
                    $bc.setSource("cms.orders", data, options);
                } else {
                    $bc.setSource("cms.orders", [], emptyOptions);
                }
            } catch (e) {
                $bc.setSource("cms.orders", [], emptyOptions);
            }
        }

        function onClickShowMoreActions(element, event) {
            event.stopPropagation();

            const container = element.closest('.panel-refund__menu__container');
            if (!container) return;

            const currentMenu = container.querySelector('.panel-refund__menu');
            if (!currentMenu) return;

            const isHidden = currentMenu.classList.contains('panel-hidden');

            // بستن همه منوها
            document.querySelectorAll('.panel-refund__menu').forEach(menu => {
                menu.classList.add('panel-hidden');
                menu.classList.remove('panel-flex');
            });

            // toggle منوی فعلی
            if (isHidden) {
                currentMenu.classList.remove('panel-hidden');
                currentMenu.classList.add('panel-flex');
            }

            // بستن با کلیک بیرون
            document.onclick = function (e) {
                if (!e.target.closest('.panel-refund__menu__container')) {
                    document.querySelectorAll('.panel-refund__menu').forEach(menu => {
                        menu.classList.add('panel-hidden');
                        menu.classList.remove('panel-flex');
                    });
                }
            };
        }

        async function editInvoiceRefund(element, event, id) {

            $bc.setSource("cms.edit", [{
                id: id,
                run: true
            }]);

            const modalOverlay = document.querySelector('.panel-modal-overlay');
            if (modalOverlay) {
                modalOverlay.classList.remove('panel-hidden');
            }
        }

        async function callback_sourceRefundItem(args) {
            const resultJson = args.source?.rows;
            if (!resultJson?.length) return;

            const firstItem = resultJson[0];
            const result = firstItem?.requests?.result;
            const passengerList = firstItem?.requests?.form?.[0]?.passengerlist ?? [];


            $bc.setSource("refresh.RefundItemResult", result);

            const container = document.querySelector(".refund-search__grid");
            if (container) {
                if (passengerList.length > 0) {
                    container.classList.remove("panel-hidden");
                    $bc.setSource("refresh.RefundItemForm", passengerList);
                } else {
                    container.classList.add("panel-hidden");
                }
            }
        }

        async function set_text_area(text) {
            if (text) return String(text).replace(/<break>/g, '\n')
            return text
        }

        function qs(root, selector) {
            return (root || document).querySelector(selector)
        }

        function qsa(root, selector) {
            return Array.from((root || document).querySelectorAll(selector))
        }

        function getTextarea(container) {
            if (!container) return null
            return container.querySelector('_textarea') || container.querySelector('textarea')
        }

        function setReadonly(textarea, isReadonly) {
            if (!textarea) return
            if (isReadonly) textarea.setAttribute('readonly', 'true')
            else textarea.removeAttribute('readonly')
        }

        function applyNames(container) {
            if (!container) return

            const textarea = getTextarea(container)
            if (textarea) {
                const dn = textarea.getAttribute('data-name') || ''
                if (dn) textarea.setAttribute('name', dn)
            }

            qsa(container, 'input[type="hidden"]').forEach((inp) => {
                const dn = inp.getAttribute('data-name') || ''
                if (dn) inp.setAttribute('name', dn)
            })
        }

        function showClosedMessage() {
            const footer = qs(document, '.refund-search__footer')
            if (!footer) return

            const old = qs(footer, '.refund-search__alert')
            if (old) old.remove()

            footer.insertAdjacentHTML(
                'beforeend',
                `<div class="refund-search__alert alertMessages panel-flex panel-items-center panel-mt-6">
              <svg width="35" height="35" class="!panel-text-red-500">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-fill-warning"></use>
                    </svg>
        <span class="!panel-text-red-500">این درخواست بسته شده است، امکان درخواست جدید وجود ندارد.</span>
    </div>`,
            )
        }

        function hideActionButtons() {
            const btns = qs(document, '.refund-search__actions')
            if (btns) btns.classList.add('panel-hidden')
        }

        function clearOldAlert() {
            const footer = qs(document, '.refund-search__footer')
            if (!footer) return
            const alert = qs(footer, '.refund-search__alert')
            if (alert) alert.remove()
        }

        function setResponseMeta(len) {
            const response = qs(document, '.refund-search__response')
            if (!response) return

            const textarea = getTextarea(response)
            const idInput = qs(response, '.refund-search__response-id')
            const userIdInput = qs(response, '.refund-search__response-userid')

            if (textarea) textarea.setAttribute('data-name', `_root.description__${len}.desc`)
            if (idInput) {
                idInput.setAttribute('data-name', `_root.description__${len}.id`)
                idInput.value = String(len)
            }
            if (userIdInput) userIdInput.setAttribute('data-name', `_root.description__${len}.userid`)
        }

        function getLoggedInUserId() {
            const el = qs(document, '.userid-whoIs-logined')
            const v = el ? el.value : ''
            return String(v || '')
        }

        function getLoggedInUsername() {
            const el = qs(document, '.username-whoIs-logined')
            return el ? el.value : ''
        }

        function setResponseUserName(name) {
            const response = qs(document, '.refund-search__response')
            if (!response) return
            const userNameBox = qs(response, '.refund-search__response-username')
            if (userNameBox) userNameBox.innerHTML = name || ''
        }

        function getColumns() {
            return qsa(document, '.refund-search__column')
        }

        function getAttrNumber(el, attr) {
            if (!el) return 0
            const v = el.getAttribute(attr)
            return Number(v || 0)
        }

        function getAttrString(el, attr) {
            if (!el) return ''
            const v = el.getAttribute(attr)
            return String(v || '')
        }

        async function OnRendered_refundItem() {
            clearOldAlert()

            const cols = getColumns()
            const len = cols.length
            if (!len) return

            setResponseMeta(len)

            // ---- Layout: زوج ها mr-auto بگیرن ----
            cols.forEach((col, idx) => {
                col.classList.remove('panel-mr-auto')
                const n = idx + 1 // 1-based
                if (n % 2 === 0) col.classList.add('panel-mr-auto')
            })

            const prev = cols[len - 2] || null
            const last = cols[len - 1] || null

            const prevClose = getAttrNumber(prev, 'data-close')
            if (prevClose !== 0) {
                setReadonly(getTextarea(prev), true)
                setReadonly(getTextarea(last), true)
                hideActionButtons()
                showClosedMessage()
                return
            }

            const loggedInUserId = getLoggedInUserId()
            const prevUserId = getAttrString(prev, 'data-userid')

            if (prevUserId && prevUserId === loggedInUserId) {
                setReadonly(getTextarea(prev), false)
                applyNames(prev)

                setReadonly(getTextarea(last), true)
                return
            }

            setReadonly(getTextarea(prev), true)
            setReadonly(getTextarea(last), false)
            applyNames(last)
            setResponseUserName(getLoggedInUsername())
        }


        async function callback_save(source) {
            for (const element of source.source.rows) {
                $bc.setSource("cms.save", [{
                    "query": JSON.stringify(element._root),
                    "run": true
                },])
            }
        };

        async function closeInvoiceRefund(element, event, id) {
            $bc.setSource("cms.close", [{
                "id": id,
                "run": true
            },]);

        };

        async function onProcessedCloseRefund(args) {
            await handleProcessedResponse(args)
        }

        async function handleProcessedResponse(args) {
            const res = args?.response
            if (!res) {
                notify('error', translate('operation_failed'))
                return
            }

            if (res.status !== 200) {
                notify('error', translate('operation_failed'))
                return
            }

            let payload = null
            try {
                payload = await res.json()
            } catch { }

            const ok = isSuccessPayload(payload)

            notify(ok ? 'success' : 'error', ok ? translate('save_success') : translate('save_failed'))

            if (ok) window.location.reload()
        }

        function isSuccessPayload(payload) {
            if (payload == null) return false

            if (payload === 1001) return true
            if (String(payload?.code || '') === '1001') return true

            const errorid = payload?.errorid
            if (errorid === 1 || errorid === '1' || errorid === 5 || errorid === '5') return true

            const msg = String(payload?.msg || '').toLowerCase()
            if (msg === 'ok' || msg === 'success') return true

            return false
        }

        function notify(type, message) {
            const host = ensureNotifyHost()
            if (!host) return

            const cls =
                type === 'success'
                    ? 'panel-border-emerald-200 panel-bg-emerald-50 panel-text-emerald-800'
                    : 'panel-border-red-200 panel-bg-red-50 panel-text-red-800'

            host.innerHTML = `
    <div class="panel-border panel-rounded-xl panel-px-4 panel-py-3 panel-text-sm panel-flex panel-items-start panel-gap-2 ${cls}"
         role="status" aria-live="polite">
      <span class="panel-font-medium">${escapeHtml(String(message || ''))}</span>
    </div>
  `

            window.clearTimeout(host._t)
            host._t = window.setTimeout(() => {
                host.innerHTML = ''
            }, 3500)
        }

        function ensureNotifyHost() {
            let host = document.getElementById('referenceObjectViewMessage')
            if (host) return host

            const parent =
                document.querySelector('.refund-search__form') ||
                document.querySelector('.refund-search__overlay') ||
                document.body

            host = document.createElement('div')
            host.id = 'referenceObjectViewMessage'
            host.className = 'panel-mb-3'
            parent.insertBefore(host, parent.firstChild)
            return host
        }

        function escapeHtml(str) {
            return str
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;')
        }

        var refundList = {
            process: "mix",
            ProcessActionType: {
                search: "client",
                paging: "server",
                sort: "client"
            },
            filter: "row",
            columns: {
                request: {
                    title: "نام درخواست کننده",
                    sort: false,
                    filter: false,
                    source: row => `${row.result.username}`,
                    cellMaker: (row, data, td) =>
                        `<span class="city1 city-start">${row.result.username} </span>`
                },
                date: {
                    title: "تاریخ",
                    filter: false,
                    sort: false,
                    source: row => `${row.result.date.sstring}`,
                    cellMaker: (row, data, td) =>
                        `<div class="panel-flex panel-flex-col en-numbers">
                            <span>${row.result.date.sstring}</span>
                            <span class="messageValue">(${row.result.date.mstring})</span>
                        </div>`
                },
                houre: {
                    title: "ساعت",
                    filter: false,
                    sort: false,
                    source: row => `${row.result.hour.hour}`,
                    cellMaker: (row, data, td) =>
                        `<span class="city1 city-start en-numbers">${row.result.hour.hour} </span>`
                },
                subject: {
                    title: "عنوان درخواست",
                    filter: false,
                    sort: false,
                    source: row => `${row.result.notetype}`,
                    cellMaker: (row, data, td) =>
                        `<span class="city1 city-start">${row.result.notetype}</span>`
                },
                text: {
                    title: "متن درخواست",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const max_length = 30;

                        const note = row?.result?.note
                            ? row.result.note.replace(/<break>/g, ' ')
                            : '';

                        let main_text = note.slice(0, max_length);

                        if (note.length > max_length) {
                            main_text += ' .....';
                        }

                        return `
                            <span class="pointer">
                                <div class="InvoiceStatus">
                                    <span
                                        class="canceled en-numbers panel-w-fit panel-bg-transparent"
                                        data-descr="${note}"
                                    >
                                        ${main_text}
                                    </span>
                                </div>
                            </span>
                        `;
                    }
                },
                status: {
                    title: "وضعیت",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const answer = Number(row?.result?.answer ?? 0);

                        const statusMap = {
                            1: { className: 'answer !panel-text-green-700', text: 'بررسی شده' },
                            2: { className: 'closed !panel-text-blue-600', text: 'بسته شده' },
                            0: { className: 'notAnswer !panel-text-red-500', text: 'بررسی نشده' }
                        };

                        const status = statusMap[answer] || statusMap[0];

                        return `
                            <div class="requestStatus">
                                <span class="${status.className}">
                                    ${status.text}
                                </span>
                            </div>
                        `;
                    }
                },
                serviceType: {
                    title: "خدمات",
                    filter: false,
                    sort: false,
                    source: row => `${row.result.invoicetype}`,
                    cellMaker: (row, data, td) =>
                        `<span class="city1 city-start">${row.result.invoicetype}</span>`
                },
                factorid: {
                    title: "شماره قرارداد",
                    filter: false,
                    sort: false,
                    source: row => `${row.result.id}`,
                    cellMaker: (row, data, td) =>
                        `<span class="city1 city-start en-numbers">${row.result.id}</span>`
                },
                operation: {
                    title: "عملیات",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {

                        const id = row?.result?._id ?? '';
                        const isClosed = Number(row?.result?.close ?? 0) === 1;

                        const invoiceTypeRaw = row?.result?.invoicetype ?? '';
                        const invoiceType = String(invoiceTypeRaw).replace(/'/g, '&#39;');

                        const closeAction = !isClosed
                            ? `
        <button class="refund-list__icon-item remove panel-flex panel-items-center panel-gap-1"
           onclick="closeInvoiceRefund(this,event,'${id}')">
           <svg width="24" height="24">
               <use class="!panel-text-red-500 panel-transition-all panel-duration-200
                       group-hover:panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-trash"></use>
           </svg>
            <span class="title" data-sys-text-delete="">
                بستن درخواست
            </span>
        </button>
    `
                            : '';

                        return `
    <div class="panel-refund__menu__container panel-relative panel-cursor-pointer">
        <div class="panel-flex panel-justify-center" onclick="onClickShowMoreActions(this, event)">
        <svg width="24" height="24" class="panel-text-zinc-900">
                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-kebab-menu"></use>
                </svg>
        </div>

        <div data-refundtype='${invoiceType}' class="panel-refund__menu panel-w-32 panel-absolute panel-top-full panel-z-10 panel-left-0 panel-rounded-xl !panel-p-2 panel-bg-white panel-shadow-lg panel-border panel-border-solid panel-border-zinc-300 panel-flex-col panel-gap-4 panel-hidden">
            <button class="panel-refund__item panel-flex panel-items-center panel-gap-1" onclick="editInvoiceRefund(this,event,'${id}')">
                <svg width="24" height="24" class="panel-text-zinc-900">
                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-eye"></use>
                </svg>
                <span class="title">مشاهده</span>
            </button>

            ${closeAction}
        </div>
    </div>
`;
                    }
                },
            },
            rowNumber: "ردیف",
            defaultSort: { name: "groupname" },
            paging: [30, 20, 10],
            defaultPagingIndex: 1,
            pagingFilterType: "server",
            culture: {
                labels: {
                    "refresh": "",
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}",
                    "pageSize": "تعداد قابل نمایش در هر صفحه :"
                }
            },
            pageSize: 10,
            pageNumber: 1,
            refreshSourceId: "list.refresh",
            refresh: true,
            noData: (td) => {
                td.innerHTML = `<div class="noData">
                       <div class="icon panel-flex panel-justify-center panel-mb-3">
                            <svg width="70" height="70">
                                 <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                            </svg>
                        </div>
                                    <div class="text" style="padding-top: 10px;">
                                       ${translate('no_items_found')} </div>
                                </div>`
            },
        };

        var view_invoicePassengersRefundItemGrid = {
            columns: {
                firstname: {
                    title: "نام",
                    cellMaker: (row, data, td) => {
                        return `<input type="hidden" value="${row.firstname}" data-name="_root.passengers__${row.rownumber}.firstname"/>${row.lastname}`;
                    },
                },
                lastname: {
                    title: "نام خانوادگی",
                    cellMaker: (row, data, td) => {
                        return `<input type="hidden"  value="${row.lastname}" data-name="_root.passengers__${row.rownumber}.lastname"/>${row.lastname}`;
                    },
                },
                username: {
                    title: "کد ملی",
                    cellMaker: (row, data, td) => {
                        return `<input type="hidden"  value="${row.nationalcode}" data-name="_root.passengers__${row.rownumber}.nationalcode"/>${row.nationalcode}`;
                    },
                },
                birthdate: {
                    title: "تاریخ تولد",
                    cellMaker: (row, data, td) => {
                        return `<input type="hidden" value="${row.birthdate}" data-name="_root.passengers__${row.rownumber}.birthdate"/><span class="en-numbers">${row.birthdate}</span>`;
                    },
                },
                gender: {
                    title: "جنسیت",
                    cellMaker: (row, data, td) => {
                        if (row.gender == 0) {
                            return `<input type="hidden" value="0" data-name="_root.passengers__${row.rownumber}.gender"/>خانم`
                        } else if (row.gender == 1) {
                            return `<input type="hidden" value="1" data-name="_root.passengers__${row.rownumber}.gender"/>آقا`
                        } else {
                            return '-'
                        }

                    },
                },
                answer: {
                    title: "رنج سنی مسافر",
                    cellMaker: (row, data, td) => {
                        if (row.type == 0) {
                            return `<input  type="hidden" value="0" data-name="_root.passengers__${row.rownumber}.type"/>Infant`
                        } else if (row.type == 1) {
                            return `<input type="hidden" value="1" data-name="_root.passengers__${row.rownumber}.type"/>Child`
                        } else if (row.type == 2) {
                            return `<input type="hidden" value="2" data-name="_root.passengers__${row.rownumber}.type"/>Adult`
                        } else if (row.type == 3) {
                            return `<input type="hidden" value="3" data-name="_root.passengers__${row.rownumber}.type"/>Child`
                        } else if (row.type == 4) {
                            return `<input type="hidden" value="4" data-name="_root.passengers__${row.rownumber}.type"/>Adult (Extra)`
                        }

                    },
                },


            },

            sorting: false,
            filter: false,
            rowNumber: false,
            defaultSort: false,
            direction: "rtl",
            paging: "",
            information: false,
            firstAndLastBtn: false,

        }

    </script>
</body>

</html>
