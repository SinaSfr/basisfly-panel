    <script>
        function padJalaliDate(dateString) {
            if (!dateString) return '';

            const parts = dateString.split('/');
            if (parts.length !== 3) return dateString;

            let [y, m, d] = parts;

            m = String(parseInt(m)).padStart(2, '0');
            d = String(parseInt(d)).padStart(2, '0');

            return `${y}/${m}/${d}`;
        }

        function splitArrayIntoPairs(arr, n = 2) {
            try {
                const list = Array.isArray(arr) ? arr.filter(Boolean) : [];
                const size = Number.isFinite(Number(n)) && Number(n) > 0 ? Number(n) : 2;

                if (!list.length) return [];
                if (list.length <= size) {
                    return [`<div class="d-grid-${size}">${list.join('')}</div>`];
                }

                const result = [];
                for (let i = 0; i < list.length; i += size) {
                    const chunk = list.slice(i, i + size);
                    result.push(`<div class="d-grid-${size}">${chunk.join('')}</div>`);
                }
                return result;
            } catch {
                return [];
            }
        }
        function return_services(data) {
            const status_code = {
                "1": "در دست اقدام",
                "2": "تایید شد",
                "3": "تایید نشد",
                "33": "تایید شد",
                "4": "Available",
            };

            const valid_sids = new Set(["6", "4", "3", "13", "11"]);
            const services = data?.services || {};
            const status_p = [];

            const mapStatus = (code) => status_code[String(code)] || String(code || "");
            const safeTranslate = (x) => {
                try { return typeof translate === "function" ? translate(x) : String(x); }
                catch { return String(x); }
            };

            const pushIcon = (p_class, desc, status_text) => {
                const tooltip = String(desc || "").replace(/"/g, "&quot;");
                status_p.push(
                    `<div class="InvoiceStatus">
        <p class="${p_class} servicesStatus-invoice-list hover-service" data-widget-header-btn-tooltip="${tooltip}" data-sys-tooltip="">${status_text}</p>
      </div>`
                );
            };

            const buildHotelDesc = (details, statusText) => {
                let desc = `${safeTranslate("country_name")}: ${details?.H_countryname || ""} | ` +
                    `${safeTranslate("city_name")}: ${details?.H_cityname || ""} | ` +
                    `${safeTranslate("hotel_name")}: ${details?.HotelName || ""} | ` +
                    `${safeTranslate("status")}: ${safeTranslate(statusText)}`;

                try {
                    const policies =
                        details?.cancellation_policies ||
                        details?.CancellationPolicies ||
                        null;

                    const fromService =
                        Array.isArray(policies) ? policies :
                            Array.isArray(details?.cancellationPolicies) ? details.cancellationPolicies :
                                null;

                    if (fromService && fromService.length) {
                        const p0 = fromService[0] || {};
                        const refundable = p0?.refundable;
                        const fromDate = p0?.fromDate || p0?.FromDate || "";
                        const amount = p0?.amount ?? p0?.Amount ?? "";

                        const refundText =
                            (typeof cancel_info === "object" && cancel_info && refundable in cancel_info)
                                ? cancel_info[refundable]
                                : refundable !== undefined
                                    ? String(refundable)
                                    : "";

                        const extra = [refundText, fromDate ? `${fromDate}: ${amount}` : ""].filter(Boolean).join(" | ");
                        if (extra) desc += ` | ${extra}`;
                    }
                } catch { /* ignore */ }

                return desc;
            };

            if (services?.sid && valid_sids.has(String(services.sid))) {
                const products = ["hotel", "visa", "cip", "service", "transfer"];

                for (const this_product of products) {
                    const key = `${this_product}status`;
                    const list = services?.[key];

                    if (!Array.isArray(list) || !list.length) continue;

                    for (const item of list) {
                        const container = item?.[key] || {};
                        const details = container?.Details;
                        if (!details) continue;

                        let p_class = "clear";
                        let desc = "";
                        let status_text = "";

                        if (this_product === "hotel") {
                            const statusText = mapStatus(details?.H_status);
                            desc = buildHotelDesc(details, statusText);

                            // Available => A, otherwise H
                            status_text = statusText === "Available" ? "A" : "H";

                            if (String(details?.H_status) === "1") p_class = "confirm";
                            else if (String(details?.H_status) === "3") p_class = "nclear";

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }

                        if (this_product === "visa") {
                            let code = String(parseInt(details?.v_status, 10));
                            if (code === "NaN") code = String(details?.v_status || "");
                            // قانون خاص قبلی: v_status == 3 => تایید شد
                            if (String(details?.v_status) === "3") code = "2";

                            const statusText = mapStatus(code);
                            status_text = "V";

                            if (details?.v_countryname && details?.visaName) {
                                desc = `${safeTranslate("country_name")}: ${details.v_countryname} | ` +
                                    `${safeTranslate("visa_name")}: ${details.visaName} | ` +
                                    `${safeTranslate("status")}: ${safeTranslate(statusText)}`;
                            } else {
                                desc = `${safeTranslate("status")}: ${safeTranslate(statusText)}`;
                            }

                            if (String(parseInt(details?.v_status, 10)) === "1") p_class = "confirm";

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }

                        if (this_product === "cip") {
                            const code = String(parseInt(details?.c_status, 10));
                            const statusText = mapStatus(code === "NaN" ? details?.c_status : code);

                            status_text = "C";
                            desc = `${safeTranslate("status")}: ${safeTranslate(statusText)}`;

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }

                        // service / transfer
                        if (this_product === "service" || this_product === "transfer") {
                            status_text = "S";

                            const parts = [];
                            if (details?.s_status !== undefined && details?.s_status !== null && String(details.s_status).trim() !== "") {
                                const code = String(parseInt(details.s_status, 10));
                                const statusText = mapStatus(code === "NaN" ? details.s_status : code);
                                parts.push(`${safeTranslate("status")}: ${safeTranslate(statusText)}`);
                            }
                            if (details?.service_name) {
                                parts.push(`${safeTranslate("service")}: ${details.service_name}`);
                            }
                            desc = parts.join(" | ");

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }
                    }
                }
            }

            const statusHtml = status_p.length ? splitArrayIntoPairs(status_p, 2).join("") : "";

            return `<div class="icons${data?.read == 0 ? " unread-invoice" : ""}">
            <div class="">${services?.service || ""}</div>
            <div class="services-icons">${statusHtml}</div>
          </div>`;
        }

                        const bold = set_bold_row(row) || '';
                        const s = Number(row.status);

                        const map = {
                            2: { text: "pending", cls: "!panel-text-red-700 panel-border-red-700" },
                            1: { text: "صادر نشده", cls: "!panel-text-red-700 panel-border-red-700" },
                            0: { text: "صادر شده", cls: "!panel-text-green-700 panel-border-green-700" },
                        };

                        const item = Object.prototype.hasOwnProperty.call(map, s)
                            ? map[s]
                            : { text: "—", cls: "panel-text-zinc-600 panel-border-zinc-300" };

                        return `
      <span class="cursor ${bold}">
        <div class="InvoiceStatus">
          <span class="confirm panel-flex panel-items-center panel-justify-center panel-bg-white panel-text-xs panel-border panel-border-solid panel-rounded-2xl !panel-px-2 !panel-py-1 ${item.cls}">
            ${item.text}
          </span>
        </div>
      </span>
    `;
                    }
                },

                operation: {
                    title: "",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const adl = row.passengers?.adult ?? 0;
                        const chd = row.passengers?.child ?? 0;
                        const inf = row.passengers?.infant ?? 0;
                        const rowId = row.id?.id ?? '';
                        const shamsi = row.createdate?.sstring ?? '-';
                        const miladi = row.createdate?.mstring ?? '-';
                        const hour = row.createhour ?? '';
                        return `<div class="panel-select__item__container panel-relative panel-cursor-pointer ">
  <div
    class="panel-row-expander"  
    data-adl="${adl}"
          data-chd="${chd}"
          data-inf="${inf}"
          data-id="${rowId}"                      
          data-contract-shamsi="${shamsi}"
          data-contract-miladi="${miladi}"
          data-contract-hour="${hour}"
    onclick="onPassengerRowClick(this, event)">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.9697 31.5303C19.7034 31.2641 19.6792 30.8474 19.8971 30.5538L19.9697 30.4697L26.439 24L19.9697 17.5303C19.7034 17.2641 19.6792 16.8474 19.8971 16.5538L19.9697 16.4697C20.2359 16.2034 20.6526 16.1792 20.9462 16.3971L21.0303 16.4697L28.0303 23.4697C28.2966 23.7359 28.3208 24.1526 28.1029 24.4462L28.0303 24.5303L21.0303 31.5303C20.7374 31.8232 20.2626 31.8232 19.9697 31.5303Z" fill="#71717A"></path>
    </svg>
  </div>
</div>`;
                    },
                }

            },
            rowNumber: false,
            defaultSort: {
                name: "groupname"
            },
            paging: [50, 20, 30, 10],
            defaultPagingIndex: 1,
            pagingFilterType: "server",
            culture: {
                labels: {
                    // "search": "نام درخواست کننده :",
                    "refresh": "",
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}",
                    "pageSize": ""
                }
            },
            pageSize: 3,
            pageNumber: 1,
            refreshSourceId: "list.refresh",
            refresh: true,
            noData: (td) => {
                td.innerHTML = `<div class="noData">
                 <div class="icon panel-flex panel-justify-center panel-mb-3">
                    <svg width="70" height="70">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                    </svg>
                </div>
                                    <div class="text">
                                          ${translate('no_items_found')}
                                    </div>
                                </div>
                                `
            },
            export: [
                {
                    type: "excel",
                    tooltip: "دانلود اکسل"
                }
            ]
        };
    </script>
    <script>
        function onPassengerRowClick(el, event) {
            event.preventDefault()
            event.stopPropagation()

            const tr = el.closest('tr[data-sys-tr]')
            if (!tr) return

            if (tr.classList.contains('passenger-row-expanded')) {
                if (tr._originalInnerHTML) tr.innerHTML = tr._originalInnerHTML
                tr.classList.remove('passenger-row-expanded')
                return
            }
            const tds = Array.from(tr.querySelectorAll('td[data-sys-td], td'))
            const colCount = tds.length || 1

            if (!tr._originalInnerHTML) tr._originalInnerHTML = tr.innerHTML

            const d = el.dataset

            const summaryHtml = tds
                .map(
                    (td) =>
                        `<div class="passenger-summary-cell panel-flex panel-items-center !panel-py-3">${td.innerHTML}</div>`,
                )
                .join('')

            const passengersHtml = `
    <span class="pass-pill pass-inf">INF: <span class="en-numbers panel-font-sans panel-font-medium">${d.inf || 0}</span></span>
    <span class="pass-pill pass-adl">ADL: <span class="en-numbers panel-font-sans panel-font-medium">${d.adl || 0}</span></span>
    <span class="pass-pill pass-chd">CHD: <span class="en-numbers panel-font-sans panel-font-medium">${d.chd || 0}</span></span>
  `

            const sh = d.contractShamsi && d.contractShamsi !== '-' ? d.contractShamsi : ''
            const mi = d.contractMiladi && d.contractMiladi !== '-' ? d.contractMiladi : ''

            let contractDateText = '—'
            if (sh && mi) contractDateText = `${sh} - (${mi})`
            else if (sh) contractDateText = sh
            else if (mi) contractDateText = mi

            if (d.contractHour) contractDateText = `${contractDateText}  ${d.contractHour}`

            // ===== لینک قرارداد =====
            const contractId = d.id || ''
            const contractHref = `/userPanel/booking/view?id=${encodeURIComponent(contractId)}`

            tr.innerHTML = ''
            tr.classList.add('passenger-row-expanded')

            console.log(tr.classList.contains("passenger-row-expanded"));

            const td = document.createElement('td')
            td.colSpan = colCount
            td.setAttribute('data-sys-td', '')
            td.setAttribute('data-bc-data', '')
            td.setAttribute('data-bc-order', '')

            td.innerHTML = `
    <div class="passenger-row-wrap panel-flex panel-flex-col">
      <div class="passenger-summary-container panel-flex panel-justify-between">
        ${summaryHtml}
      </div>

      <div class="passenger-detail panel-border-t panel-border-dashed panel-border-zinc-200 !panel-px-3 !panel-pt-3 is-open">
        <div class="passenger-detail__content panel-flex panel-items-center panel-justify-between">
          <div class="passenger-detail__item panel-flex panel-gap-2">
            <span class="k !panel-text-zinc-500">${translate('passengers')}:</span>
            <span class="v panel-flex panel-items-center panel-gap-3">${passengersHtml}</span>
          </div>

          <div class="passenger-detail__item panel-flex panel-gap-2">
            <span class="k !panel-text-zinc-500">${translate('contract_date')}:</span>
            <span class="v en-numbers">${contractDateText}</span>
          </div>

          <div class="passenger-detail__actions">
            <a
              class="panel-flex panel-items-center panel-justify-center panel-bg-white panel-w-28 panel-h-12 panel-border panel-border-solid panel-border-primary-700 panel-rounded-lg panel-text-primary-700 panel-transition-all panel-duration-300 hover:panel-bg-primary-800 hover:panel-text-white"
              href="${contractHref}" target="_blank">
              ${translate('view_contract')}
            </a>
          </div>
        </div>
      </div>
    </div>
  `

            tr.appendChild(td)
            td.style.backgroundColor = '#FAFAFA'
        }

    </script>
</body>

</html>
