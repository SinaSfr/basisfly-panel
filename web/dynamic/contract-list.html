            <div class="panel-p-3 panel-border-b panel-border-solid panel-border-zinc-200">
                <input id="sharedDropdownSearch" type="text"
                    class="panel-w-full panel-h-12 panel-bg-zinc-100 panel-rounded-xl panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white panel-transition panel-duration-300"
                    placeholder="جستجو..." />
            </div>


            <div id="sharedDropdownList" class="panel-max-h-40 panel-overflow-y-auto panel-p-2"></div>
        </div>
    </basis>
    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>
    <script>
        async function onProcessedInvoicelist(args) {
            try {
                const response = args.response;
                const responseJson = await response.json();

                const src = responseJson?.sources?.[0] || {};
                const data = src?.data || [];
                const options = src?.options || {};

                const totalInvoice = Number(options?.extra?.total);
                const totalInvoiceSafe = Number.isFinite(totalInvoice)
                    ? totalInvoice
                    : (Array.isArray(data) ? data.length : 0);

                const totalInvoiceEl = document.querySelector(".panel-all__invoice");
                if (totalInvoiceEl) totalInvoiceEl.textContent = `(${totalInvoiceSafe})`;

                $bc.setSource("cms.list", data, options);

                // ⭐ loading off
                const btn = document.querySelector('.panel-contractSearch__btn[data-loading="1"]');
                if (btn) {
                    buttonLoading(btn, false);
                    delete btn.dataset.loading;
                }

                // ⭐ close modal after 200ms if open
                const modal = document.getElementById("advancedContractSearch");
                if (modal && !modal.classList.contains("panel-hidden")) {
                    setTimeout(() => {
                        modal.classList.add("panel-hidden");
                        modal.setAttribute("aria-hidden", "true");
                    }, 200);
                }

            } catch (e) {
                const totalEl = document.querySelector(".panel-all__invoice");
                if (totalEl) totalEl.textContent = `(0)`;

                $bc.setSource("cms.list", [], get_option("cms.list"));
            }
        }
        async function invoiceListSearchCallback(source) {


            const toStr = (v) => (v == null ? '' : String(v));
            // 🔵 فرم جاری از روی source id
            const formEl = document.querySelector(`[name="${source?.source?._id}"]`);
            const formElBtn = formEl.querySelector(".panel-contractSearch__btn")
            const fdateInput = formEl.querySelector(".fdate-string");
            const tdateInput = formEl.querySelector(".tdate-string");

            const datePickers = formEl.querySelectorAll(".date-picker-input");
            let fdate = "";
            let tdate = "";

            datePickers.forEach(dp => {
                if (dp.getAttribute("data-datepicker-sstring")) {
                    fdate = dp.getAttribute("data-datepicker-sstring");
                }
                if (dp.getAttribute("data-datepicker-to-sstring")) {
                    tdate = dp.getAttribute("data-datepicker-to-sstring");
                }
            });
            if (fdateInput) fdateInput.value = fdate;
            if (tdateInput) tdateInput.value = tdate;
            for (const element of source.source._rows) {   // ⚠ اینجا rows نیست → _rows

                const root = element?._root;
                if (!root) continue;


                /* ------------------------------
                   🔵 validation factorid
                ------------------------------ */
                if (source?.source?._id === "cms.contractdateform") {
                    if (!root.factorid || String(root.factorid).trim() === '') {
                        showFailedMessage(formEl, translate('enter_contract_number'));
                        return;
                    }
                }

                hideMessages(formEl);

                buttonLoading(formElBtn, true)
                formElBtn.dataset.loading = "1";

                /* ------------------------------
                   🔵 date logic
                ------------------------------ */
                if (root?.date) {
                    if (fdate) root.date.begindate = fdate;
                    if (tdate) root.date.enddate = tdate;
                    const paddedBegin = padJalaliDate(toStr(root.date.begindate));
                    const paddedEnd = padJalaliDate(toStr(root.date.enddate));

                    root.date.begindate = replaceSlashWithDash(paddedBegin);
                    root.date.enddate = replaceSlashWithDash(paddedEnd);
                }

                /* ------------------------------
                   🔵 account cleanup
                ------------------------------ */
                if (root?.account?.accountinfo?.length > 0) {
                    const first = root.account.accountinfo[0];
                    if ((first?.id ?? '') === '') {
                        if (root.account.accountinfo.length === 1) {
                            delete first.id;
                        } else {
                            root.account.accountinfo.shift();
                        }
                    }
                }
                console.log("hello")
                $bc.setSource('cms.search', [
                    {
                        search: JSON.stringify(root),
                        run: true,
                    },
                ]);
            }
        }



        async function setPage(args) {
            main_perpage = args.source.rows[0].pageSize;
            var page_no = args.source.rows[0].pageNumber;
            if (page_no == 0) {
                page_no = 1;
            }
            var json = {
                "pageno": page_no
            };
            $bc.setSource("cms.paging", [json]);
        }
        function setBoldRow(row) {
            // if opened form panel karbari >> 2 else in basispanel >> 1
            if (row.read == 0 || row.read == "2") {
                return " unread-invoice";
            }

            return "";
        }
        function setWarning(msg) {
            if (!msg) return '';

            const escAttr = (v) =>
                String(v ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

            const warningSvg = `
      <svg width="35" height="35" class="!panel-text-red-500">
        <use href="/userPanel/images/panel-sprite-icons.svg#icon-fill-warning"></use>
      </svg>
    `;

            return `
      <span
        class="invoice-error-icon panel-inline-flex panel-items-center panel-justify-center panel-cursor-help"
        data-widget-header-btn-tooltip="${escAttr(msg)}"
        data-sys-tooltip=""
        data-tooltip-variant="warning"
      >
        ${warningSvg}
      </span>
    `;
        }
        function sepratorDefaultValue(value) {
            const floatValue = Number(value);
            if (!Number.isNaN(floatValue) && Number.isFinite(floatValue)) {
                return new Intl.NumberFormat().format(floatValue);
            }
            return value;
        }
        function splitArrayIntoPairs(arr, n = 2) {
            try {
                const list = Array.isArray(arr) ? arr.filter(Boolean) : [];
                const size = Number.isFinite(Number(n)) && Number(n) > 0 ? Number(n) : 2;

                if (!list.length) return [];
                if (list.length <= size) {
                    return [`<div class="d-grid-${size}">${list.join('')}</div>`];
                }

                const result = [];
                for (let i = 0; i < list.length; i += size) {
                    const chunk = list.slice(i, i + size);
                    result.push(`<div class="d-grid-${size}">${chunk.join('')}</div>`);
                }
                return result;
            } catch {
                return [];
            }
        }
        function returnServices(data) {
            const status_code = {
                "1": "in_progress",
                "2": "approved",
                "3": "rejected",
                "33": "approved",
                "4": "available",
            };

            const valid_sids = new Set(["6", "4", "3", "13", "11"]);
            const services = data?.services || {};
            const status_p = [];

            const mapStatus = (code) => status_code[String(code)] || String(code || "");
            const safeTranslate = (x) => {
                try { return typeof translate === "function" ? translate(x) : String(x); }
                catch { return String(x); }
            };

            const pushIcon = (p_class, desc, status_text) => {
                const tooltip = String(desc || "").replace(/"/g, "&quot;");
                status_p.push(
                    `<div class="InvoiceStatus">
        <p class="${p_class} servicesStatus-invoice-list hover-service" data-widget-header-btn-tooltip="${tooltip}" data-sys-tooltip="">${status_text}</p>
      </div>`
                );
            };

            const buildHotelDesc = (details, statusText) => {
                let desc = `${safeTranslate("country_name")}: ${details?.H_countryname || ""} | ` +
                    `${safeTranslate("city_name")}: ${details?.H_cityname || ""} | ` +
                    `${safeTranslate("hotel_name")}: ${details?.HotelName || ""} | ` +
                    `${safeTranslate("status")}: ${safeTranslate(statusText)}`;

                try {
                    const policies =
                        details?.cancellation_policies ||
                        details?.CancellationPolicies ||
                        null;

                    const fromService =
                        Array.isArray(policies) ? policies :
                            Array.isArray(details?.cancellationPolicies) ? details.cancellationPolicies :
                                null;

                    if (fromService && fromService.length) {
                        const p0 = fromService[0] || {};
                        const refundable = p0?.refundable;
                        const fromDate = p0?.fromDate || p0?.FromDate || "";
                        const amount = p0?.amount ?? p0?.Amount ?? "";

                        const refundText =
                            (typeof cancel_info === "object" && cancel_info && refundable in cancel_info)
                                ? cancel_info[refundable]
                                : refundable !== undefined
                                    ? String(refundable)
                                    : "";

                        const extra = [refundText, fromDate ? `${fromDate}: ${amount}` : ""].filter(Boolean).join(" | ");
                        if (extra) desc += ` | ${extra}`;
                    }
                } catch { /* ignore */ }

                return desc;
            };

            if (services?.sid && valid_sids.has(String(services.sid))) {
                const products = ["hotel", "visa", "cip", "service", "transfer"];

                for (const this_product of products) {
                    const key = `${this_product}status`;
                    const list = services?.[key];

                    if (!Array.isArray(list) || !list.length) continue;

                    for (const item of list) {
                        const container = item?.[key] || {};
                        const details = container?.Details;
                        if (!details) continue;

                        let p_class = "clear";
                        let desc = "";
                        let status_text = "";

                        if (this_product === "hotel") {
                            const statusText = mapStatus(details?.H_status);
                            desc = buildHotelDesc(details, statusText);

                            // Available => A, otherwise H
                            status_text = statusText === "Available" ? "A" : "H";

                            if (String(details?.H_status) === "1") p_class = "confirm";
                            else if (String(details?.H_status) === "3") p_class = "nclear";

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }

                        if (this_product === "visa") {
                            let code = String(parseInt(details?.v_status, 10));
                            if (code === "NaN") code = String(details?.v_status || "");
                            // قانون خاص قبلی: v_status == 3 => تایید شد
                            if (String(details?.v_status) === "3") code = "2";

                            const statusText = mapStatus(code);
                            status_text = "V";

                            if (details?.v_countryname && details?.visaName) {
                                desc = `${safeTranslate("country_name")}: ${details.v_countryname} | ` +
                                    `${safeTranslate("visa_name")}: ${details.visaName} | ` +
                                    `${safeTranslate("status")}: ${safeTranslate(statusText)}`;
                            } else {
                                desc = `${safeTranslate("status")}: ${safeTranslate(statusText)}`;
                            }

                            if (String(parseInt(details?.v_status, 10)) === "1") p_class = "confirm";

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }

                        if (this_product === "cip") {
                            const code = String(parseInt(details?.c_status, 10));
                            const statusText = mapStatus(code === "NaN" ? details?.c_status : code);

                            status_text = "C";
                            desc = `${safeTranslate("status")}: ${safeTranslate(statusText)}`;

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }

                        // service / transfer
                        if (this_product === "service" || this_product === "transfer") {
                            status_text = "S";

                            const parts = [];
                            if (details?.s_status !== undefined && details?.s_status !== null && String(details.s_status).trim() !== "") {
                                const code = String(parseInt(details.s_status, 10));
                                const statusText = mapStatus(code === "NaN" ? details.s_status : code);
                                parts.push(`${safeTranslate("status")}: ${safeTranslate(statusText)}`);
                            }
                            if (details?.service_name) {
                                parts.push(`${safeTranslate("service")}: ${details.service_name}`);
                            }
                            desc = parts.join(" | ");

                            pushIcon(p_class, desc, status_text);
                            continue;
                        }
                    }
                }
            }

            const statusHtml = status_p.length ? splitArrayIntoPairs(status_p, 2).join("") : "";

            return `<div class="icons${data?.read == 0 ? " unread-invoice" : ""}">
            <div class="">${services?.service || ""}</div>
            <div class="services-icons">${statusHtml}</div>
          </div>`;
        }

        var InvoiceListItems = {
            process: "mix",
            ProcessActionType: {
                search: "client",
                paging: "server",
                sort: "client"
            },
            filter: "row",
            columns: {
                accountName: {
                    title: translate("account_details"),
                    filter: false,
                    sort: false,
                    source: row => `${row.account?.accountName ?? ''}`,
                    cellMaker: (row, data, td) => {
                        const bold = setBoldRow(row) || '';
                        const name = row.account?.accountName ?? '—';
                        const contractId = row.id?.id ?? '';

                        const getErrorText = (r) => {
                            if (String(r?.error?.eid ?? '') !== '1') return '';

                            const t = r?.error?.type;

                            const hasTid = (tid) => {
                                if (!t) return false;
                                if (typeof t === 'string' || typeof t === 'number') return String(t) === String(tid);
                                if (Array.isArray(t)) return t.some(obj => String(obj?.tid) === String(tid));
                                return false;
                            };

                            if (hasTid('2')) return translate('ticket_not_issued');
                            if (hasTid('3')) return translate('hotel_not_issued');
                            if (hasTid('5')) return translate('insurance_not_issued');
                            return translate('check_with_supplier');
                        };

                        const warnText = getErrorText(row);
                        const warningIconHtml = setWarning(warnText); // ✅ use the sprite version

                        let html = `
      <div class="${bold} panel-flex panel-flex-col panel-gap-1">
        <div class="panel-flex panel-items-center panel-gap-4">
          ${warningIconHtml}
          <div class="accountName-title">${name}</div>
        </div>

        <div class="accountName-sub panel-mt-1 panel-text-right">
          <span class="!panel-text-zinc-500">${translate("contract_number")}:</span>
          <span class="en-numbers invoice-id">${contractId}</span>
        </div>
      </div>
    `;

                        return html;
                    }
                },
                cityName: {
                    title: translate("origin_destination"),
                    filter: false,
                    sort: false,
                    source: row => `${row.city.cityName}`,
                    cellMaker: (row, data, td) => {
                        var result = `<span class="${setBoldRow(row)}">${row.city.cityName} </span>`;
                        if (row.city.tourName) {
                            result += `<br><span>${row.city.tourName}</span>`;
                        }
                        return result
                    }
                },
                date: {
                    title: translate("round_trip_date"),
                    filter: false,
                    sort: false,
                    source: row => {
                        const begin = row.travelDate?.begindate;
                        const end = row.travelDate?.enddate;

                        const hasValid = (d) => {
                            if (!d) return false;
                            if (Array.isArray(d)) return d.some(x => (x?.sstring && x.sstring !== "-") || (x?.mstring && x.mstring !== "-"));
                            return (d.sstring && d.sstring !== "-") || (d.mstring && d.mstring !== "-");
                        };

                        const safe = (v) => (v && v !== "-" ? v : "");
                        const fmtPlain = (d) => {
                            if (!d) return "";
                            const sh = safe(d.sstring);
                            const mi = safe(d.mstring);
                            if (sh && mi) return `${sh} (${mi})`;
                            return sh || mi || "";
                        };

                        const parts = [];

                        if (hasValid(begin)) {
                            const beginText = Array.isArray(begin)
                                ? begin.map(fmtPlain).filter(Boolean).join(" | ")
                                : fmtPlain(begin);
                            if (beginText) parts.push(`${translate("depart")}: ${beginText}`);
                        }

                        if (hasValid(end)) {
                            const endText = fmtPlain(end);
                            if (endText) parts.push(`${translate("return")}: ${endText}`);
                        }

                        return parts.join(" ").trim();
                    },
                    cellMaker: (row, data, td) => {
                        const bold = setBoldRow(row) || '';
                        const unread = row.read === 0 ? " unread-invoice" : "";

                        const begin = row.travelDate?.begindate;
                        const end = row.travelDate?.enddate;

                        const hasValid = (d) => {
                            if (!d) return false;
                            if (Array.isArray(d)) return d.some(x => (x?.sstring && x.sstring !== "-") || (x?.mstring && x.mstring !== "-"));
                            return (d.sstring && d.sstring !== "-") || (d.mstring && d.mstring !== "-");
                        };

                        const safe = (v) => (v && v !== "-" ? v : "");
                        const fmt = (d) => {
                            if (!d) return "";
                            const sh = safe(d.sstring);
                            const mi = safe(d.mstring);
                            if (sh && mi) return `${sh} - (${mi})`;
                            return sh || mi || "";
                        };

                        const blocks = [];

                        // تاریخ رفت (فقط اگر موجود باشد)
                        if (hasValid(begin)) {
                            let beginHtml = "";
                            if (Array.isArray(begin)) {
                                const items = begin.map(d => fmt(d)).filter(Boolean);
                                beginHtml = items.length
                                    ? items.map(v => `<span class="en-numbers${bold}${unread}">${v}</span>`).join(' <span class="panel-text-zinc-400">|</span> ')
                                    : "";
                            } else {
                                const v = fmt(begin);
                                beginHtml = v ? `<span class="en-numbers${bold}${unread}">${v}</span>` : "";
                            }

                            if (beginHtml) {
                                blocks.push(`
          <div class="panel-flex panel-items-center panel-gap-1 panel-justify-center ${bold}${unread}">
            تاریخ رفت:
            <span class="panel-flex panel-flex-wrap panel-gap-2">${beginHtml}</span>
          </div>
        `);
                            }
                        }

                        // تاریخ برگشت (فقط اگر موجود باشد)
                        if (hasValid(end)) {
                            const endVal = fmt(end);
                            if (endVal) {
                                blocks.push(`
          <div class="panel-flex panel-items-center panel-gap-1 panel-justify-center ${bold}${unread}">
            تاریخ برگشت:
            <span class="en-numbers${bold}${unread}">${endVal}</span>
          </div>
        `);
                            }
                        }

                        // اگر هیچ چیز نبود، کلاً خالی برگردان
                        if (!blocks.length) return "";

                        return `
      <div class="${bold} panel-flex panel-flex-col panel-gap-1">
        ${blocks.join("")}
      </div>
    `;
                    }
                },
                service: {
                    title: translate("services_refnumber"),
                    filter: false,
                    sort: false,
                    source: row => `${row.services?.service ?? ''}`,
                    cellMaker: (row, data, td) => {
                        const baseHtml = returnServices(row);

                        const refRaw = row.webservices?.[0]?.webservices?.ws_refnumber ?? '';
                        const refText = String(refRaw).replace(/<[^>]*>/g, '').trim();
                        const refClean = refText.replace(/^\s*refnumber\s*:\s*/i, '').trim();

                        if (!refClean) return baseHtml;

                        try {
                            const wrap = document.createElement('div');
                            wrap.innerHTML = baseHtml;

                            const root = wrap.firstElementChild;
                            if (!root) return baseHtml;

                            const serviceTitleDiv = root.querySelector(':scope > div');
                            if (!serviceTitleDiv) return baseHtml;

                            serviceTitleDiv.insertAdjacentHTML(
                                'afterend',
                                `<div class="service-ref font_12">
          Refnumber: <span class="en-numbers panel-font-sans !panel-text-sm panel-font-medium">${refClean}</span>
        </div>`
                            );

                            return wrap.innerHTML;
                        } catch (e) {
                            return baseHtml;
                        }
                    }
                },
                invoiceprice: {
                    title: translate("amount"),
                    filter: false,
                    sort: false,
                    cssClass: ["no-content-row"],
                    source: row => `${row.costinfo.totalwithcommision}`,
                    cellMaker: (row, data, td) => {
                        var cost_cloumn = document.querySelector("#cost_cloumn");
                        if (cost_cloumn) {
                            cost_cloumn.textContent = `${translate("amount")}:(${row.costinfo.priceunit})`
                            cost_cloumn.removeAttribute('id');
                        }
                        return `<div><span class="panel-cursor-pointer en-numbers${setBoldRow(row)}" data-widget-header-btn-tooltip=" ${translate("amount_remaining")}: ${sepratorDefaultValue(row.balance)} " data-sys-tooltip="" data-tooltip-variant="info"><span class="en-numbers">${sepratorDefaultValue(row.costinfo.totalwithcommision)}</span></span></div>`

                    }
                },
                invoicelabels: {
                    title: translate("labels"),
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const map = {
                            "0": { cls: "nclear panel-bg-label-redBg !panel-text-label-red", text: translate("label_unsettled") },
                            "1": { cls: "clear panel-bg-label-darkGreenBg !panel-text-label-darkGreen", text: translate("label_settled") },
                            "2": { cls: "confirm panel-bg-label-orangeBg !panel-text-label-orange", text: translate("label_unsettled_finance") },
                            "3": { cls: "edited panel-bg-label-blueBg !panel-text-label-blue", text: translate("label_edited") },
                            "4": { cls: "canceled panel-bg-label-GrayBg !panel-text-label-Gray", text: translate("label_canceled") },
                            "6": { cls: "credit panel-bg-label-purpleBg !panel-text-label-purple", text: translate("label_credit") },
                            "8": { cls: "clearconfirm panel-bg-label-lightGreen !panel-text-white", text: translate("label_credit_finance_settled") },
                        };

                        const basePill = "!panel-px-2 !panel-py-0.5 panel-rounded-2xl";

                        const labelsArr = Array.isArray(row.labels) ? row.labels : [];
                        let html = `<div class="panel-flex panel-flex-col panel-gap-1.5">`;

                        for (const item of labelsArr) {
                            const code = String(item?.labels?.label ?? "");
                            const meta = map[code];
                            if (!meta) continue;

                            html += `
        <div class="InvoiceStatus">
          <span class="${meta.cls} ${basePill}" data-descr="${meta.text}">
            ${meta.text}
          </span>
        </div>
      `;
                        }

                        html += `</div>`;
                        return html;
                    }
                },
                status: {
                    title: translate("status"),
                    filter: false,
                    sort: false,
                    source: row => String(row.status ?? ''),
                    cellMaker: (row, data, td) => {
                        const bold = setBoldRow(row) || '';
                        const s = Number(row.status);

                        const map = {
                            2: { text: translate("status_pending"), cls: "!panel-text-red-700 panel-border-red-700" },
                            1: { text: translate("status_not_issued"), cls: "!panel-text-red-700 panel-border-red-700" },
                            0: { text: translate("status_issued"), cls: "!panel-text-green-700 panel-border-green-700" },
                        };

                        const item = Object.prototype.hasOwnProperty.call(map, s)
                            ? map[s]
                            : { text: "—", cls: "panel-text-zinc-600 panel-border-zinc-300" };

                        return `
      <span class="cursor ${bold}">
        <div class="InvoiceStatus">
          <span class="confirm panel-flex panel-items-center panel-justify-center panel-bg-white panel-text-xs panel-border panel-border-solid panel-rounded-2xl !panel-px-2 !panel-py-1 ${item.cls}">
            ${item.text}
          </span>
        </div>
      </span>
    `;
                    }
                },

                operation: {
                    title: "",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const adl = row.passengers?.adult ?? 0;
                        const chd = row.passengers?.child ?? 0;
                        const inf = row.passengers?.infant ?? 0;
                        const rowId = row.id?.id ?? '';
                        const shamsi = row.createdate?.sstring ?? '-';
                        const miladi = row.createdate?.mstring ?? '-';
                        const hour = row.createhour ?? '';
                        return `<div class="panel-select__item__container panel-relative panel-cursor-pointer ">
  <div
    class="panel-row-expander"  
    data-adl="${adl}"
          data-chd="${chd}"
          data-inf="${inf}"
          data-id="${rowId}"                      
          data-contract-shamsi="${shamsi}"
          data-contract-miladi="${miladi}"
          data-contract-hour="${hour}"
    onclick="onPassengerRowClick(this, event)">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.9697 31.5303C19.7034 31.2641 19.6792 30.8474 19.8971 30.5538L19.9697 30.4697L26.439 24L19.9697 17.5303C19.7034 17.2641 19.6792 16.8474 19.8971 16.5538L19.9697 16.4697C20.2359 16.2034 20.6526 16.1792 20.9462 16.3971L21.0303 16.4697L28.0303 23.4697C28.2966 23.7359 28.3208 24.1526 28.1029 24.4462L28.0303 24.5303L21.0303 31.5303C20.7374 31.8232 20.2626 31.8232 19.9697 31.5303Z" fill="#71717A"></path>
    </svg>
  </div>
</div>`;
                    },
                }

            },
            rowNumber: false,
            defaultSort: {
                name: "groupname"
            },
            paging: [50, 20, 30, 10],
            defaultPagingIndex: 1,
            pagingFilterType: "server",
            culture: {
                labels: {
                    // "search": "نام درخواست کننده :",
                    "refresh": "",
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}",
                    "pageSize": ""
                }
            },
            pageSize: 3,
            pageNumber: 1,
            refreshSourceId: "list.refresh",
            refresh: true,
            noData: (td) => {
                td.innerHTML = `<div class="noData">
                 <div class="icon panel-flex panel-justify-center panel-mb-3">
                    <svg width="70" height="70">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                    </svg>
                </div>
                                    <div class="text">
                                          ${translate('no_items_found')}
                                    </div>
                                </div>
                                `
            },
            export: [
                {
                    type: "excel",
                    tooltip: translate("download_excel")
                }
            ]
        };
    </script>
    <script>
        function onPassengerRowClick(el, event) {
            event.preventDefault()
            event.stopPropagation()

            const tr = el.closest('tr[data-sys-tr]')
            if (!tr) return

            if (tr.classList.contains('passenger-row-expanded')) {
                if (tr._originalInnerHTML) tr.innerHTML = tr._originalInnerHTML
                tr.classList.remove('passenger-row-expanded')
                return
            }
            const tds = Array.from(tr.querySelectorAll('td[data-sys-td], td'))
            const colCount = tds.length || 1

            if (!tr._originalInnerHTML) tr._originalInnerHTML = tr.innerHTML

            const d = el.dataset

            const summaryHtml = tds
                .map(
                    (td) =>
                        `<div class="passenger-summary-cell panel-flex panel-items-center !panel-py-3">${td.innerHTML}</div>`,
                )
                .join('')

            const passengersHtml = `
    <span class="pass-pill pass-inf">INF: <span class="en-numbers panel-font-sans panel-font-medium">${d.inf || 0}</span></span>
    <span class="pass-pill pass-adl">ADL: <span class="en-numbers panel-font-sans panel-font-medium">${d.adl || 0}</span></span>
    <span class="pass-pill pass-chd">CHD: <span class="en-numbers panel-font-sans panel-font-medium">${d.chd || 0}</span></span>
  `

            const sh = d.contractShamsi && d.contractShamsi !== '-' ? d.contractShamsi : ''
            const mi = d.contractMiladi && d.contractMiladi !== '-' ? d.contractMiladi : ''

            let contractDateText = '—'
            if (sh && mi) contractDateText = `${sh} - (${mi})`
            else if (sh) contractDateText = sh
            else if (mi) contractDateText = mi

            if (d.contractHour) contractDateText = `${contractDateText}  ${d.contractHour}`

            // ===== لینک قرارداد =====
            const contractId = d.id || ''
            const contractHref = `/userPanel/booking/view?id=${encodeURIComponent(contractId)}`

            tr.innerHTML = ''
            tr.classList.add('passenger-row-expanded')

            const td = document.createElement('td')
            td.colSpan = colCount
            td.setAttribute('data-sys-td', '')
            td.setAttribute('data-bc-data', '')
            td.setAttribute('data-bc-order', '')

            td.innerHTML = `
    <div class="passenger-row-wrap panel-flex panel-flex-col">
      <div class="passenger-summary-container panel-flex panel-justify-between">
        ${summaryHtml}
      </div>

      <div class="passenger-detail panel-border-t panel-border-dashed panel-border-zinc-200 !panel-px-3 !panel-pt-3 is-open">
        <div class="passenger-detail__content panel-flex panel-items-center panel-justify-between">
          <div class="passenger-detail__item panel-flex panel-gap-2">
            <span class="k !panel-text-zinc-500">${translate('passengers')}:</span>
            <span class="v panel-flex panel-items-center panel-gap-3">${passengersHtml}</span>
          </div>

          <div class="passenger-detail__item panel-flex panel-gap-2">
            <span class="k !panel-text-zinc-500">${translate('contract_date')}:</span>
            <span class="v en-numbers">${contractDateText}</span>
          </div>

          <div class="passenger-detail__actions">
            <a
              class="panel-flex panel-items-center panel-justify-center panel-bg-white panel-w-28 panel-h-12 panel-border panel-border-solid panel-border-primary-700 panel-rounded-lg panel-text-primary-700 panel-transition-all panel-duration-300 hover:panel-bg-primary-800 hover:panel-text-white"
              href="${contractHref}" target="_blank">
              ${translate('view_contract')}
            </a>
          </div>
        </div>
      </div>
    </div>
  `

            tr.appendChild(td)
            td.style.backgroundColor = '#FAFAFA'
        }

    </script>
</body>

</html>
