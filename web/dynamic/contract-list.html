<style>

        --darkGreen-bgLabel: #D5F9DF;
        --Gray-bgLabel: #f5f5f5;
    }

    [data-bc-grid] * {
        font-size: 12px !important;
    }

    [data-bc-grid="d1"] [data-bc-grid-header-container] {
        border: none !important;
        border-radius: unset !important;
        padding: 0 !important;
        min-height: 40px !important;
        margin-top: 2rem;
    }

    tr.passenger-detail-row {
        display: none;
    }

    tr.passenger-detail-row.is-open {
        display: table-row;
    }

    tr.passenger-detail-row td {
        border: 0 !important;
        padding: 8px 0 14px 0 !important;
        background: transparent;
    }

    .panel-font-sans {
        font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    .panel-border-t {
        border-top-width: 1px;
    }

    .panel-border-dashed {
        border-style: dashed;
    }

    .panel-border-zinc-200 {
        --tw-border-opacity: 1;
        border-color: rgb(228 228 231 / var(--tw-border-opacity, 1))
            /* #e4e4e7 */
        ;
    }

    .panel-w-\[92\%\] {
        width: 92%;
    }

    .panel-float-right {
        float: right;
    }

    [data-bc-grid="d1"][data-bc-grid-direction="rtl"] table[data-bc-table] thead td {
        text-align: center !important;
    }

    .\!panel-text-zinc-500 {
        --tw-text-opacity: 1 !important;
        color: rgb(113 113 122 / var(--tw-text-opacity, 1))
            /* #71717a */
            !important;
    }

    .\!panel-px-3 {
        padding-left: 0.75rem
            /* 12px */
            !important;
        padding-right: 0.75rem
            /* 12px */
            !important;
    }

    .\!panel-pt-3 {

            /* 12px */
            !important;

            !important;

            !important;

    .\!panel-py-3 {

    }

    .panel-text-right {
        text-align: right;
    }

    .\!panel-p-3 {
        padding: 0.75rem
            /* 12px */

    }

    .\!panel-py-0\.5 {

            /* 2px */
            !important;
        padding-bottom: 0.125rem
            /* 2px */
            !important;
    }

    .panel-gap-1\.5 {
        gap: 0.375rem
            /* 6px */
        ;
    }

    .panel-cursor-help {
        cursor: help;
    }

    [data-sys-tooltip] {
        position: relative;
    }

    [data-widget-header-btn-tooltip]::before {
        content: attr(data-widget-header-btn-tooltip);
        position: absolute;
        bottom: -35px;
        right: 0;
        padding: 10px 7px;
        width: max-content;
        border-radius: 10px;
        background-color: #767676;
        color: #fff;
        text-align: center;
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
    }

    /* مخفی/نمایش */
    [data-sys-tooltip]::before {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transition: all .2s;
    }

    [data-sys-tooltip]:hover::before {
        visibility: visible;
        opacity: 1;
    }

    [data-sys-tooltip][data-tooltip-variant="warning"]::before {
        border: 1px solid #EF4444;
        color: #EF4444;
        background: #FFD1D1;
        border-radius: 100px;
    }

    [data-sys-tooltip][data-tooltip-variant="info"]::before {
        border: 1px solid #3B82F6;
        color: #3B82F6;
        background: #DBEAFE;
        border-radius: 100px;
    }

    .Panel_invoice_List [data-bc-grid="d1"] table[data-bc-table] tbody tr[data-sys-tr] td[data-sys-td]:first-child {
        border-width: 1px 1px 1px 0;
        border-radius: 0 12px 12px 0;
    }

    .Panel_invoice_List .passenger-row-expanded td[data-sys-td]:first-child {
        border-width: 1px !important;
        border-radius: 12px !important;
    }

    tr.passenger-row-expanded .panel-row-expander svg {
        transform: rotate(90deg);
        transition: transform .2s ease;
    }

    [data-bc-grid="d1"] table[data-bc-table] thead td {
        padding: 16px 12px !important;
        background: #F4F4F5;
        font-weight: 400 !important;
        color: #18181B !important;
    }

    [data-bc-grid="d1"] table[data-bc-table] thead tr {
        border-radius: 12px;
    }

    [data-bc-grid="d1"] table[data-bc-table] thead td:first-child {
        border-radius: 0 12px 12px 0;
    }

    .Panel_invoice_List [data-bc-grid="d1"] table[data-bc-table] tbody td {
        padding: 12px 0 !important;
    }

    .Panel_invoice_List [data-bc-grid="d1"] table[data-bc-table] tbody td:first-child {
        padding-right: 12px !important;
    }

    .Panel_invoice_List [data-bc-pagesize-container] {
        display: none;
    }

    .Panel_invoice_List [data-bc-grid-footer-container] {
        background-color: #FAFAFA !important;
        border-radius: 12px !important;
    }

    .Panel_invoice_List [data-bc-information-container] {
        color: black !important;
    }

    .Panel_invoice_List [data-sys-paging-active] {
        background: var(--primary-800) !important;
    }

    .Panel_invoice_List [data-bc-export-item-excel] {
        width: auto !important;
        height: auto !important;
    }

    .Panel_invoice_List [data-bc-export-item-excel] svg {
        width: 48px !important;
        height: 48px !important;
    }
</style>

<body class="panel-bg-zinc-50">

                                                    class="panel-w-full panel-bg-zinc-100 panel-rounded-xl panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-h-14 panel-placeholder-zinc-400 panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white focus:panel-shadow-md panel-transition panel-duration-300"
                                                    placeholder="خدمات" />
                                                <svg width="48" height="48"
                                                    class="panel-absolute panel-left-2 panel-top-1 panel-text-zinc-500">
                                                    <use href="/images/panel-sprite-icons.svg#icon-chevron-down">
                                                    </use>
                                                </svg>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="panel-flex-1 panel-flex panel-items-center panel-gap-3 panel-mt-7">
                                        <input id="advSearchBuyerInfo" name="buyer_info" data-field="buyer_info"
                                            type="text"
                                            class="panel-flex-1 panel-h-14 panel-bg-zinc-100 panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-placeholder-zinc-400 panel-rounded-xl panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white
                                                               focus:panel-shadow-md panel-transition panel-duration-300"
                                            placeholder="اطلاعات خریدار">

                                        <input id="advSearchPassengerInfo" name="passenger_info"
                                            data-field="passenger_info" type="text"
                                            class="panel-flex-1 panel-h-14 panel-bg-zinc-100 panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-placeholder-zinc-400 panel-rounded-xl panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white
                                                               focus:panel-shadow-md panel-transition panel-duration-300" placeholder="اطلاعات مسافر">
                                    </div>
                                </section>
                            </div>
                        </div>
                    </div>

                </section>
                <section class="panel-mt-12">
                    <div
                        class="panel-flex panel-items-center panel-justify-between panel-h-12 panel-float-right panel-w-[92%]">
                        <h2 class="panel-text-zinc-900 panel-font-medium">سفرهای من</h2>
                        <p class="panel-text-zinc-900 panel-text-xs">جمع کل قرارداد ها <span
                                class="panel-all__invoice">(1240)</span></p>
                    </div>
                    <div class="Panel_invoice_List">
                        <basis core="component.grid.grid" run="atclient" dataMemberName="db.list"

    </main>
    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>
    <script>
        async function onProcessed_list(args) {
            try {
                const response = args.response;
                const responseJson = await response.json();

                const src = responseJson?.sources?.[0] || {};
                const data = src?.data || [];
                const options = src?.options || {};

                // total از options.extra.total (مربوط به db.list)
                const total = Number(options?.extra?.total);
                const totalSafe = Number.isFinite(total) ? total : (Array.isArray(data) ? data.length : 0);

                const totalEl = document.querySelector(".panel-all__invoice");
                if (totalEl) totalEl.textContent = `(${totalSafe})`;

                $bc.setSource("db.list", data, options);
            } catch (e) {
                const totalEl = document.querySelector(".panel-all__invoice");
                if (totalEl) totalEl.textContent = `(0)`;

                $bc.setSource("db.list", [], get_option("db.list"));
            }
        }
        async function setPage(args) {
            console.log("click paging");
            main_perpage = args.source.rows[0].pageSize;
            var page_no = args.source.rows[0].pageNumber;
            if (page_no == 0) {
                page_no = 1;
            }
            var json = {
                "pageno": page_no
            };
            $bc.setSource("cms.paging", [json]);
        }
        function set_bold_row(row) {
            // if opened form panel karbari >> 2 else in basispanel >> 1
            if (row.read == 0 || row.read == "2") {
                return " unread-invoice";
            }

            return "";
        }
        function set_warning(msg) {
            return `<span class="space" data-widget-header-btn-tooltip-right="${msg}" data-sys-tooltip-warning="">
                    <svg class="ionicon" viewBox="0 0 512 512" width="35">
                        <path d="M85.57 446.25h340.86a32 32 0 0028.17-47.17L284.18 82.58c-12.09-22.44-44.27-22.44-56.36 0L57.4 399.08a32 32 0 0028.17 47.17z" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" stroke="#fff" fill="#ce0e0e"></path>
                        <path d="M250.26 195.39l5.74 122 5.73-121.95a5.74 5.74 0 00-5.79-6h0a5.74 5.74 0 00-5.68 5.95z" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" stroke="#fff" fill="#ce0e0e"></path>
                        <path d="M256 397.25a20 20 0 1120-20 20 20 0 01-20 20z" fill="#fff"></path>
                    </svg>
                </span>`;
        }
        function seprator_default_value(value) {
            const floatValue = Number(value);
            if (!Number.isNaN(floatValue) && Number.isFinite(floatValue)) {
                return new Intl.NumberFormat().format(floatValue);
            }
            return value;
        }
        function return_services(data) {
            var valid_sids = ['6', '4', '3', '13', '11']
            var services = data.services;

            var status_p = [];

            if (services.sid && valid_sids.includes(services.sid)) {
                for (var this_poduct of ['hotel', 'visa', 'cip', 'service', 'transfer']) {
                    if (services.hasOwnProperty(`${this_poduct}status`)) {
                        for (var this_service of services[`${this_poduct}status`]) {
                            var details = this_service[`${this_poduct}status`].Details;
                            var p_class = 'clear';
                            if (details) {
                                if (this_poduct == 'hotel') {
                                    var status = status_code[details.H_status];
                                    var desc = `نام کشور : ${details.H_countryname} |
                                            نام شهر : ${details.H_cityname} |
                                            نام هتل : ${details.HotelName} |
                                            وضعیت : ${status}`

                                    // check cancelation
                                    if (this_service.cancellation_policies) {
                                        if (this_service.cancellation_policies.length > 0) {
                                            refund_status = this_service.hotelstatus.cancellation_policies[0];
                                            var refund = cancel_info[refund_status.refundable];
                                            var cancel_date = refund_status.cancellation_policies[0].fromDate;
                                            var penalty = refund_status.cancellation_policies[0].amount;
                                            cancel_desc = ` | ${refund} | ${cancel_date}:  ${penalty}`;
                                            desc += cancel_date;
                                        }
                                    }
                                    var status_text = 'A';
                                    if (status != 'Available') {
                                        status_text = 'H'
                                    }
                                    if (details.H_status == '1') {
                                        p_class = 'confirm'
                                    } else if (details.H_status == '3') {
                                        p_class = 'nclear'
                                    }
                                }
                                if (this_poduct == 'visa') {
                                    var status = status_code[parseInt(details.v_status).toString()];

                                    if (details.v_status == '3') {
                                        status = status_code['2'];
                                    }

                                    if (details.v_countryname && details.visaName) {
                                        var desc = `نام کشور : ${details.v_countryname} |
                                                نام ویزا: ${details.visaName} |
                                                وضعیت : ${status}`
                                    } else {
                                        var desc = `وضعیت : ${status}`
                                    }
                                    var status_text = 'V';

                                    if (parseInt(details.v_status).toString() == '1') {
                                        p_class = 'confirm'
                                    }
                                }
                                if (this_poduct == 'cip') {
                                    var status = status_code[parseInt(details.c_status).toString()];
                                    var desc = `وضعیت : ${status}`
                                    var status_text = 'C';
                                }
                                if (this_poduct == 'cip') {
                                    var status = status_code[parseInt(details.c_status).toString()];
                                    var desc = `وضعیت : ${status}`
                                    var status_text = 'C';
                                }
                                if (this_poduct == 'service' || this_poduct == 'transfer') {
                                    var desc = '';
                                    if (details.s_status) {
                                        var status = status_code[parseInt(details.s_status).toString()];
                                        desc += `وضعیت : ${status} |`
                                        var status_text = 'S';
                                    }
                                    if (details.service_name) {
                                        desc += `خدمات : ${details.service_name} |`
                                        var status_text = 'S';
                                    }
                                }
                                status_p.push(`<div class="InvoiceStatus">
                                            <p class="${p_class} servicesStatus-invoice-list hover-service" data-widget-header-btn-tooltip="${desc}" data-sys-tooltip="">${status_text}</p>
                                        </div>`)
                            }
                        }
                    }

                }
            }
            if (status_p.length) {
                status_p = splitArrayIntoPairs(status_p, 2);
            }
            return `<div class="icons${data.read == 0 ? " unread-invoice" : ""}">
                    <div class="">${services.service}</div>
                </div>`

        }

        var InvoiceListItems = {
            process: "mix",
            ProcessActionType: {
                search: "client",
                paging: "server",
                sort: "client"
            },
            filter: "row",
            columns: {
                accountName: {
                    title: "مشخصات",
                    filter: false,
                    sort: false,
                    source: row => `${row.account?.accountName ?? ''}`,
                    cellMaker: (row, data, td) => {

                        const bold = set_bold_row(row) || '';
                        const name = row.account?.accountName ?? '—';
                        const contractId = row.id?.id ?? '';

                        const warningSvg = `
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10.6279 3.35309C11.9877 2.59902 13.7174 3.09447 14.4773 4.44209L21.746 17.0572C21.906 17.4338 21.976 17.7399 21.996 18.058C22.036 18.8012 21.776 19.5236 21.2661 20.0795C20.7562 20.6334 20.0663 20.9604 19.3164 21H4.6789C4.36896 20.9812 4.05901 20.9108 3.76906 20.8018C2.3193 20.2172 1.61942 18.5723 2.20932 17.1464L9.52809 4.43317C9.77804 3.98628 10.158 3.60082 10.6279 3.35309ZM11.9977 15.2726C11.5178 15.2726 11.1178 15.669 11.1178 16.1456C11.1178 16.6202 11.5178 17.0176 11.9977 17.0176C12.4776 17.0176 12.8675 16.6202 12.8675 16.1347C12.8675 15.66 12.4776 15.2726 11.9977 15.2726ZM11.9977 9.09039C11.5178 9.09039 11.1178 9.47585 11.1178 9.95248V12.7557C11.1178 13.2314 11.5178 13.6287 11.9977 13.6287C12.4776 13.6287 12.8675 13.2314 12.8675 12.7557V9.95248C12.8675 9.47585 12.4776 9.09039 11.9977 9.09039Z" fill="#EF4444"/>
      </svg>
    `;

                        const escAttr = (v) =>
                            String(v ?? '')
                                .replace(/&/g, '&amp;')
                                .replace(/"/g, '&quot;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;');

                        const getErrorText = (r) => {
                            if (String(r?.error?.eid ?? '') !== '0') return '';

                            const t = r?.error?.type;

                            const hasTid = (tid) => {
                                if (!t) return false;
                                if (typeof t === 'string' || typeof t === 'number') return String(t) === String(tid);
                                if (Array.isArray(t)) return t.some(obj => String(obj?.tid) === String(tid));
                                return false;
                            };

                            if (hasTid('2')) return 'عدم صدور بلیط';
                            if (hasTid('3')) return 'عدم صدور هتل';
                            if (hasTid('5')) return 'عدم صدور بیمه';
                            return 'لطفا حتما صدور یا عدم صدور را از تامین کننده پیگیری کنید';
                        };

                        const warnText = getErrorText(row);
                        const warningIconHtml = warnText
                            ? `
        <span
          class="invoice-error-icon panel-inline-flex panel-items-center panel-justify-center panel-cursor-help"
          data-widget-header-btn-tooltip="${escAttr(warnText)}"
          data-sys-tooltip=""  data-tooltip-variant="warning"
        >
          ${warningSvg}
        </span>
      `
                            : '';

                        let html = `
      <div class="${bold} panel-flex panel-flex-col panel-gap-1">
        <div class="panel-flex panel-items-center panel-gap-4">
          ${warningIconHtml}
          <div class="accountName-title">${name}</div>
        </div>

        <div class="accountName-sub panel-mt-1 panel-text-right">
          <span class="!panel-text-zinc-500">شماره قرارداد:</span>
          <span class="en-numbers invoice-id cursor-pointer">${contractId}</span>
        </div>
      </div>
    `;

                        if (row.account?.hasOwnProperty('engine')) {
                            html += `<div class="accountName-invoice-list${bold}">(خرید از ${row.account.engine})</div>`;
                        } else if (row.account?.hasOwnProperty('supplier')) {
                            if (row.account.supplier == '1') {
                                html += `<div class="accountName-invoice-list${bold}">(خرید تامین کننده)</div>`;
                            }
                        }

                        return html;
                    }
                },
                cityName: {
                    title: "مبدا-مقصد",
                    filter: false,
                    sort: false,
                    source: row => `${row.city.cityName}`,
                    cellMaker: (row, data, td) => {
                        var result = `<span class="${set_bold_row(row)}">${row.city.cityName} </span>`;
                        if (row.city.tourName) {
                            result += `<br><span>${row.city.tourName}</span>`;
                        }
                        return result
                    }
                },
                date: {
                    title: "تاریخ رفت و برگشت",
                    filter: false,
                    sort: false,
                    source: row => {
                        const begin = row.travelDate?.begindate;
                        const end = row.travelDate?.enddate;

                        const hasValid = (d) => {
                            if (!d) return false;
                            if (Array.isArray(d)) return d.some(x => (x?.sstring && x.sstring !== "-") || (x?.mstring && x.mstring !== "-"));
                            return (d.sstring && d.sstring !== "-") || (d.mstring && d.mstring !== "-");
                        };

                        const safe = (v) => (v && v !== "-" ? v : "");
                        const fmtPlain = (d) => {
                            if (!d) return "";
                            const sh = safe(d.sstring);
                            const mi = safe(d.mstring);
                            if (sh && mi) return `${sh} (${mi})`;
                            return sh || mi || "";
                        };

                        const parts = [];

                        if (hasValid(begin)) {
                            const beginText = Array.isArray(begin)
                                ? begin.map(fmtPlain).filter(Boolean).join(" | ")
                                : fmtPlain(begin);
                            if (beginText) parts.push(`رفت: ${beginText}`);
                        }

                        if (hasValid(end)) {
                            const endText = fmtPlain(end);
                            if (endText) parts.push(`برگشت: ${endText}`);
                        }

                        return parts.join(" ").trim();
                    },
                    cellMaker: (row, data, td) => {
                        const bold = set_bold_row(row) || '';
                        const unread = row.read === 0 ? " unread-invoice" : "";

                        const begin = row.travelDate?.begindate;
                        const end = row.travelDate?.enddate;

                        const hasValid = (d) => {
                            if (!d) return false;
                            if (Array.isArray(d)) return d.some(x => (x?.sstring && x.sstring !== "-") || (x?.mstring && x.mstring !== "-"));
                            return (d.sstring && d.sstring !== "-") || (d.mstring && d.mstring !== "-");
                        };

                        const safe = (v) => (v && v !== "-" ? v : "");
                        const fmt = (d) => {
                            if (!d) return "";
                            const sh = safe(d.sstring);
                            const mi = safe(d.mstring);
                            if (sh && mi) return `${sh} - (${mi})`;
                            return sh || mi || "";
                        };

                        const blocks = [];

                        // تاریخ رفت (فقط اگر موجود باشد)
                        if (hasValid(begin)) {
                            let beginHtml = "";
                            if (Array.isArray(begin)) {
                                const items = begin.map(d => fmt(d)).filter(Boolean);
                                beginHtml = items.length
                                    ? items.map(v => `<span class="en-numbers${bold}${unread}">${v}</span>`).join(' <span class="panel-text-zinc-400">|</span> ')
                                    : "";
                            } else {
                                const v = fmt(begin);
                                beginHtml = v ? `<span class="en-numbers${bold}${unread}">${v}</span>` : "";
                            }

                            if (beginHtml) {
                                blocks.push(`
          <div class="panel-flex panel-items-center panel-gap-1 ${bold}${unread}">
            تاریخ رفت:
            <span class="panel-flex panel-flex-wrap panel-gap-2">${beginHtml}</span>
          </div>
        `);
                            }
                        }

                        // تاریخ برگشت (فقط اگر موجود باشد)
                        if (hasValid(end)) {
                            const endVal = fmt(end);
                            if (endVal) {
                                blocks.push(`
          <div class="panel-flex panel-items-center panel-gap-1 ${bold}${unread}">
            تاریخ برگشت:
            <span class="en-numbers${bold}${unread}">${endVal}</span>
          </div>
        `);
                            }
                        }

                        // اگر هیچ چیز نبود، کلاً خالی برگردان
                        if (!blocks.length) return "";

                        return `
      <div class="${bold} panel-flex panel-flex-col panel-gap-1">
        ${blocks.join("")}
      </div>
    `;
                    }
                },
                service: {
                    title: "خدمات / Refnumber",
                    filter: false,
                    sort: false,
                    source: row => `${row.services?.service ?? ''}`,
                    cellMaker: (row, data, td) => {
                        const baseHtml = return_services(row);

                        const refRaw = row.webservices?.[0]?.webservices?.ws_refnumber ?? '';
                        const refText = String(refRaw).replace(/<[^>]*>/g, '').trim();
                        const refClean = refText.replace(/^\s*refnumber\s*:\s*/i, '').trim();

                        if (!refClean) return baseHtml;

                        try {
                            const wrap = document.createElement('div');
                            wrap.innerHTML = baseHtml;

                            const root = wrap.firstElementChild;
                            if (!root) return baseHtml;

                            const serviceTitleDiv = root.querySelector(':scope > div');
                            if (!serviceTitleDiv) return baseHtml;

                            serviceTitleDiv.insertAdjacentHTML(
                                'afterend',
                                `<div class="service-ref font_12">
          Refnumber: <span class="en-numbers panel-font-sans !panel-text-sm panel-font-medium">${refClean}</span>
        </div>`
                            );

                            return wrap.innerHTML;
                        } catch (e) {
                            return baseHtml;
                        }
                    }
                },
                invoiceprice: {
                    title: "مبلغ (ریال)",
                    filter: false,
                    sort: false,
                    cssClass: ["no-content-row"],
                    source: row => `${row.costinfo.totalwithcommision}`,
                    cellMaker: (row, data, td) => {
                        var cost_cloumn = document.querySelector("#cost_cloumn");
                        if (cost_cloumn) {
                            cost_cloumn.textContent = `قیمت (${row.costinfo.priceunit})`
                            cost_cloumn.removeAttribute('id');
                        }
                        return `<div><span class="panel-cursor-pointer en-numbers${set_bold_row(row)}" data-widget-header-btn-tooltip=" باقیمانده : ${seprator_default_value(row.balance)} " data-sys-tooltip="" data-tooltip-variant="info"><span class="en-numbers">${seprator_default_value(row.costinfo.totalwithcommision)}</span></span></div>`

                    }
                },
                invoicelabels: {
                    title: "لیبل",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const map = {
                            "0": { cls: "nclear panel-bg-label-redBg !panel-text-label-red", text: "تسویه نشده" },
                            "1": { cls: "clear panel-bg-label-darkGreenBg !panel-text-label-darkGreen", text: "تسویه شده" },
                            "2": { cls: "confirm panel-bg-label-orangeBg !panel-text-label-orange", text: "تسویه نشده با تایید مالی" },
                            "3": { cls: "edited panel-bg-label-blueBg !panel-text-label-blue", text: "ویرایش شده" },
                            "4": { cls: "canceled panel-bg-label-GrayBg !panel-text-label-Gray", text: "ابطال شده" },
                            "5": { cls: "clearconfirm panel-bg-label-lightGreen !panel-text-white", text: "تسویه شده توسط مالی" },
                            "6": { cls: "credit panel-bg-label-purpleBg !panel-text-label-purple", text: "پرداخت اعتباری" },
                            "8": { cls: "clearconfirm panel-bg-label-lightGreen !panel-text-white", text: "پرداخت اعتباری-تسویه شده توسط مالی" },
                        };

                        const basePill = "!panel-px-2 !panel-py-0.5 panel-rounded-2xl";

                        const labelsArr = Array.isArray(row.labels) ? row.labels : [];
                        let html = `<div class="panel-flex panel-flex-col panel-gap-1.5">`;

                        for (const item of labelsArr) {
                            const code = String(item?.labels?.label ?? "");
                            const meta = map[code];
                            if (!meta) continue;

                            html += `
        <div class="InvoiceStatus">
          <span class="${meta.cls} ${basePill}" data-descr="${meta.text}">
            ${meta.text}
          </span>
        </div>
      `;
                        }

                        html += `</div>`;
                        return html;
                    }
                },
                status: {
                    title: "وضعیت",
                    filter: false,
                    sort: false,
                    source: row => String(row.status ?? ''),
                    cellMaker: (row, data, td) => {
                        const bold = set_bold_row(row) || '';
                        const s = Number(row.status);

                        const map = {
                            2: { text: "pending", cls: "!panel-text-red-700 panel-border-red-700" },
                            1: { text: "صادر شده", cls: "!panel-text-green-700 panel-border-green-700" },
                            0: { text: "صادر نشده", cls: "!panel-text-red-700 panel-border-red-700" },
                        };

                        const item = Object.prototype.hasOwnProperty.call(map, s)
                            ? map[s]
                            : { text: "—", cls: "panel-text-zinc-600 panel-border-zinc-300" };

                        return `
      <span class="cursor ${bold}">
        <div class="InvoiceStatus">
          <span class="confirm panel-flex panel-items-center panel-justify-center panel-bg-white panel-text-xs panel-border panel-border-solid panel-rounded-2xl !panel-px-2 !panel-py-1 ${item.cls}">
            ${item.text}
          </span>
        </div>
      </span>
    `;
                    }
                },

                operation: {
                    title: "",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const adl = row.passengers?.adult ?? 0;
                        const chd = row.passengers?.child ?? 0;
                        const inf = row.passengers?.infant ?? 0;

                        const shamsi = row.createdate?.sstring ?? '-';
                        const miladi = row.createdate?.mstring ?? '-';
                        const hour = row.createhour ?? '';
                        return `<div class="panel-select__item__container panel-relative panel-cursor-pointer ">
  <div
    class="panel-row-expander"  
    data-adl="${adl}"
          data-chd="${chd}"
          data-inf="${inf}"

          data-contract-shamsi="${shamsi}"
          data-contract-miladi="${miladi}"
          data-contract-hour="${hour}"
    onclick="onPassengerRowClick(this, event)">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.9697 31.5303C19.7034 31.2641 19.6792 30.8474 19.8971 30.5538L19.9697 30.4697L26.439 24L19.9697 17.5303C19.7034 17.2641 19.6792 16.8474 19.8971 16.5538L19.9697 16.4697C20.2359 16.2034 20.6526 16.1792 20.9462 16.3971L21.0303 16.4697L28.0303 23.4697C28.2966 23.7359 28.3208 24.1526 28.1029 24.4462L28.0303 24.5303L21.0303 31.5303C20.7374 31.8232 20.2626 31.8232 19.9697 31.5303Z" fill="#71717A"></path>
    </svg>
  </div>
</div>`;
                    },
                }

            },
            rowNumber: false,
            defaultSort: {
                name: "groupname"
            },
            paging: [50, 2, 20, 10],
            defaultPagingIndex: 1,
            pagingFilterType: "server",
            culture: {
                labels: {
                    // "search": "نام درخواست کننده :",
                    "refresh": "",
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}",
                    "pageSize": ""
                }
            },
            pageSize: 3,
            pageNumber: 1,
            refreshSourceId: "list.refresh",
            refresh: true,
            noData: (td) => {
                td.innerHTML = `<div class="noData">
                                    <div class="icon">
                                        <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M45 70C45 67.2386 47.2386 65 50 65C52.7614 65 55 67.2386 55 70C55 72.7614 52.7614 75 50 75C47.2386 75 45 72.7614 45 70ZM45 30C45 27.2386 47.2386 25 50 25C52.7614 25 55 27.2386 55 30V50C55 52.7614 52.7614 55 50 55C47.2386 55 45 52.7614 45 50V30ZM49.95 0C22.35 0 0 22.4 0 50C0 77.6 22.35 100 49.95 100C77.6 100 100 77.6 100 50C100 22.4 77.6 0 49.95 0ZM50 90C27.9 90 10 72.1 10 50C10 27.9 27.9 10 50 10C72.1 10 90 27.9 90 50C90 72.1 72.1 90 50 90Z" fill="#D0D0D0"></path>
                                        </svg>
                                    </div>
                                    <div class="text">
                                        هیچ موردی یافت نشد.
                                    </div>
                                </div>
                                `
            },
            export: [
                {
                    type: "excel",
                    tooltip: "دانلود اکسل"
                }
            ]
        };
    </script>
    <script>
        function onPassengerRowClick(el, event) {
            event.preventDefault();
            event.stopPropagation();

            const tr = el.closest("tr[data-sys-tr]");
            if (!tr) return;

            // اگر قبلاً باز شده بود => ببند
            if (tr.classList.contains("passenger-row-expanded")) {
                if (tr._originalInnerHTML) tr.innerHTML = tr._originalInnerHTML;
                tr.classList.remove("passenger-row-expanded");
                return;
            }

            // تعداد ستون‌ها
            const tds = Array.from(tr.querySelectorAll("td[data-sys-td], td"));
            const colCount = tds.length || 1;

            // ذخیره HTML اولیه برای restore
            if (!tr._originalInnerHTML) tr._originalInnerHTML = tr.innerHTML;

            const d = el.dataset;

            // خلاصه ردیف (grid)
            const summaryHtml = tds
                .map((td) => `<div class="passenger-summary-cell panel-flex panel-items-center !panel-py-3">${td.innerHTML}</div>`)
                .join("");

            // آماده‌سازی مقادیر مسافر
            const passengersHtml = `
    <span class="pass-pill pass-inf">INF: <span class="en-numbers panel-font-sans panel-font-medium">${d.inf || 0}</span></span>
    <span class="pass-pill pass-adl">ADL: <span class="en-numbers panel-font-sans panel-font-medium">${d.adl || 0}</span></span>
    <span class="pass-pill pass-chd">CHD: <span class="en-numbers panel-font-sans panel-font-medium">${d.chd || 0}</span></span>
  `;

            const sh = (d.contractShamsi && d.contractShamsi !== "-") ? d.contractShamsi : "";
            const mi = (d.contractMiladi && d.contractMiladi !== "-") ? d.contractMiladi : "";

            let contractDateText = "—";
            if (sh && mi) contractDateText = `${sh} - (${mi})`;
            else if (sh) contractDateText = sh;
            else if (mi) contractDateText = mi;

            if (d.contractHour) contractDateText = `${contractDateText}  ${d.contractHour}`;

            // تبدیل tr به یک td با colspan
            tr.innerHTML = "";
            tr.classList.add("passenger-row-expanded");

            const td = document.createElement("td");
            td.colSpan = colCount;
            td.setAttribute("data-sys-td", "");
            td.setAttribute("data-bc-data", "");
            td.setAttribute("data-bc-order", "");

            td.innerHTML = `
    <div class="passenger-row-wrap panel-flex panel-flex-col">
      <div class="passenger-summary-container panel-flex panel-justify-between">
        ${summaryHtml}
      </div>

      <div class="passenger-detail panel-border-t panel-border-dashed panel-border-zinc-200 !panel-px-3 !panel-pt-3 is-open">
        <div class="passenger-detail__content panel-flex panel-items-center panel-justify-between">
          <div class="passenger-detail__item panel-flex panel-gap-2">
            <span class="k !panel-text-zinc-500">مسافران:</span>
            <span class="v panel-flex panel-items-center panel-gap-3">${passengersHtml}</span>
          </div>

          <div class="passenger-detail__item panel-flex panel-gap-2">
            <span class="k !panel-text-zinc-500">تاریخ قرارداد:</span>
            <span class="v en-numbers">${contractDateText}</span>
          </div>

          <div class="passenger-detail__actions">
            <button type="button"
              class="panel-flex panel-items-center panel-justify-center panel-w-28 panel-h-12 panel-border panel-border-solid panel-border-primary-700 panel-rounded-lg panel-text-primary-700 panel-transition-all panel-duration-300 hover:panel-bg-primary-800 hover:panel-text-white">
              مشاهده قرارداد
            </button>
          </div>
        </div>
      </div>
    </div>
  `;

            tr.appendChild(td);
        }

    </script>
</body>

</html>
