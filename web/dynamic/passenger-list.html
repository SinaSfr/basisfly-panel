<basis core="callback" run="atclient" triggers="cms.passengerlist" if="{##cms.passengerlist.run|(false)##}"
    method="callback_source"></basis>
</basis>

<basis core="callback" run="atclient" triggers="cms.new" if="{##cms.new.run|(false)##}"
    method="callback_sourcePassnegerNew">
</basis>

<basis core="api" name="api.createpage" url="https://basisfly.com/panel/main/cms/passengers-list/[##cms.cookie.rkey##]"
    method="post" body='{
"member" : [
    {
        "query" : {##cms.search.query|(0)##}
    }   
]
}' content-type="application/json" run="atclient" triggers="cms.search list.refresh" onProcessed="onProcessed_list">
</basis>

<basis core="api" name="api.autoSearch"
    url="https://data.basiscore.net/{##cms.autoSearch.lang##}/bc/{##cms.autoSearch.type##}/q/fix?term={##cms.autoSearch.term##}&token=1E45BBAE-3BE7-4B08-8A8E-8DF7B2E0C7D7"
    method="get" content-type="application/json" Access-Control-Allow-Origin='*' run="atclient"
    triggers="cms.autoSearch" if="{##cms.autoSearch.run|(false)##}" onprocessed="onProcessed_autoSearch">
</basis>

<basis core="api" name="api.save" url="https://basisfly.com/panel/main/cms/upsert-passengers/[##cms.cookie.rkey##]"
    method="post" content-type="application/json" run="atclient" triggers="cms.add_passenger"
    if="{##cms.add_passenger.run|(false)##}" body='{
        "member" : [
            {
                "passenger_list" : {##cms.add_passenger.query##}
            }
        ]
    }' onprocessed="onProcessed_save">
</basis>


<basis core="api" name="cms.get_company_ownerid" run="atclient" url="https://basisfly.com/panel/[##cms.cookie.rkey##]"
    method="post" body='{
    "name": "db",
    "mid": "20",
    "member":
    [
        {
            "type":"list",
            "name": "q",
            "request":"get_company_ownerid"
        }
    ]
}' content-type="application/json" onProcessed="onProcessedCompanyOwnerid">
</basis>

    <!-- Remove Passenger Modal -->
    <div id="removePassengerModal"
        class="panel-fixed panel-inset-0 panel-z-50 panel-flex panel-items-center panel-justify-center panel-bg-black/50 panel-hidden">
        <div class="panel-bg-white panel-rounded-2xl panel-w-96
            panel-p-6 panel-shadow-xl">

            <h3 class="panel-text-lg panel-font-bold panel-text-zinc-800 panel-mb-3">
                حذف مسافر
            </h3>

            <p class="panel-text-sm panel-text-zinc-600 panel-mb-6">
                آیا از حذف این مسافر مطمئن هستید؟
            </p>

            <input type="hidden" id="removePassengerId" />

            <div class="panel-flex panel-justify-end panel-gap-3">
                <button type="button" class="panel-px-4 panel-py-2 panel-rounded-lg
             panel-bg-zinc-200 panel-text-zinc-700
             hover:panel-bg-zinc-300" onclick="closeRemovePassengerModal()">
                    انصراف
                </button>

                <button type="button" class="panel-px-4 panel-py-2 panel-rounded-lg
             panel-bg-red-500 panel-text-white
             hover:panel-bg-red-700" onclick="removePassenger()">
                    حذف
                </button>
            </div>

        </div>
    </div>


    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>

    <script>
        async function onProcessed_save(args) {
            const response = args.response;
            if (response.status === 200) {
                const responseJson = await response.json();
                const errorId = parseInt(responseJson.errorid);
            }
            const element = document.querySelector('[data-bc-refresh-container]');
            element.querySelector('span').click();

            $bc.setSource("cms.add_passenger", [{
                "run": false
            }]);
        }

        async function onProcessed_list(args) {
            try {
                const response = args.response;
                const responseJson = await response.json();
                const data = responseJson;

                $bc.setSource("cms.order", data);
            } catch (e) {
                $bc.setSource("cms.order", []);
            }
        }

        async function callback_source(source) {
            for (const element of source.source.rows) {

                data = JSON.parse(element.query);

                var json = {};

                if (data.name) {
                    json.name = data.name;
                }

                if (data.code) {
                    json.code = data.code;
                }

                $bc.setSource('cms.search', [{
                    "query": JSON.stringify(json),
                    "run": true
                },])
            }
        };


        async function callback_sourcePassnegerNew(source) {
            // برای هر عنصر در source
            const objectId = document.querySelector('.data-id#object_id').value;

            // گرفتن مقادیر فرم
            const passengerData = {
                firstName: document.getElementById('firstNameLatin').value.trim(),
                lastName: document.getElementById('lastNameLatin').value.trim(),
                persianFirstName: document.getElementById('firstNamePersian').value.trim(),
                persianLastName: document.getElementById('lastNamePersian').value.trim(),
                nationalCode: document.getElementById('nationalCode').value.trim(),
                passportCode: document.getElementById('passportNumber').value.trim(),
                birthDate: document.getElementById('dobInput').value.replace(/\//g, '-') ?? '',
                passportExpiration: document.getElementById('passportExpiryInput').value.replace(/\//g, '-') ?? '',
                gender: document.getElementById('gender').value === '1' ? "1" : "0",
                issueCountryId: document.getElementById('nationality').dataset.id ?? 1002236,
                issueCountryName: document.getElementById('nationality').value || 'Iran'
            };

            if (objectId) {
                // حالت ویرایش
                passengerData.id = objectId;
            }

            // ارسال به API
            $bc.setSource("cms.add_passenger", [{
                query: JSON.stringify(passengerData),
                run: true
            }]);

            // بستن مودال و ریست فرم
            document.getElementById('passengerModal').classList.add('panel-hidden');
            resetPassengerForm();
        }

        async function onProcessed_autoSearch(args) {
            stop_running_autoSearch()

            const response = args.response
            if (response.status !== 200) return

            const data = await response.json()

            nationalityDropdown.innerHTML = ''

            if (!data || !data.length) {
                nationalityDropdown.innerHTML =
                    `<div class="panel-p-3 panel-text-sm panel-text-zinc-400">
                        ${translate('no_results_found')}
                    </div>`
                return
            }

            data.forEach((country) => {
                const item = document.createElement('div')
                item.className =
                    'panel-px-4 panel-py-2 panel-cursor-pointer hover:panel-bg-zinc-100 panel-text-sm'
                item.textContent = country.value

                item.onclick = () => selectNationality(country)

                nationalityDropdown.appendChild(item)
            })
        }

        function stop_running_autoSearch() {
            $bc.setSource('cms.autoSearch', [{ run: false }])
        }

        function editObject(row) {
            clearAllHighlights()
            // حالت ویرایش
            document.getElementById('add-passenger-button').textContent = translate('save_changes')
            document.querySelector('.panel-modal-title').textContent = translate('edit_passenger')

            // ذخیره id برای submit
            document.querySelector('.data-id#object_id').value = row._id

            // نام‌ها
            document.getElementById('firstNameLatin').value = row.firstName ?? ''
            document.getElementById('lastNameLatin').value = row.lastName ?? ''
            document.getElementById('firstNamePersian').value = row.persianFirstName ?? ''
            document.getElementById('lastNamePersian').value = row.persianLastName ?? ''

            // جنسیت
            // جنسیت
            if (row.gender !== undefined && row.gender !== null) {
                document.getElementById('gender').value = String(row.gender) // "0" یا "1"
            } else {
                document.getElementById('gender').value = '' // یا هر placeholder که داری
            }

            // کد ملی
            document.getElementById('nationalCode').value = row.nationalCode ?? ''

            // تاریخ تولد
            if (row.birthDate) {
                document.getElementById('dobInput').value =
                    row.birthDate.replace(/-/g, '/')
            }

            // پاسپورت
            document.getElementById('passportNumber').value = row.passportCode ?? ''
            if (row.passportExpiration) {
                document.getElementById('passportExpiryInput').value =
                    row.passportExpiration.replace(/-/g, '/')
            }

            // کشور صادرکننده
            document.getElementById('nationality').value = row.issueCountryName ?? ''
            document.getElementById('nationality').dataset.id = row.issueCountryId ?? ''

            // باز کردن مودال
            document.getElementById('passengerModal').classList.remove('panel-hidden')
        }

        function removeObject(row) {
            // ست کردن id برای حذف
            document.querySelector('.data-id#delete_id').value = row._id

        }

        function openRemovePassengerModal(passengerId) {
            document.getElementById('removePassengerId').value = passengerId
            document
                .getElementById('removePassengerModal')
                .classList.remove('panel-hidden')
        }

        function closeRemovePassengerModal() {
            document
                .getElementById('removePassengerModal')
                .classList.add('panel-hidden')
        }

        function removePassenger() {
            const id = (document.getElementById('removePassengerId')?.value || '').trim()

            if (!id) {
                closeRemovePassengerModal()
                return
            }

            const json_input = {
                id: id,
                delete: "1"
            }

            $bc.setSource("cms.add_passenger", [{
                query: JSON.stringify(json_input),
                run: true
            }])

            closeRemovePassengerModal()
        }

        function resetPassengerForm() {
            const fields = [
                'firstNameLatin', 'lastNameLatin',
                'firstNamePersian', 'lastNamePersian',
                'nationalCode', 'passportNumber',
                'dobInput', 'passportExpiryInput',
                'nationality'
            ]

            fields.forEach(id => {
                const el = document.getElementById(id)
                if (el) el.value = ''
            })

            document.getElementById('gender').value = 'gender'
            document.querySelector('.data-id#object_id').value = ''

            document.querySelector('.panel-modal-title').textContent = translate('add_passenger')
            document.getElementById('add-passenger-button').textContent = translate('add_passenger')
        }

        function openCreatePassengerModal() {
            resetPassengerForm()
            document.getElementById('passengerModal').classList.remove('panel-hidden')
        }


        document.addEventListener('DOMContentLoaded', () => {
            const passengerListForm = document.querySelector('.passenger-list__search')
            if (!passengerListForm) return

            const passengerListFormName =
                passengerListForm.querySelector('#passengerSearchName') || passengerListForm.querySelector('.passenger-list__search-name')
            const passengerListFormCode =
                passengerListForm.querySelector('#passengerSearchCode') || passengerListForm.querySelector('.passenger-list__search-code')

            passengerListForm.addEventListener('submit', (event) => {
                event.preventDefault()

                const main_json = buildPassengerSearchQuery(passengerListFormName, passengerListFormCode)
                scrollToPassengerListTop()

                if (!window.$bc || typeof window.$bc.setSource !== 'function') return

                window.$bc.setSource('cms.passengerlist', [
                    {
                        query: JSON.stringify(main_json),
                        run: true,
                    },
                ])
            })
        })

        async function onProcessedCompanyOwnerid(args) {
            const responseJson = await args.response.json();
            if (responseJson && responseJson !== 0) {
                $bc.setSource("cms.ownerid", [{
                    "result": responseJson
                }]);
            }
        }
        function buildPassengerSearchQuery(passengerListFormName, passengerListFormCode) {
            const q = {}

            const name = safeTrim(passengerListFormName?.value)
            const code = safeTrim(passengerListFormCode?.value)

            if (name) q.name = name
            if (code) q.code = code

            return q
        }

        function safeTrim(v) {
            const s = v == null ? '' : String(v)
            const t = s.trim()
            return t ? t : ''
        }

        function scrollToPassengerListTop() {
            const target = document.querySelector('.passenger-list__scroll-top') || document.querySelector('.ScrollTop')
            if (!target) return

            target.scrollIntoView({ behavior: 'smooth', block: 'start' })
        }

        var national_code_list = [];
        var reportItems = {
            columns: {
                accountname: {
                    title: "نام مسافر",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const {
                            firstName,
                            lastName,
                            persianFirstName,
                            persianLastName,
                            index
                        } = row;


                        const fullName = `${firstName ?? ''} ${lastName ?? ''}`.trim();
                        const persianFullName =
                            persianFirstName && persianLastName
                                ? `${persianFirstName} ${persianLastName}`
                                : null;

                        return `
            <div class="panel-flex panel-items-center panel-gap-2">
                <span
                    class="panel-w-12 panel-h-12 panel-flex panel-items-center panel-justify-center panel-bg-primary-800 panel-rounded-xl">
                    <svg width="48" height="48">
                        <use class="panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-sidebar-person"></use>
                    </svg>
                </span>

                <div class="panel-flex panel-flex-col panel-text-right">
                    <h2 class="panel-text-sm panel-text-zinc-900 panel-font-medium panel-flex panel-gap-1">
                        <span>${fullName}</span>
                    </h2>

                    ${persianFullName
                                ? `<p class="panel-text-xs panel-text-zinc-700">${persianFullName}</p>`
                                : ''
                            }
                </div>
            </div>
        `;
                    }
                },
                gender: {
                    title: "جنسیت",
                    filter: false,
                    sort: false,
                    source: row => {
                        if (row.gender == 1) {
                            return 'آقا'
                        } else {
                            return 'خانم'
                        }
                    },
                    cellMaker: (row, data, td) => {
                        if (row.gender == 1) {
                            return 'آقا'
                        } else {
                            return 'خانم'
                        }
                    }
                },
                nationalCode: {
                    title: "کد ملی",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        national_code_list.push(row.nationalCode);
                        return row.nationalCode;
                    }
                },
                birthDate: {
                    title: "تاریخ تولد",
                    filter: false,
                    sort: false,
                },
                passportCode: {
                    title: "شماره پاسپورت",
                    filter: false,
                    sort: false,
                },
                passportExpiration: {
                    title: "تاریخ انقضا پاسپورت",
                    filter: false,
                    sort: false,
                },
                operation: {
                    title: "عملیات",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        return `
            <div class="panel-flex panel-items-center panel-justify-center panel-gap-2">

                <!-- Edit -->
                <button
                    type="button"
                    class="panel-group panel-flex panel-items-center panel-justify-center
                           panel-w-12 panel-h-12 panel-bg-green-200 panel-rounded-xl
                           panel-transition-all panel-duration-200 hover:panel-bg-green-600"
                    onclick='editObject(${JSON.stringify(row).replace(/'/g, "\\'")})'
                    title="ویرایش">
                    
                    <svg width="24" height="24">
                        <use class="panel-text-green-700 panel-transition-all panel-duration-200
                                group-hover:panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-pencil"></use>
                    </svg>
                </button>

                <!-- Delete -->
                <button
                    type="button"
                    class="panel-group panel-flex panel-items-center panel-justify-center
                           panel-w-12 panel-h-12 panel-bg-red-100 panel-rounded-xl
                           panel-transition-all panel-duration-200 hover:panel-bg-red-500"
                    onclick="openRemovePassengerModal('${row._id}')"
                    title="حذف">
                    
                    <svg width="24" height="24">
                        <use class="panel-text-red-500 panel-transition-all panel-duration-200
                                group-hover:panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-trash"></use>
                    </svg>
                </button>

            </div>
        `;
                    }
                }
            },
            filter: 'row',
            rowNumber: false,
            defaultSort: false,
            direction: "rtl",
            paging: 50,
            information: true,
            firstAndLastBtn: true,
            culture: {
                labels: {
                    "refresh": "",
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },
            noData: (td) => {
                td.innerHTML = `<div class="noData">
                       <div class="icon panel-flex panel-justify-center panel-mb-3">
                            <svg width="70" height="70">
                                 <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                            </svg>
                        </div>
                                    <div class="text" style="padding-top: 10px;">
                                       ${translate('no_items_found')} </div>
                                </div>`
            },
            mode: "grid",
            pageCount: false,
            refresh: true,
            refreshSourceId: "list.refresh",
        };

    </script>
</body>

</html>
