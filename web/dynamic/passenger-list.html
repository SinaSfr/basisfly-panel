    <script>
        function buttonLoading(btn, state = true) {
            if (!btn) return;

            if (state) {
                // جلوگیری از تکرار
                if (btn.classList.contains("is-loading")) return;

                btn.classList.add("is-loading");

                // ذخیره وضعیت قبلی
                if (btn.dataset.wasDisabled == null) {
                    btn.dataset.wasDisabled = btn.disabled ? "1" : "0";
                }

                // ذخیره محتوا (فقط یک بار)
                if (btn.dataset.oldText == null) {
                    btn.dataset.oldText = btn.innerHTML;
                }

                btn.disabled = true;
                btn.setAttribute("aria-busy", "true");

                // جایگزینی کامل با لودینگ
                btn.innerHTML = '<div class="panel-loading__btn"></div>';
            } else {
                if (btn.dataset.oldText == null) return;

                btn.classList.remove("is-loading");
                btn.removeAttribute("aria-busy");

                if (btn.dataset.oldText != null) {
                    btn.innerHTML = btn.dataset.oldText;
                }

                btn.disabled = btn.dataset.wasDisabled === "1";

                delete btn.dataset.oldText;
                delete btn.dataset.wasDisabled;
            }
        }
        function ensureMessages(hostEl) {
            if (!hostEl) return null;
            if (hostEl.__messagesReady) return hostEl;

            const tpl = document.getElementById("panel-message__template");
            if (!tpl) return null;

            hostEl.appendChild(tpl.content.cloneNode(true));
            hostEl.__messagesReady = true;
            return hostEl;
        }

        function resolveHost(fromElOrHost) {
            // 1) اگر چیزی پاس داده نشد، اولین host صفحه
            if (!fromElOrHost) return document.querySelector(".panel-message__host");

            // 2) اگر یک Element پاس داده شد
            if (fromElOrHost instanceof Element) {
                // اگر خود host بود
                if (fromElOrHost.classList.contains("panel-message__host")) return fromElOrHost;

                // ✅ اول داخل خودش بگرد (برای وقتی host "داخل" parent است)
                const inside = fromElOrHost.querySelector?.(".panel-message__host");
                if (inside) return inside;

                // ✅ بعد اگر داخلش نبود، برو بالا (closest)
                return fromElOrHost.closest(".panel-message__host") || document.querySelector(".panel-message__host");
            }

            // 3) fallback
            return document.querySelector(".panel-message__host");
        }

        function showSuccessMessage(fromElOrHost, text = "تکمیل شد") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__success-text");

            failedWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            successWrap?.classList.remove("panel-hidden");
        }

        function showFailedMessage(fromElOrHost, text = "به‌روزرسانی ناموفق بود") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__failed-text");

            successWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            failedWrap?.classList.remove("panel-hidden");
        }

        function hideMessages(fromElOrHost) {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            host.querySelector(".panel-successed__message__content")?.classList.add("panel-hidden");
            host.querySelector(".panel-failed__message__content")?.classList.add("panel-hidden");
        }
    </script>
    <script>
        window.lastPassengerAction = null
        async function onProcessed_save(args) {
            const response = args.response;

            const removeModal = document.getElementById('removePassengerModal');
            const passengerModal = document.querySelector('.panel-passengerModal__host');

            // hostهای پیام
            const passengerHost = passengerModal.querySelector('.panel-message__host');
            const removeHost = removeModal.querySelector('.panel-message__host');

            // ✅ تعیین host فقط بر اساس آخرین action
            let hostElement;
            switch (window.lastPassengerAction) {
                case 'remove':
                    hostElement = removeHost;
                    break;
                case 'add':
                case 'edit':
                default:
                    hostElement = passengerHost;
            }

            // پاک کردن پیام قبلی
            hideMessages(hostElement);

            if (response.status === 200) {
                const responseJson = await response.json();
                const errorId = parseInt(responseJson.errorid);
                const description = responseJson.description || "عملیات ناموفق بود";

                if (errorId !== 5) {
                    showFailedMessage(hostElement, description);
                } else {
                    showSuccessMessage(hostElement, description);
                }
            } else {
                showFailedMessage(hostElement, "خطا در ارتباط با سرور");
            }

            if (window.lastPassengerAction === 'remove') {
                const removeBtn = document.querySelector('button.is-loading');
                if (removeBtn) buttonLoading(removeBtn, false);
                setTimeout(() => {
                    closeRemovePassengerModal()
                }, 1500)
            } else {
                const addBtn = document.getElementById("addPassengerButton");
                if (addBtn) buttonLoading(addBtn, false);
                setTimeout(() => {
                    document.getElementById('passengerModal').classList.add('panel-hidden');
                }, 1500)
            }


            // رفرش کانتینر
            const element = document.querySelector('[data-bc-refresh-container]');
            element.querySelector('span').click();

            // توقف source
            $bc.setSource("cms.add_passenger", [{ run: false }]);

            // ریست گلوبال
            window.lastPassengerAction = null;
        }
        async function onProcessed_list(args) {
            const passengerListForm = document.querySelector('.passenger-list__search')
            const passengerListFormBtn =
            passengerListForm.querySelector('.passenger-list__search-submit')
            try {
                const response = args.response;
                const responseJson = await response.json();
                const data = responseJson;

                $bc.setSource("cms.order", data);
                buttonLoading(passengerListFormBtn, false)

            } catch (e) {
                $bc.setSource("cms.order", []);
            }
        }

        async function callback_source(source) {
            for (const element of source.source.rows) {

                data = JSON.parse(element.query);

                var json = {};

                if (data.name) {
                    json.name = data.name;
                }

                if (data.code) {
                    json.code = data.code;
                }

                $bc.setSource('cms.search', [{
                    "query": JSON.stringify(json),
                    "run": true
                },])
            }
        };


        async function callback_sourcePassnegerNew(source) {
            // برای هر عنصر در source
            const objectId = document.querySelector('.data-id#object_id').value;
            const addBtn = document.getElementById("addPassengerButton");
            buttonLoading(addBtn, true);
            // گرفتن مقادیر فرم
            const passengerData = {
                firstName: document.getElementById('firstNameLatin').value.trim(),
                lastName: document.getElementById('lastNameLatin').value.trim(),
                persianFirstName: document.getElementById('firstNamePersian').value.trim(),
                persianLastName: document.getElementById('lastNamePersian').value.trim(),
                nationalCode: document.getElementById('nationalCode').value.trim(),
                passportCode: document.getElementById('passportNumber').value.trim(),
                birthDate: document.getElementById('dobInput').value.replace(/\//g, '-') ?? '',
                passportExpiration: document.getElementById('passportExpiryInput').value.replace(/\//g, '-') ?? '',
                gender: document.getElementById('gender').value === '1' ? "1" : "0",
                issueCountryId: document.getElementById('nationality').dataset.id ?? 1002236,
                issueCountryName: document.getElementById('nationality').value || 'Iran'
            };

            if (objectId) {
                // حالت ویرایش
                passengerData.id = objectId;
            }

            // ارسال به API
            window.lastPassengerAction = objectId ? 'edit' : 'add'
            $bc.setSource("cms.add_passenger", [{
                query: JSON.stringify(passengerData),
                run: true
            }]);

            resetPassengerForm();
        }

        async function onProcessed_autoSearch(args) {
            stop_running_autoSearch()

            const response = args.response
            if (response.status !== 200) return

            const data = await response.json()

            nationalityDropdown.innerHTML = ''

            if (!data || !data.length) {
                nationalityDropdown.innerHTML =
                    `<div class="panel-p-3 panel-text-sm panel-text-zinc-400">
                        ${translate('no_results_found')}
                    </div>`
                return
            }

            data.forEach((country) => {
                const item = document.createElement('div')
                item.className =
                    'panel-px-4 panel-py-2 panel-cursor-pointer hover:panel-bg-zinc-100 panel-text-sm'
                item.textContent = country.value

                item.onclick = () => selectNationality(country)

                nationalityDropdown.appendChild(item)
            })
        }

        function stop_running_autoSearch() {
            $bc.setSource('cms.autoSearch', [{ run: false }])
        }

        function editObject(row) {
            clearAllHighlights()
            // حالت ویرایش
            document.querySelector('.panel-modal-title').textContent = translate('edit_passenger')

            // ذخیره id برای submit
            document.querySelector('.data-id#object_id').value = row._id

            // نام‌ها
            document.getElementById('firstNameLatin').value = row.firstName ?? ''
            document.getElementById('lastNameLatin').value = row.lastName ?? ''
            document.getElementById('firstNamePersian').value = row.persianFirstName ?? ''
            document.getElementById('lastNamePersian').value = row.persianLastName ?? ''

            // جنسیت
            // جنسیت
            if (row.gender !== undefined && row.gender !== null) {
                document.getElementById('gender').value = String(row.gender) // "0" یا "1"
            } else {
                document.getElementById('gender').value = '' // یا هر placeholder که داری
            }

            // کد ملی
            document.getElementById('nationalCode').value = row.nationalCode ?? ''

            // تاریخ تولد
            if (row.birthDate) {
                document.getElementById('dobInput').value =
                    row.birthDate.replace(/-/g, '/')
            }

            // پاسپورت
            document.getElementById('passportNumber').value = row.passportCode ?? ''
            if (row.passportExpiration) {
                document.getElementById('passportExpiryInput').value =
                    row.passportExpiration.replace(/-/g, '/')
            }

            // کشور صادرکننده
            document.getElementById('nationality').value = row.issueCountryName ?? ''
            document.getElementById('nationality').dataset.id = row.issueCountryId ?? ''

            // باز کردن مودال
            const passengerModal = document.getElementById('passengerModal');
            passengerModal.classList.remove('panel-hidden');
            const passengerModalHost = document.querySelector('.panel-passengerModal__host');
            hideMessages(passengerModalHost);
        }

        function removeObject(row) {
            // ست کردن id برای حذف
            document.querySelector('.data-id#delete_id').value = row._id

        }

        function openRemovePassengerModal(passengerId) {
            const removeModal = document.getElementById('removePassengerId');
            const modalParent = document.getElementById('removePassengerModal');

            removeModal.value = passengerId;

            // باز کردن مودال
            modalParent.classList.remove('panel-hidden');

            // مخفی کردن پیام‌ها در شروع
            hideMessages(modalParent);
        }

        function closeRemovePassengerModal() {
            const modalParent = document.getElementById('removePassengerModal');

            // مخفی کردن پیام‌ها قبل از بستن
            hideMessages(modalParent);

            // بستن مودال
            modalParent.classList.add('panel-hidden');
        }

        function removePassenger(element) {
            const id = (document.getElementById('removePassengerId')?.value || '').trim()

            if (!id) {
                closeRemovePassengerModal()
                return
            }

            buttonLoading(element, true);

            const json_input = {
                id: id,
                delete: "1",
            }

            window.lastPassengerAction = 'remove'
            $bc.setSource("cms.add_passenger", [{
                query: JSON.stringify(json_input),
                run: true,
            }])
        }

        function resetPassengerForm() {
            const fields = [
                'firstNameLatin', 'lastNameLatin',
                'firstNamePersian', 'lastNamePersian',
                'nationalCode', 'passportNumber',
                'dobInput', 'passportExpiryInput',
                'nationality'
            ]

            fields.forEach(id => {
                const el = document.getElementById(id)
                if (el) el.value = ''
            })

            document.getElementById('gender').value = 'gender'
            document.querySelector('.data-id#object_id').value = ''

            document.querySelector('.panel-modal-title').textContent = translate('add_passenger')
        }

        (function () {
            document.addEventListener('DOMContentLoaded', function () {
                const openButton = document.getElementById('openPassengerModal');

                // اضافه کردن رویداد کلیک به دکمه
                openButton.addEventListener('click', openCreatePassengerModal);
            });

            function openCreatePassengerModal() {
                resetPassengerForm();
                document.getElementById('passengerModal').classList.remove('panel-hidden');
            }
        })();


        async function callbackPassengerSearch(args) {
            const passengerListForm = document.querySelector('.passenger-list__search')
            if (!passengerListForm) return

            const passengerListFormName =
                passengerListForm.querySelector('#passengerSearchName') || passengerListForm.querySelector('.passenger-list__search-name')
            const passengerListFormCode =
                passengerListForm.querySelector('#passengerSearchCode') || passengerListForm.querySelector('.passenger-list__search-code')
            const passengerListFormBtn =
                passengerListForm.querySelector('.passenger-list__search-submit')

            const main_json = buildPassengerSearchQuery(passengerListFormName, passengerListFormCode)

            if (!window.$bc || typeof window.$bc.setSource !== 'function') return

            buttonLoading(passengerListFormBtn, true)
            window.$bc.setSource('cms.passengerlist', [
                {
                    query: JSON.stringify(main_json),
                    run: true,
                },
            ])
        }


        async function onProcessedCompanyOwnerid(args) {
            const responseJson = await args.response.json();
            if (responseJson && responseJson !== 0) {
                $bc.setSource("cms.ownerid", [{
                    "result": responseJson
                }]);
            }
        }
        function buildPassengerSearchQuery(passengerListFormName, passengerListFormCode) {
            const q = {}

            const name = safeTrim(passengerListFormName?.value)
            const code = safeTrim(passengerListFormCode?.value)

            if (name) q.name = name
            if (code) q.code = code

            return q
        }

        function safeTrim(v) {
            const s = v == null ? '' : String(v)
            const t = s.trim()
            return t ? t : ''
        }


        var national_code_list = [];
        var passengerList = {
            columns: {
                accountname: {
                    title: "نام مسافر",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const {
                            firstName,
                            lastName,
                            persianFirstName,
                            persianLastName,
                            index
                        } = row;


                        const fullName = `${firstName ?? ''} ${lastName ?? ''}`.trim();
                        const persianFullName =
                            persianFirstName && persianLastName
                                ? `${persianFirstName} ${persianLastName}`
                                : null;

                        return `
            <div class="panel-flex panel-items-center panel-gap-2">
                <span
                    class="panel-w-12 panel-h-12 panel-flex panel-items-center panel-justify-center panel-bg-primary-800 panel-rounded-xl">
                    <svg width="48" height="48">
                        <use class="panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-sidebar-person"></use>
                    </svg>
                </span>

                <div class="panel-flex panel-flex-col panel-text-right">
                    <h2 class="panel-text-sm panel-text-zinc-900 panel-font-medium panel-flex panel-gap-1">
                        <span>${fullName}</span>
                    </h2>

                    ${persianFullName
                                ? `<p class="panel-text-xs panel-text-zinc-700">${persianFullName}</p>`
                                : ''
                            }
                </div>
            </div>
        `;
                    }
                },
                gender: {
                    title: "جنسیت",
                    filter: false,
                    sort: false,
                    source: row => {
                        if (row.gender == 1) {
                            return 'آقا'
                        } else {
                            return 'خانم'
                        }
                    },
                    cellMaker: (row, data, td) => {
                        if (row.gender == 1) {
                            return 'آقا'
                        } else {
                            return 'خانم'
                        }
                    }
                },
                nationalCode: {
                    title: "کد ملی",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        national_code_list.push(row.nationalCode);
                        return row.nationalCode;
                    }
                },
                birthDate: {
                    title: "تاریخ تولد",
                    filter: false,
                    sort: false,
                },
                passportCode: {
                    title: "شماره پاسپورت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const value = row.passportCode ?? '-'

                        return `
      <p class="panel-text-sm panel-text-zinc-900">
        ${value && value.trim() !== '' ? value : '-'}
      </p>
    `
                    }
                },

                passportExpiration: {
                    title: "تاریخ انقضا پاسپورت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const value = row.passportExpiration ?? '-'

                        return `
      <p class="panel-text-sm panel-text-zinc-900">
        ${value && value.trim() !== '' ? value : '-'}
      </p>
    `
                    }
                },
                operation: {
                    title: "عملیات",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        return `
            <div class="panel-flex panel-items-center panel-justify-center panel-gap-2">

                <!-- Edit -->
                <button
                    type="button"
                    class="panel-group panel-flex panel-items-center panel-justify-center
                           panel-w-12 panel-h-12 panel-bg-green-200 panel-rounded-xl
                           panel-transition-all panel-duration-200 hover:panel-bg-green-600"
                    onclick='editObject(${JSON.stringify(row).replace(/'/g, "\\'")})'
                    title="ویرایش">
                    
                    <svg width="24" height="24">
                        <use class="panel-text-green-700 panel-transition-all panel-duration-200
                                group-hover:panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-pencil"></use>
                    </svg>
                </button>

                <!-- Delete -->
                <button
                    type="button"
                    class="panel-group panel-flex panel-items-center panel-justify-center
                           panel-w-12 panel-h-12 panel-bg-red-100 panel-rounded-xl
                           panel-transition-all panel-duration-200 hover:panel-bg-red-500"
                    onclick="openRemovePassengerModal('${row._id}')"
                    title="حذف">
                    
                    <svg width="24" height="24">
                        <use class="panel-text-red-500 panel-transition-all panel-duration-200
                                group-hover:panel-text-white" href="/userPanel/images/panel-sprite-icons.svg#icon-trash"></use>
                    </svg>
                </button>

            </div>
        `;
                    }
                }
            },
            filter: 'row',
            rowNumber: false,
            defaultSort: false,
            direction: "rtl",
            paging: 50,
            information: true,
            firstAndLastBtn: true,
            culture: {
                labels: {
                    "refresh": "",
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },
            noData: (td) => {
                td.innerHTML = `<div class="noData">
                       <div class="icon panel-flex panel-justify-center panel-mb-3">
                            <svg width="70" height="70">
                                 <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                            </svg>
                        </div>
                                    <div class="text" style="padding-top: 10px;">
                                       ${translate('no_items_found')} </div>
                                </div>`
            },
            mode: "grid",
            pageCount: false,
            refresh: true,
            refreshSourceId: "list.refresh",
        };

    </script>
</body>

</html>
