<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <basis core="call" file="book/taglist" lid="1"></basis>
    <title>اطلاعات کابر</title>
    <meta name="description" content="اطلاعات کابر">
    <link href="[##cms.cms.cdn##]/userPanel/css/user-panel.ui.min.css?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/css" rel="stylesheet" />
</head>

<body class="panel-bg-zinc-50">
    <!-- Header -->
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <!-- Main-->
    <main>

        <div class="panel-flex panel-gap-2 panel-mx-auto max-xl:panel-w-[97%] xl:panel-max-w-7xl panel-mt-14">
            <basis core="call" file="userPanel/sidebar" lid="1" pageindexid="1"></basis>
            <div class="panel-flex-1 panel-bg-white panel-rounded-2xl panel-p-6">
                <section>
                    <div class="panel-flex panel-items-center panel-justify-between">
                        <div class="panel-flex panel-items-center panel-gap-3">
                            <span
                                class="panel-w-14 panel-h-14 panel-flex panel-items-center panel-justify-center panel-bg-primary-800 panel-rounded-2xl">
                                <svg width="48" height="48" class="panel-text-white">
                                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-sidebar-person"></use>
                                </svg>
                            </span>
                            <div class="panel-flex panel-flex-col panel-justify-between panel-h-full">
                                <h2 class="panel-text-sm panel-text-zinc-900 panel-font-bold">اطلاعات شخصی</h2>
                                <p class="panel-text-xs panel-text-zinc-900">
                                    مشخصات هویتی و شناسنامه ای خود را وارد کنید
                                </p>
                            </div>
                        </div>
                        <div class="panel-successed__message__content panel-hidden">
                            <div
                                class="panel-flex panel-items-center panel-gap-2 panel-bg-green-200 panel-text-green-700 panel-px-3 panel-py-4 panel-rounded-lg">
                                <svg width="24" height="24">
                                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-tick"></use>
                                </svg>
                                <span class="panel-message__success-text">تکمیل شد</span>
                            </div>

                        </div>
                        <div class="panel-failed__message__content panel-hidden">
                            <div
                                class="panel-flex panel-items-center panel-gap-2 panel-bg-red-200 panel-text-red-700 panel-px-3 panel-py-4 panel-rounded-lg">
                                <svg width="24" height="24">
                                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-failed"></use>
                                </svg>
                                <span class="panel-message__failed-text">به‌روزرسانی ناموفق بود</span>
                            </div>
                        </div>
                    </div>
                    <div class="Panel_UserInfo panel-mt-6">
                        <!-- Commands / Requests -->
                        <basis core="call" file="userPanel/profile/commands" lid="1"></basis>
                        <div class="panel-flex panel-items-center panel-justify-center">
                            <div class="panel-loading__content"></div>
                        </div>
                    </div>


                </section>
                <button data-btn-editUserSchema type="button"
                    class="panel-relative panel-group panel-overflow-hidden panel-block panel-hidden panel-z-10 panel-pr-2 panel-pl-6 panel-bg-primary-800 panel-text-white panel-rounded-xl panel-text-sm panel-font-medium panel-mr-auto panel-mt-4 panel-border panel-border-solid panel-border-primary-800 panel-transition-all panel-duration-300 hover:panel-text-primary-800">
                    <div class="panel-btn__content panel-relative panel-z-10 panel-flex panel-items-center panel-justify-center">
                        <svg width="48" height="48">
                            <use href="/userPanel/images/panel-sprite-icons.svg#icon-drive"></use>
                        </svg>
                        <span>ذخیره تغییرات</span>
                    </div>
                    <span class="panel-btn__loader panel-absolute panel-inset-0 panel-flex panel-items-center panel-justify-center panel-hidden" aria-hidden="true">
                        <span class="panel-loading__btn"></span>
                    </span>
                    <span
                        class="panel-btn__hoverfx panel-absolute panel-w-full panel-inset-0 panel-transition-transform panel-duration-300 panel-h-14 panel-origin-right panel-scale-x-0 panel-bg-white group-hover:panel-scale-x-100"></span>
                </button>
            </div>
        </div>
    </main>
    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>
</body>

</html>
