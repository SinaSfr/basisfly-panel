<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <basis core="call" file="book/taglist" lid="1"></basis>
    <title>اطلاعات رزرو</title>
    <meta name="description" content="اطلاعات رزرو">
    <link href="[##cms.cms.cdn##]/userPanel/css/user-panel.ui.min.css?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/css" rel="stylesheet" />
    <style>
        .panel-items-baseline {
            align-items: baseline;
        }

        .panel-inline-block {
            display: inline-block;
        }

        .panel-rtl {
            direction: rtl;
        }

        .panel-ltr {
            direction: ltr;
        }

        .\!panel-mt-1 {
            margin-top: 0.25rem !important;
        }

        .\!panel-mx-auto {
            margin-left: auto !important;
            margin-right: auto !important;
        }

        .panel-user__description table thead tr:first-child,
        .panel-docs table thead tr:first-child {
            display: none !important;
        }

        .\!panel-py-5 {
            padding-top: 1.25rem !important;
            padding-bottom: 1.25rem !important;
        }
    </style>
</head>

<body class="panel-bg-zinc-50">
    <!-- Header -->
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <!-- Main-->
    <main>
        <div class="panel-flex panel-gap-2 panel-mx-auto max-xl:panel-w-[97%] xl:panel-max-w-7xl panel-mt-14">
            <!-- Sidebar -->
            <basis core="call" file="userPanel/sidebar" lid="1" pageindexid="1"></basis>
            <!-- Commands / Requests -->
            <basis core="call" file="userPanel/booking/view/commands" lid="1"></basis>
            <basis core="call" file="userPanel/final/payment/commands" lid="1"></basis>
            <!-- Layout Section -->
            <div class="panel-flex-1">
                <!-- Invoice Header / Summary -->
                <basis core="print" datamembername="db.invoice_scalar_value" run="atclient">
                    <face>
                        <script type="text/template">
                            <div data-unit="@unit@" data-type="@type@" data-factorid="@factorid@"
                            class="panel-invoice__value panel-bg-white panel-border panel-border-zinc-200 panel-border-solid panel-rounded-xl panel-p-3">
                            <div class="panel-text-xs panel-text-zinc-600 panel-flex panel-gap-1">
                                <a href="/" class="panel-text-xs panel-text-zinc-600">صفحه اصلی</a>
                                <span>></span>
                                <a href="/userPanel/booking/list" class="panel-text-xs panel-text-zinc-600">سفرهای من</a>
                                <span>></span>
                                {{
                                    return `مشاهده <span>${$data.open == 0 ? 'قرارداد' : 'پیش قرارداد'}</span> / شماره`
                                }}
                                <span>@factorid@</span>
                            </div>
                            <div class="panel-flex panel-items-center panel-justify-between panel-mt-2">
                                {{
                                    return `<h2 class="panel-font-medium panel-text-zinc-900">مشاهده ${$data.open == 0 ? 'قرارداد' : 'پیش قرارداد'}</h2>`
                                }}
                                <div class="panel-flex panel-items-center panel-gap-5">
                                    <span
                                        class="panel-flex panel-items-center panel-gap-1 panel-font-medium panel-text-xs">ساعت:
                                        <span>@time@ دقیقه</span></span>
                                    <span
                                        class="panel-flex panel-items-center panel-gap-1 panel-font-medium panel-text-xs">شماره
                                        فاکتور: <span>@factorid@</span></span>
                                </div>
                            </div>
                            {{
                                const safeTitle = $data.title.replace(/&/g, '#&#').replace(/</g, '<').replace(/>/g, '>');
                                return ` <div class="panel-bg-primary-50 panel-rounded-lg panel-px-3 panel-py-1 panel-text-sm panel-mt-3"><span>${safeTitle}</span>
                                    ${$data.cancel == 0 ? '' : '<span class="panel-text-label-red panel-px-2">(باطل شد)</span>'}
                                </div>`
                            }}
                        </div>
                        <section class="panel-flex panel-items-center panel-gap-2 panel-mt-5">
                            <div
                                class="panel-flex-[2] panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                <span
                                    class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                    <svg width="31" height="31">
                                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-calendar-tools"></use>
                                    </svg>
                                </span>
                                <div class="panel-flex panel-flex-col panel-justify-between">
                                    <span class="panel-text-xs panel-text-zinc-900">تاریخ سفر</span>
                                    <div class="panel-flex panel-items-center panel-gap-6 panel-items-baseline">
                                        <div class="panel-text-zinc-900 panel-text-sm panel-flex panel-gap-1"><span>@travelDate.sstring.from@</span>
                                            {{
                                                if($data.travelDate.sstring.to !== ''){
                                                    return `<span>الی</span><span>${$data.travelDate.sstring.to}</span>`
                                                };
                                            }}
                                        </div>
                                        <div class="panel-text-zinc-900 panel-text-sm panel-flex panel-gap-1 panel-font-sans">
                                            <span>@travelDate.mstring.from@</span>
                                            {{
                                                if($data.travelDate.mstring.to !== ''){
                                                    return `<span>to</span><span>${$data.travelDate.mstring.to}</span>`
                                                };
                                            }}
                                        </div>
                                    </div>
                               
                                </div>
                            </div>
                            <div
                                class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                <span
                                    class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                    <svg width="31" height="31">
                                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-calendar"></use>
                                    </svg>
                                </span>
                                <div class="panel-flex panel-flex-col panel-justify-between">
                                    {{
                                        return `<span class="panel-text-xs panel-text-zinc-900 panel-flex panel-gap-1">تاریخ <span> ${$data.open == 0 ? 'قرارداد' :  'پیش قرارداد'} </span></span>`
                                    }}
                                   
                                    <div class="panel-flex panel-items-baseline panel-gap-5">
                                        <span class="panel-text-zinc-900 panel-text-sm">@invoiceDate.sdate@</span>
                                        <span class="panel-text-zinc-900 panel-text-sm panel-font-sans">@invoiceDate.mdate@</span>
                                    </div>
                                </div>
                            </div>
                            <div
                                class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                <span
                                    class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                    <svg width="31" height="31" class="panel-text-zinc-900">
                                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-two-person"></use>
                                    </svg>
                                </span>
                                <div class="panel-flex panel-flex-col panel-justify-between">
                                    <span class="panel-text-xs panel-text-zinc-900">مسافران</span>
                                    <span class="panel-text-zinc-900 panel-text-sm">@passengers@ مسافر</span>
                                </div>
                            </div>
                        </section>
                        </script>
                    </face>
                </basis>
                <!-- Tabs Navigation -->
                <nav class="panel-bg-zinc-200 panel-rounded-xl panel-p-3 panel-mt-8">
                    <ul class="panel-flex panel-items-center panel-gap-4" id="tabs">
                        <li data-tab="profile"
                            class="panel-flex-1 panel-flex panel-items-center panel-justify-center panel-gap-1 panel-h-12 panel-text-sm panel-text-zinc-900 panel-bg-white panel-rounded-xl panel-cursor-pointer panel-px-2 panel-transition-all panel-duration-300 hover:panel-bg-white">
                            <svg width="24" height="24" class="panel-text-zinc-900">
                                <use href="/userPanel/images/panel-sprite-icons.svg#icon-sidebar-person-small"></use>
                            </svg>
                            <span>مشخصات خرید</span>
                        </li>

                        <li data-tab="finance"
                            class="panel-flex-1 panel-flex panel-items-center panel-justify-center panel-gap-1 panel-h-12 panel-text-sm panel-text-zinc-900 panel-rounded-xl panel-cursor-pointer panel-px-2 panel-transition-all panel-duration-300 hover:panel-bg-white">
                            <svg width="24" height="24" class="panel-text-zinc-900">
                                <use href="/userPanel/images/panel-sprite-icons.svg#icon-invoice"></use>
                            </svg>
                            <span>مالی</span>
                        </li>

                        <li data-tab="docs"
                            class="panel-flex-1 panel-flex panel-items-center panel-justify-center panel-gap-1 panel-h-12 panel-text-sm panel-text-zinc-900 panel-rounded-xl panel-cursor-pointer panel-px-2 panel-transition-all panel-duration-300 hover:panel-bg-white">
                            <svg width="24" height="24" class="panel-text-zinc-900">
                                <use href="/userPanel/images/panel-sprite-icons.svg#icon-document-small"></use>
                            </svg>
                            <span>مدارک</span>
                        </li>

                        <li data-tab="payment"
                            class="panel-flex-1 panel-flex panel-items-center panel-justify-center panel-gap-1 panel-h-12 panel-text-sm panel-text-zinc-900 panel-rounded-xl panel-cursor-pointer panel-px-2 panel-transition-all panel-duration-300 hover:panel-bg-white">
                            <svg width="24" height="24">
                                <use href="/userPanel/images/panel-sprite-icons.svg#icon-card"></use>
                            </svg>
                            <span>پرداخت</span>
                        </li>

                        <li data-tab="notes"
                            class="panel-flex-1 panel-flex panel-items-center panel-justify-center panel-gap-1 panel-h-12 panel-text-sm panel-text-zinc-900 panel-rounded-xl panel-cursor-pointer panel-px-2 panel-transition-all panel-duration-300 hover:panel-bg-white">
                            <svg width="24" height="24">
                                <use href="/userPanel/images/panel-sprite-icons.svg#icon-pencil"></use>
                            </svg>
                            <span>پاداشت ها</span>
                        </li>

                        <li data-tab="refund"
                            class="panel-flex-[2] panel-flex panel-items-center panel-justify-center panel-gap-1 panel-h-12 panel-text-sm panel-text-zinc-900 panel-rounded-xl panel-cursor-pointer panel-px-2 panel-transition-all panel-duration-300 hover:panel-bg-white">
                            <svg width="24" height="24">
                                <use href="/userPanel/images/panel-sprite-icons.svg#icon-refund"></use>
                            </svg>
                            <span> درخواست استرداد و تغییر</span>
                        </li>
                    </ul>


                </nav>
                <!-- Tabs Content Wrapper -->
                <div class="panel-mt-4 panel_grid_style">
                    <!-- Tab Panel: Profile (Purchase Details) -->
                    <div data-tab-panel="profile">
                        <basis core="call" run="atclient" file="/userPanel/booking/view/profile" method="get" lid="1"
                            pageindex="[##cms.cms.pageindex|(1)##]">
                        </basis>
                    </div>
                    <!-- Tab Panel: Finance -->
                    <div data-tab-panel="finance" class="panel-hidden">
                        <basis core="call" run="atclient" file="/userPanel/booking/view/finance" method="get" lid="1"
                            if="{##cms.finance##}" triggers="cms.finance" pageindex="[##cms.cms.pageindex|(1)##]">
                        </basis>
                    </div>
                    <!-- Tab Panel: Docs -->
                    <div data-tab-panel="docs" class="panel-hidden">
                        <basis core="call" run="atclient" file="/userPanel/booking/view/docs" method="get" lid="1"
                            if="{##cms.docs##}" triggers="cms.docs" pageindex="[##cms.cms.pageindex|(1)##]"
                            OnRendered="addDocsRadioEventListeners">
                        </basis>
                    </div>

                    <!-- Tab Panel: Payment -->
                    <div data-tab-panel="payment" class="panel-hidden">
                        <basis core="call" run="atclient" file="/userPanel/booking/view/payment" method="get" lid="1"
                            if="{##cms.payment##}" triggers="cms.payment" pageindex="[##cms.cms.pageindex|(1)##]">
                        </basis>

                    </div>

                    <!-- Tab Panel: notes -->
                    <div data-tab-panel="notes" class="panel-hidden">
                        <basis core="call" run="atclient" file="/userPanel/booking/view/notes" method="get" lid="1"
                            if="{##cms.notes##}" triggers="cms.notes" pageindex="[##cms.cms.pageindex|(1)##]">
                        </basis>
                    </div>
                    <!-- Tab Panel: Refund -->
                    <div data-tab-panel="refund" class="panel-hidden">
                        <basis core="call" run="atclient" file="/userPanel/booking/view/refund" method="get" lid="1"
                            if="{##cms.refund##}" triggers="cms.refund" pageindex="[##cms.cms.pageindex|(1)##]">
                        </basis>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="sharedDropdown"
        class="panel-hidden panel-fixed panel-z-50 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-shadow-lg panel-overflow-hidden"
        role="listbox" aria-label="dropdown">
        <div class="panel-p-3 panel-border-b panel-border-solid panel-border-zinc-200">
            <input id="sharedDropdownSearch" type="text"
                class="panel-w-full panel-h-12 panel-bg-zinc-100 panel-rounded-xl panel-border panel-border-solid panel-border-zinc-200 panel-px-4 panel-outline-none focus:panel-border-primary-800 focus:panel-bg-white panel-transition panel-duration-300"
                placeholder="جستجو..." />
        </div>
        <div id="sharedDropdownList" class="panel-max-h-40 panel-overflow-y-auto panel-p-2"></div>
    </div>
    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>
    <script>
        /**
   * ------------------------------------------------------------
   * Profile Tabs + Grids (cleaned + deduplicated)
   * - English comments
   * - Shared helpers to avoid repeating the same logic everywhere
   * ------------------------------------------------------------
   */

        /* =========================
           Shared Helpers
        ========================= */

        /**
         * Safely convert any value to trimmed string.
         */
        function toText(value, fallback = "-") {
            if (value == null) return fallback;
            const s = String(value).trim();
            return s === "" ? fallback : s;
        }

        /**
         * Render value with LTR wrapper (phones, codes, etc.).
         */
        function renderLtr(value, fallback = "-") {
            return `<span class="panel-inline-block panel-ltr">${toText(value, fallback)}</span>`;
        }

        /**
         * Render value with sans font (emails, passports, etc.).
         */
        function renderSans(value, fallback = "-") {
            return `<span class="panel-font-sans">${toText(value, fallback)}</span>`;
        }

        /**
         * Format numbers with Intl.NumberFormat safely.
         */
        function formatNumber(value, fallback = "-") {
            if (value == null || value === "") return fallback;
            const n = Number(value);
            if (Number.isNaN(n)) return fallback;
            return new Intl.NumberFormat().format(n);
        }

        /**
         *  gender mapping (profile buyer).
         */
        function mapGender(gender) {
            if (gender == 0) return "زن";
            if (gender == 1) return "مرد";
            return "-";
        }



        /**
         * Buyer account type mapping.
         */
        function mapBuyerAccType(acctype) {
            if (acctype == 243) return "مسافر";
            if (acctype == 241) return "کانتر آژانس خودم";
            if (acctype == 181) return "کانتر آژانس خودم";
            if (acctype == 182) return "تامین کننده";
            if (acctype == 242) return "کانتر آژانس همکار";
            return "-";
        }

        /**
         * Passenger type mapping.
         */
        function mapPassengerType(t) {
            if (t == 0) return "نوزاد";
            if (t == 1) return "کودک";
            if (t == 2) return "بزرگسال";
            if (t == 3) return "کودک";
            if (t == 4) return "بزرگسال (اضافی)";
            return "-";
        }

        /**
         * Map cabin class to Persian labels.
         */
        function mapCabinClassFa(v) {
            const s = toText(v, "").toLowerCase();
            if (s === "economy") return "اکونومی";
            if (s === "business" || s === "bussiness") return "بیزینس";
            if (s === "first") return "فرست";
            return toText(v, "");
        }

        /**
         * Build "Webservice / Ref" cell HTML for an object: {webservice, refnumber}.
         */
        function renderWebserviceCell(wsObj) {
            if (!wsObj) return "-";

            const ws = toText(wsObj.webservice, "-");
            const refRaw = toText(wsObj.refnumber, "");
            const ref = refRaw === "-" ? "" : refRaw;

            return `<div class="panel-flex panel-gap-1 panel-justify-center panel-items-center panel-font-sans">
        <span>${ws}</span>
        ${ref ? `<span>/</span><span>${ref}</span>` : ``}
    </div>`;
        }

        /**
         * Safely show an element by selector (remove "hidden" if exists).
         */
        function unhideIfExists(selector) {
            const el = document.querySelector(selector);
            if (!el) return;
            el.classList.remove("hidden");
        }

        /**
         * Safe $bc.setSource wrapper.
         */
        function setBcSourceSafe(key, value) {
            if (!window.$bc || typeof $bc.setSource !== "function") {
                console.warn("$bc.setSource is not available");
                return;
            }
            $bc.setSource(key, value);
        }

        /**
         * Shared grid UI/behavior options.
         */
        const GRID_BASE_OPTIONS = {
            sorting: false,
            filter: false,
            rowNumber: false,
            defaultSort: false,
            direction: "rtl",
            paging: "",
            information: false,
            firstAndLastBtn: false,
        };

        /**
         * Create a grid config with shared base options.
         */
        function makeGrid(columns) {
            return { columns, ...GRID_BASE_OPTIONS };
        }

        /* =========================
           Tabs Controller
        ========================= */

        document.addEventListener("DOMContentLoaded", () => {


            /**
             * Tabs root element (ul or container that holds li[data-tab]).
             */
            const tabsRoot = document.getElementById("tabs");
            if (!tabsRoot) return;

            /**
             * Tabs and panels.
             */
            const tabs = Array.from(tabsRoot.querySelectorAll("li[data-tab]"));
            const panels = Array.from(document.querySelectorAll("[data-tab-panel]"));

            /**
             * Hidden class support (some templates use "hidden", some use "panel-hidden").
             */
            const HIDDEN_CLASSES = ["panel-hidden", "hidden"];
            const ACTIVE_CLASS = "panel-bg-white";

            /**
             * Keep track of which tabs have already loaded their data source once.
             */
            const loadedTabs = new Set();

            /**
             * Tab-to-source map (profile is intentionally excluded).
             */
            const apiByTab = {
                finance: () => setBcSourceSafe("cms.finance", true),
                docs: () => setBcSourceSafe("cms.docs", true),
                payment: () => setBcSourceSafe("cms.payment", true),
                notes: () => setBcSourceSafe("cms.notes", true),
                refund: () => setBcSourceSafe("cms.refund", true),
            };

            /**
             * Hide/show utilities.
             */
            function hideEl(el) {
                HIDDEN_CLASSES.forEach((c) => el.classList.add(c));
            }

            function showEl(el) {
                HIDDEN_CLASSES.forEach((c) => el.classList.remove(c));
            }

            /**
             * Set active tab and show/hide panels.
             */
            function setActiveTab(tabKey) {
                panels.forEach((p) => {
                    const key = p.getAttribute("data-tab-panel");
                    if (key === tabKey) showEl(p);
                    else hideEl(p);
                });

                tabs.forEach((t) => {
                    const isActive = t.getAttribute("data-tab") === tabKey;
                    t.classList.toggle(ACTIVE_CLASS, isActive);
                    t.setAttribute("aria-selected", isActive ? "true" : "false");
                });
            }

            /**
             * Run API/source only once per tab (profile never runs).
             */
            function runApiOnce(tabKey) {
                if (tabKey === "profile") return;
                if (loadedTabs.has(tabKey)) return;

                loadedTabs.add(tabKey);

                const fn = apiByTab[tabKey];
                if (typeof fn !== "function") return;

                try {
                    fn();
                } catch (e) {
                    console.error("Tab API failed:", tabKey, e);
                }
            }

            /**
             * Click handler for tabs.
             */
            tabsRoot.addEventListener("click", (e) => {
                const li = e.target.closest("li[data-tab]");
                if (!li || !tabsRoot.contains(li)) return;

                const tabKey = li.getAttribute("data-tab");
                if (!tabKey) return;

                setActiveTab(tabKey);
                runApiOnce(tabKey);
            });

            /**
             * Initial state: show profile only (no API).
             */
            setActiveTab("profile");
        });

        /* =========================
           Buyer Grids
        ========================= */

        if (typeof bvProfileBuyerPersonGrid === "undefined") {
            /**
             * Grid: Buyer -> Person (includes userid column).
             */
            var bvProfileBuyerPersonGrid = makeGrid({
                firstname: {
                    title: "نام",
                    cellMaker: (row) => toText(row?.fullname?.firstname),
                },
                lastname: {
                    title: "نام خانوادگی",
                    cellMaker: (row) => toText(row?.fullname?.lastname),
                },
                email: {
                    title: "ایمیل",
                    cellMaker: (row) => renderSans(row?.email),
                },
                tel: {
                    title: "تلفن ثابت",
                    cellMaker: (row) => renderLtr(row?.tel),
                },
                mobile: {
                    title: "تلفن همراه",
                    cellMaker: (row) => renderLtr(row?.mobile),
                },
                address: "آدرس",
                gender: {
                    title: "جنسیت",
                    cellMaker: (row) => mapGender(row?.gender),
                },
                counterName: "کانتر اقدام کننده",
                acctype: {
                    title: "نوع خریدار",
                    cellMaker: (row) => mapBuyerAccType(row?.acctype),
                },
                userid: {
                    title: "(UserId)کد کاربر ",
                    cellMaker: (row) => `<span>${toText(row?.userid)}</span>`,
                },
            });
        }

        if (typeof bvProfileBuyerMycounterPGrid === "undefined") {
            /**
             * Grid: Buyer -> My Counter (Person)
             */
            var bvProfileBuyerMycounterPGrid = makeGrid({
                firstname: {
                    title: "نام",
                    cellMaker: (row) => toText(row?.fullname?.firstname),
                },
                lastname: {
                    title: "نام خانوادگی",
                    cellMaker: (row) => toText(row?.fullname?.lastname),
                },
                email: {
                    title: "ایمیل",
                    cellMaker: (row) => renderSans(row?.email),
                },
                tel: {
                    title: "تلفن ثابت",
                    cellMaker: (row) => renderLtr(row?.tel),
                },
                mobile: {
                    title: "تلفن همراه",
                    cellMaker: (row) => renderLtr(row?.mobile),
                },
                address: "آدرس",
                gender: {
                    title: "جنسیت",
                    cellMaker: (row) => mapGender(row?.gender),
                },
                counterName: "کانتر اقدام کننده",
                acctype: {
                    title: "نوع خریدار",
                    cellMaker: (row) => mapBuyerAccType(row?.acctype),
                },
            });
        }

        if (typeof bvProfileBuyerMycounterAGrid === "undefined") {
            /**
             * Grid: Buyer -> My Counter (Agency)
             */
            var bvProfileBuyerMycounterAGrid = makeGrid({
                agencyname: "نام آژانس",
                agencymanegername: "مدیر عامل",
                agencytell: {

        function addDocsRadioEventListeners() {
            setBcSourceSafe("cms.user-type", true); // Set user type

            // Language section: Initialize event listeners for language change
            const languageRadios = document.querySelectorAll('[name="language"]'); // Select all language radio buttons

            // Header section: Initialize event listeners for header change
            const headerRadios = document.querySelectorAll('[name="header"]'); // Select all header radio buttons

            // Language change event listener
            languageRadios.forEach(radio => {
                radio.addEventListener('change', function () {
                    // Get the selected language
                    const selectedLanguage = document.querySelector('input[name="language"]:checked + span').textContent;

                    // Update the language in panel-docs
                    const langElements = document.querySelectorAll('.panel-docs__lang');
                    langElements.forEach(el => {
                        el.textContent = selectedLanguage; // Update language in the document
                    });

                    // Determine the language value to send
                    let langValue = '';
                    if (selectedLanguage === 'فارسی') {
                        langValue = '1'; // Persian
                    } else if (selectedLanguage === 'انگلیسی') {
                        langValue = '2'; // English
                    } else if (selectedLanguage === 'عربی') {
                        langValue = '3'; // Arabic
                    }

                    // Send the selected language value to the backend
                    setBcSourceSafe("cms.lang", langValue);
                });
            });

            // Header change event listener
            headerRadios.forEach(radio => {
                radio.addEventListener('change', function () {
                    // Check if "with header" is selected
                    const isWithHeader = document.querySelector('input[name="header"]:checked + span').textContent.includes('با سربرگ');

                    // Update header type in panel-docs
                    const headerElements = document.querySelectorAll('.panel-docs__header__type');
                    headerElements.forEach(el => {
                        el.textContent = isWithHeader ? 'با سربرگ' : 'بدون سربرگ'; // Update header text based on selection
                    });

                    // Update the links based on header selection (with header / without header)
                    const links = document.querySelectorAll('.panel-docs a');
                    links.forEach(link => {
                        const dataWhead = link.getAttribute('data-whead');
                        const dataWohead = link.getAttribute('data-wohead');

                        // Change the href based on the selected header type
                        link.href = isWithHeader ? dataWhead : dataWohead;
                    });
                });
            });
        }

         * Handles the selection of an invoice passenger checkbox.
         * Updates the 'name' attribute of hidden inputs in the closest row
         * based on the checkbox state (checked or unchecked).
         * 
         * @param {Event} event - The click event triggered by the checkbox.
         * @param {HTMLElement} element - The checkbox element itself.
         */
        function handleInvoicePassengerSelection(event, element) {
            try {
                const row = element.closest("tr");
                const hiddenInputs = row.querySelectorAll("input[type=hidden]");

                hiddenInputs.forEach(input => {
                    // Set the name attribute based on the checkbox state
                    if (event.target.checked) {
                        input.setAttribute("name", input.getAttribute("data-name"));
                    } else {
                        input.setAttribute("name", "");
                    }
                });
            } catch (error) {
                console.error("Error handling invoice passenger selection:", error);
            }
        }

        function tokenCallback(args) {
            try {
                const paymentDiv = document.querySelector('div[data-payment-type]');
                const invoicetypeElement = document.querySelector('.panel-invoice__value');
                const id = invoicetypeElement?.getAttribute('data-factorid') || "";

                const source = args.source?.rows;
                if (source && source[0].url_gateway) {
                    // ارسال داده‌ها به cms.save-inputs اگر payment-type برابر با 'invoice' باشد
                    if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'invoice') {
                        $bc.setSource("cms.save-inputs", {
                            randomId: sixDigitNumber,
                            provider: bankProviderId,
                            bankid: bankId,
                            factorid: id,
                            session: source[0].session,
                            orderid: source[0].orderid,
                            doc_type: 6,
                        });
                    }

                    // بررسی متد درخواست و ارسال فرم یا انتقال به درگاه
                    if (source[0].method === 'POST') {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = source[0].form;
                        const form = tempDiv.querySelector('form');
                        if (form) {
                            document.body.appendChild(form);  // فرم را به body اضافه می‌کنیم
                            form.submit();
                        }
                    } else {
                        window.location = source[0].url_gateway;
                    }



                } else {
                    // در صورت عدم وجود url_gateway، نمایش پیام خطا
                    // const errorDiv = document.createElement('div');
                    // errorDiv.id = 'text-loading';
                    // errorDiv.textContent = 'امکان اتصال به درگاه پرداخت الکترونیک وجود ندارد.';
                    // document.body.appendChild(errorDiv);  // اضافه کردن به body
                }
            } catch (err) {
                console.error('tokenCallback=' + err.lineNumber + ',' + err.message);
            }
        }

    </script>
</body>

</html>
