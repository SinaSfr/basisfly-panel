    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.panel-tab[data-target]')
            const panels = document.querySelectorAll('[data-panel]')

            function setActiveTab(activeTab) {
                tabs.forEach((t) => t.classList.remove('panel-bg-white'))
                activeTab.classList.add('panel-bg-white')
            }

            function showPanel(name) {
                panels.forEach((p) => p.classList.add('panel-hidden'))
                const target = document.querySelector(`[data-panel="${name}"]`)
                target?.classList.remove('panel-hidden')
            }

            tabs.forEach((tab) => {
                tab.addEventListener('click', () => {
                    setActiveTab(tab)
                    showPanel(tab.dataset.target)
                })
            })

            if (tabs[0]) {
                setActiveTab(tabs[0])
                showPanel(tabs[0].dataset.target)
            }
        })
    </script>

        async function onProcessedReportDoc(args) {
            try {
                const responseJson = await args.response.json();

                const localeMap = {
                    fa: 'fa-IR',
                    en: 'en-US',
                    ar: 'ar-EG'
                };
                const locale = localeMap[currentLanguage] || 'fa-IR';

                const report =
                    responseJson?.sources?.find(s => s?.options?.tableName === "db.report")?.data || [];
                const credit =
                    responseJson?.sources?.find(s => s?.options?.tableName === "db.credit")?.data || [];

                $bc.setSource("cms.report", Array.isArray(report) ? report : []);
                $bc.setSource("cms.credit", Array.isArray(credit) ? credit : []);

                const totalData =
                    responseJson?.sources?.find(s => s?.options?.tableName === "db.total")?.data || [];

                const row = totalData[0] || {};

                const received = Number(row.total_creditor ?? 0);
                const used = Number(row.total_debtor ?? 0);
                const remaining = Number(row.total_remaining ?? (received - used));

                const formattedReceived = new Intl.NumberFormat(locale).format(received);
                const formattedUsed = new Intl.NumberFormat(locale).format(used);
                const formattedRemaining = new Intl.NumberFormat(locale).format(remaining);

                const totalView = {
                    info: {
                        ...row,
                        total_received: formattedReceived,
                        total_used: formattedUsed,
                        remaining: formattedRemaining
                    }
                };


                $bc.setSource("cms.total", totalView);

            } catch (e) {
                console.error(e);
                $bc.setSource("cms.report", []);
                $bc.setSource("cms.credit", []);
                $bc.setSource("cms.total", { info: {} });
            }
        }

            const datePickerInput = document.querySelector(".date-picker-input");

        function padJalaliDate(dateString) {
            if (!dateString) return '';

            const parts = dateString.split('/');
            if (parts.length !== 3) return dateString;

            let [y, m, d] = parts;

            m = String(parseInt(m)).padStart(2, '0');
            d = String(parseInt(d)).padStart(2, '0');

            return `${y}/${m}/${d}`;
        }


        function replaceSlashWithDash(dateString) {
            if (!dateString) return '';
            return dateString.replace(/\//g, '-');
        }


        function jalaliToGregorian(dateString) {
            if (!dateString) return '';

            const parts = dateString.split('/');
            if (parts.length !== 3) return '';

            let jy = parseInt(parts[0]);
            let jm = parseInt(parts[1]);
            let jd = parseInt(parts[2]);

            jy += 1595;
            let days = -355668 + (365 * jy) +
                Math.floor(jy / 33) * 8 +
                Math.floor(((jy % 33) + 3) / 4) +
                jd +
                (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);

            let gy = 400 * Math.floor(days / 146097);
            days %= 146097;

            if (days > 36524) {
                gy += 100 * Math.floor(--days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }

            gy += 4 * Math.floor(days / 1461);
            days %= 1461;

            if (days > 365) {
                gy += Math.floor((days - 1) / 365);
                days = (days - 1) % 365;
            }

            let gd = days + 1;

            const months = [
                0, 31,
                (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0 ? 29 : 28,
                31, 30, 31, 30, 31, 31, 30, 31, 30, 31
            ];

            let gm;
            for (gm = 1; gm <= 12 && gd > months[gm]; gm++) {
                gd -= months[gm];
            }

            return `${gy}-${String(gm).padStart(2, '0')}-${String(gd).padStart(2, '0')}`;
        }


        async function callbackDocumentSearch() {

            function getEl(selector) {
                return document.querySelector(selector);
            }

            function getValue(selector) {
                const el = getEl(selector);
                return el ? el.value : '';
            }

            const fdateInput = getEl(".fdate-string");
            const tdateInput = getEl(".tdate-string");
            const datePicker = getEl(".date-picker-input");

            if (fdateInput && datePicker) {
                fdateInput.value = datePicker.getAttribute("data-datepicker-sstring") || "";
            }

            if (tdateInput && datePicker) {
                tdateInput.value = datePicker.getAttribute("data-datepicker-to-sstring") || "";
            }

            const paddedStart = padJalaliDate(fdateInput?.value);
            const paddedEnd = padJalaliDate(tdateInput?.value);

            const start_date = jalaliToGregorian(paddedStart);
            const end_date = jalaliToGregorian(paddedEnd);

            const main_json = {
                lid: 1,
                factorid: getValue("#accountingFactoridInput"),
                accnumber: getValue(".accnumber") || '',
                fromdate: start_date,
                todate: end_date,
            };

            console.log(main_json);

            $bc.setSource("cms.search", main_json);
        }

                    filter: false,

                    cellMaker: (row, data, td) => {
                        const value = Number(row.creditor ?? 0);

                        const locale = document.documentElement.lang === 'en' ? 'en-US' : 'fa-IR';

                        const formatted = new Intl.NumberFormat(locale).format(value);

                        return `<p class="is-separated panel-text-green-600 panel-ltr panel-font-medium">+ ${formatted}</p>`;
                    }
                },
                doctype: {
                    title: "عنوان سند",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) =>
                        `<p class="w-[120px]">${row.doctype ?? ''}</p>
                        <input type="hidden" class="doctypeid" name="doctypeid" value="${row.doctypeID ?? ''}" />`

                },
                description: {
                    title: "توضیحات",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {

                        const d = row?.description;
                        if (!d) return '';

                        let description = '';

                        if (d.desc) {
                            description += `<span>${d.desc}</span>`;
                        }
                        if (d.bankname) {
                            description += `<span> / ${d.bankname}</span>`;
                        }
                        if (d.refnumber) {
                            description += `<span> / ${d.refnumber}</span>`;
                        }

                        return description;

                    }


                },
                date: {
                    title: "تاریخ",
                    filter: false,
                    sort: false,

                },
                hour: {
                    title: "ساعت",
                    filter: false,
                    sort: false,

                },
                remaining: {
                    title: "مانده ازقبل",
                    filter: false,
                    sort: false,
                    cellMaker: (row, data, td) => {
                        const value = Number(row.remaining ?? 0);

                        const locale = document.documentElement.lang === 'en' ? 'en-US' : 'fa-IR';

                        const formatted = new Intl.NumberFormat(locale).format(value);

                        return `<p class="is-separated panel-ltr panel-w-24 panel-text-right panel-font-medium">${formatted}</p>`;
                    }

                }

            },
            filter: 'row',
            rowNumber: 'ردیف',
            defaultSort: false,
            direction: "rtl",
            paging: 20,
            information: true,
            firstAndLastBtn: true,
            culture: {
                labels: {
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },

            noData: (td) => {
                td.innerHTML = `<div class="noData">
                     <div class="icon panel-flex panel-justify-center panel-mb-3">
                    <svg width="70" height="70">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                    </svg>
                </div>
                <div class="text">
                ${translate('no_items_found')}
                 </div>
                </div>`
            },
            export: [
                {
                    type: "excel",
                    tooltip: "دانلود اکسل"
                }
            ],
            mode: "grid",
            pageCount: false
        };


    </script>

</body>

</html>
