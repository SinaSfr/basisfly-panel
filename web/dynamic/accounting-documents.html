    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.panel-tab[data-target]')
            const panels = document.querySelectorAll('[data-panel]')

            function setActiveTab(activeTab) {
                tabs.forEach((t) => t.classList.remove('panel-bg-white'))
                activeTab.classList.add('panel-bg-white')
            }

            function showPanel(name) {
                panels.forEach((p) => p.classList.add('panel-hidden'))
                const target = document.querySelector(`[data-panel="${name}"]`)
                target?.classList.remove('panel-hidden')
            }

            tabs.forEach((tab) => {
                tab.addEventListener('click', () => {
                    setActiveTab(tab)
                    showPanel(tab.dataset.target)
                })
            })

            if (tabs[0]) {
                setActiveTab(tabs[0])
                showPanel(tabs[0].dataset.target)
            }
        })
    </script>

        async function onProcessedReportDoc(args) {
            try {
                const responseJson = await args.response.json();

                const localeMap = {
                    fa: 'fa-IR',
                    en: 'en-US',
                    ar: 'ar-EG'
                };
                const locale = localeMap[currentLanguage] || 'fa-IR';

                const report =
                    responseJson?.sources?.find(s => s?.options?.tableName === "db.report")?.data || [];
                const credit =
                    responseJson?.sources?.find(s => s?.options?.tableName === "db.credit")?.data || [];

                $bc.setSource("db.report", Array.isArray(report) ? report : []);
                $bc.setSource("db.credit", Array.isArray(credit) ? credit : []);

                const totalData =
                    responseJson?.sources?.find(s => s?.options?.tableName === "db.total")?.data || [];

                const row = totalData[0] || {};

                const received = Number(row.total_creditor ?? 0);
                const used = Number(row.total_debtor ?? 0);
                const remaining = Number(row.total_remaining ?? (received - used));

                const formattedReceived = new Intl.NumberFormat(locale).format(received);
                const formattedUsed = new Intl.NumberFormat(locale).format(used);
                const formattedRemaining = new Intl.NumberFormat(locale).format(remaining);

                const totalView = {
                    info: {
                        ...row,
                        total_received: formattedReceived,
                        total_used: formattedUsed,
                        remaining: formattedRemaining
                    }
                };

                console.log(totalView);

                $bc.setSource("db.total", totalView);

            } catch (e) {
                console.error(e);
                $bc.setSource("db.report", []);
                $bc.setSource("db.credit", []);
                $bc.setSource("db.total", { info: {} });
            }
        }

    <script>
        async function onRenderedSetExcelClick(args) {
            setExcel('div[data-bc-export-container]', 'div[data-bc-export-item]', 'report');
            setExcel('div[data-bc-export-container-f]', 'div[data-bc-export-item]', 'credit');
        }

        async function setExcel(containerSelector = 'div[data-bc-export-container]', buttonSelector = 'div[data-bc-export-item]', excelType = 'default') {
            var container = document.querySelector(containerSelector);

            if (container) {
                var excel_btn = container.querySelector(buttonSelector);
                if (excel_btn) {
                    excel_btn.setAttribute('onClick', `downloadExcel("${excelType}")`);
                }
            }
        }
        async function onProcessed_excel(args) {
            try {
                const response = args.response;
                const responseJson = await response.json();
                console.log(responseJson)
                var link = document.createElement("a");
                document.body.appendChild(link);
                link.setAttribute("type", "hidden");
                link.href = "data:" + responseJson.mime + ";base64," + responseJson.payload;
                link.download = responseJson.name;
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                console.log(e);
            }
        }

        function getFilters(type) {
        if (type === "credit") {
            return {

                'description.bankname': 'نام بانک',
                'description.refnumber': 'رفرنس',
                'date': 'تاریخ',
                'hour': 'ساعت',
                'debtor': 'مبلغ بدهکاری',

            };
        } else if (type === "report") {
            return [

    }

    async function downloadExcel(type = 'default') {

        let name, excel_type, db;

        if (type === "credit") {
            name = 'report_credit_List';
            excel_type = 'accounting_credit';
            db = "db.excel";
        } else if (type === "report") {
            name = 'report_document_List';
            excel_type = 'accounting_document';
            db = "db.reportExcel";
        }

        const filters = getFilters(type);

        const main_json = {
            'multi_excel': name,
            'filters': filters,
            'excel_type': excel_type
        };

        $bc.setSource(db, [{
            "query": JSON.stringify(main_json),
            "run": true
        }]);

    }
