<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <basis core="call" file="book/taglist" lid="1"></basis>
    <title>باشگاه مشتریان</title>
    <meta name="description" content="باشگاه مشتریان">
    <link href="[##cms.cms.cdn##]/userPanel/css/user-panel.ui.min.css?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/css" rel="stylesheet" />
</head>

<body class="panel-bg-zinc-50">
    <!-- Header -->
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <!-- main -->
    <main>
        <div class="panel-flex panel-gap-2 panel-mx-auto max-xl:panel-w-[97%] xl:panel-max-w-7xl panel-mt-14">
            <basis core="call" file="userPanel/sidebar" lid="1" pageindexid="1"></basis>

            <basis core="api" name="club_members_user_point" run="atclient"
                url="https://basisfly.com/panel/main/multi-list/[##cms.cookie.rkey##]?question=list,total,agency"
                method="post" body='{
                    "name": "db",
                    "mid": "20",
                    "member": [
                        {
                        "name": "q",
                        "type": "list",
                        "request": "club_members_user_point_view",
                        "pageindex": "{##cms.paging.pageno|(1)##}",
                        "perpage": "0",
                        "rkey": "[##cms.cookie.rkey##]",
                        "lid":"[##cms.query.lid|(1)##]"
                        }
                    ]
                }' content-type="application/json" triggers="cms.search cms.paging"
                onProcessed="onProcessedClubMembers">
            </basis>

            <div class="panel-flex-1">
                <section class="panel-flex panel-items-center panel-gap-2">
                    <basis core="print" datamembername="cms.total" run="atclient">
                        <layout>
                            <script type="text/template">
                                <div
                                    class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border  panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                    <span
                                        class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl    panel-w-12 panel-h-12">
                                        <svg width="31" height="31">
                                            <use href="/userPanel/images/panel-sprite-icons.svg#icon-star"></use>
                                        </svg>
                                    </span>
                                    <div class="panel-flex panel-flex-col panel-justify-between">
                                        <span class="panel-text-xs panel-text-zinc-900">کل امتیاز باقی مانده</span>
                                        @child
                                    </div>
                                </div>
                            </script>
                        </layout>
                        <face>
                            <script type="text/template">
                                <span class="panel-text-green-700 panel-font-bold">@info.remaining@</span>
                            </script>
                        </face>
                    </basis>

                    <basis core="print" datamembername="cms.total" run="atclient">
                        <layout>
                            <script type="text/template">
                            <div
                                class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                <span
                                    class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                    <svg width="31" height="31">
                                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-ticket"></use>
                                    </svg>
                                </span>
                                <div class="panel-flex panel-flex-col panel-justify-between">
                                    <span class="panel-text-xs panel-text-zinc-900">کل امتیاز خرج کرده</span>
                                    @child
                                </div>
                            </div>
                        </script>
                        </layout>
                        <face>
                            <script type="text/template">
                                <span class="panel-text-red-500 panel-font-bold">@info.total_used@</span>
                            </script>
                        </face>
                    </basis>

                    <basis core="print" datamembername="cms.total" run="atclient">
                        <layout>
                            <script type="text/template">
                            <div
                                class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                <span
                                    class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                    <svg width="31" height="31">
                                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-all-point"></use>
                                    </svg>
                                </span>
                                <div class="panel-flex panel-flex-col panel-justify-between">
                                    <span class="panel-text-xs panel-text-zinc-900">کل امتیاز کسب کرده</span>
                                    @child
                                </div>
                            </div>
                        </script>
                        </layout>
                        <face>
                            <script type="text/template">
                                <span class="panel-text-zinc-900 panel-font-bold">@info.total_received@</span>
                            </script>
                        </face>
                    </basis>

                </section>
                <section class="panel-bg-white panel-rounded-2xl panel-px-3 panel-py-6 panel-mt-6">
                    <div class="panel-flex panel-items-center">
                        <svg width="48" height="48" class="panel-text-primary-800">
                            <use href="/userPanel/images/panel-sprite-icons.svg#icon-customer-club"></use>
                        </svg>
                        <h2 class="panel-text-zinc-900 panel-font-medium">لیست امتیاز ها</h2>
                    </div>
                    <div class="panel_grid_style">
                        <basis core="component.grid.grid" run="atclient" dataMemberName="cms.list"
                            options="CustomerClubList">
                        </basis>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>

    <script>
        async function onProcessedClubMembers(args) {
            try {
                const responseJson = await args.response.json()

                const list = responseJson?.sources?.find(s => s?.options?.tableName === "db.list")?.data
                const total = responseJson?.sources?.find(s => s?.options?.tableName === "db.total")?.data

                $bc.setSource("cms.list", Array.isArray(list) ? list : [])

                const t = total && typeof total === "object" ? total : {}
                const received = Number(t.total_received ?? 0) || 0
                const used = Number(t.total_used ?? 0) || 0

                const totalView = {
                    info: {
                        ...t,
                        remaining: received - used,
                    }
                }

                $bc.setSource("cms.total", totalView)
            } catch {
                $bc.setSource("cms.list", [])
                $bc.setSource("cms.total", { info: {} })
            }
        }

        var CustomerClubList = {
            columns: {
                description: {
                    title: "عنوان",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => `<p>${row.description ?? ""}</p>`,
                },

                points: {
                    title: "امتیاز",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const received = Number(row.received_points ?? 0) || 0
                        const used = Number(row.used_points ?? 0) || 0
                        const net = received - used
                        const sign = net > 0 ? "+" : net < 0 ? "-" : ""
                        const absVal = Math.abs(net)
                        const netText = `${sign} ${Intl.NumberFormat().format(absVal)}`

                        const cls =
                            net > 0
                                ? "!panel-text-green-600"
                                : net < 0
                                    ? "!panel-text-red-500"
                                    : "panel-text-zinc-900"

                        return `<p class="is-separated panel-direction-ltr ${cls}">${netText}</p>`
                    },
                },

                date: {
                    title: "تاریخ",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const g = row?.create_date?.mstring ?? ""
                        const j = row?.create_date?.sstring ?? ""
                        if (!g && !j) return `<p>-</p>`

                        return `
          <div class="panel-flex panel-flex-col panel-gap-0.5">
            ${j ? `<span>${j}</span>` : ""}
            ${g ? `<span class="panel-direction-ltr">${g}</span>` : ""}
          </div>
        `
                    },
                },

                hour: {
                    title: "ساعت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-direction-ltr">${row.create_hour ?? ""}</p>`,
                },

                received_points: {
                    title: "کسب کرده",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const val = Number(row.received_points ?? 0) || 0
                        return `<p class="is-separated panel-direction-ltr !panel-text-green-600">+ ${Intl.NumberFormat().format(val)}</p>`
                    },
                },

                used_points: {
                    title: "خرج کرده",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const val = Number(row.used_points ?? 0) || 0
                        return `<p class="is-separated panel-direction-ltr !panel-text-red-500">- ${Intl.NumberFormat().format(val)}</p>`
                    },
                },
            },

            // ===== این بخش باید ثابت و دست‌نخورده بماند =====
            filter: 'row',
            rowNumber: 'ردیف',
            defaultSort: false,
            direction: "rtl",
            paging: 50,
            information: true,
            firstAndLastBtn: true,
            culture: {
                labels: {
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },

            noData: (td) => {
                td.innerHTML = `<div class="noData">
                 <div class="icon panel-flex panel-justify-center panel-mb-3">
                    <svg width="70" height="70">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                    </svg>
                </div>
    <div class="text">
        ${translate('no_items_found')} </div></div>`
            },
            mode: "grid",
            pageCount: false
        };

    </script>
</body>

</html>
