<basis core="api" name="charging_view" run="atclient" url="https://basisfly.com/panel/main/[##cms.cookie.rkey##]"
    method="post" body='{
        "name": "db",
        "mid": "20",
        "member":[{
        "name": "q",
        "type":"list",
        "request": "charging_view",
        "supplierdmnid": "[##cms.cms.domainid##]",
        "reciverownerid":"{##db.ownerid.reciverownerid##}",
        "perpage":"30",
        "pageindex":"1"
        }]} ' content-type="application/json" onProcessed="onProcessedAllowChargingView" triggers="db.ownerid"
    if="{##db.ownerid.run|(false)##}">
</basis>


<basis core="api" name="allow_online_charging" run="atclient"
    url="https://basisfly.com/panel/main/[##cms.cookie.rkey##]" method="post" body='{ 
        "name": "db",
        "mid": "20",
        "member":[{ 
        "name": "q", 
        "type":"list",
        "request": "allow_online_charging"
        }]} ' content-type="application/json" onProcessed="onProcessedAllowOnlineCharging">
</basis>

<basis core="api" name="webservice_type_list" run="atclient" url="https://basisfly.com/panel/main/[##cms.cookie.rkey##]"
    method="post" body='
    { 
        "name": "db",
        "mid": "20",
        "member":
        [
            { 
                "name": "q", 
                "type":"list",
                "request": "webservice_type_list",
                "type": "5",
                "lid": "1"
            }
        ] 
    } ' content-type="application/json">
</basis>



<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <basis core="call" file="book/taglist" lid="1"></basis>
    <title>شارژ آنلاین</title>
    <meta name="description" content="شارژ آنلاین">
    <link href="[##cms.cms.cdn##]/userPanel/css/user-panel.ui.min.css?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/css" rel="stylesheet" />
</head>

<body class="panel-bg-zinc-50">
    <!-- Header -->
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <!-- main -->
    <main>
        <div class="panel-flex panel-gap-2 panel-mx-auto max-xl:panel-w-[97%] xl:panel-max-w-7xl panel-mt-14">
            <basis core="call" file="userPanel/sidebar" lid="1" pageindexid="1"></basis>

            <div class="panel-flex-1">
                <div class="panel-relative panel-flex panel-justify-between panel-bg-white panel-rounded-2xl panel-p-6">
                    <img src="/userPanel/images/pattern.png" class="panel-absolute panel-right-0 panel-top-0"
                        alt="pattern" width="597" height="180" loading="lazy">
                    <section class="panel-relative panel-z-10">
                        <div class="panel-flex panel-items-center panel-gap-3">
                            <span
                                class="panel-flex panel-items-center panel-justify-center panel-w-12 panel-h-12 panel-bg-zinc-100 panel-rounded-lg">
                                <svg width="32" height="32" class="panel-text-zinc-900">
                                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-online-charge"></use>
                                </svg>
                            </span>
                            <div class="panel-flex panel-flex-col panel-justify-between panel-h-full">
                                <h2 class="panel-text-xs panel-text-zinc-900">اعتبار</h2>
                                <p class="panel-text-zinc-900 panel-font-medium">
                                    موجودی حساب
                                </p>
                            </div>
                        </div>
                        <div class="panel-flex panel-items-center panel-gap-4 panel-mt-7">
                            <div class="panel-flex panel-items-center panel-gap-1">
                                <span class="panel-wallet-amount panel-text-4xl panel-font-bold panel-text-zinc-900"
                                    data-amount="422,340,000">422,340,000</span>
                                <span class="panel-font-medium panel-text-zinc-900">تومان</span>
                            </div>

                            <button type="button" class="panel-flex panel-items-center panel-justify-center panel-w-12 panel-h-12 panel-bg-zinc-100 panel-rounded-lg
                                     panel-transition-all panel-duration-200 hover:panel-bg-zinc-200"
                                aria-label="نمایش/مخفی کردن موجودی" aria-pressed="false" data-toggle-amount="">
                                <svg width="24" height="24" class="panel-text-zinc-900">
                                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-eye"></use>
                                </svg>
                            </button>
                        </div>
                        <basis core="print" datamembername="db.credit" run="atclient">
                            <layout>
                                <script type="text/template">
                                <div
                                    class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                    <span
                                        class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                        <svg width="31" height="31">
                                            <use href="/userPanel/images/panel-sprite-icons.svg#icon-star"></use>
                                        </svg>
                                    </span>
                                    <div class="panel-flex panel-flex-col panel-justify-between">
                                        <span class="panel-text-xs panel-text-zinc-900">بدهکاری (ریال)</span>
                                        @child
                                    </div>
                                </div>
                            </script>
                            </layout>
                            <face>
                                <script type="text/template">
                                    <span class="panel-text-red-500 panel-font-bold">@debtor@</span>
                                </script>
                            </face>
                        </basis>

                        <basis core="print" datamembername="db.credit" run="atclient">
                            <layout>
                                <script type="text/template">
                                <div
                                    class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                    <span
                                        class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                        <svg width="31" height="31">
                                            <use href="/userPanel/images/panel-sprite-icons.svg#icon-ticket"></use>
                                        </svg>
                                    </span>
                                    <div class="panel-flex panel-flex-col panel-justify-between">
                                        <span class="panel-text-xs panel-text-zinc-900">بستنکار ( ریال )</span>
                                        @child
                                    </div>
                                </div>
                            </script>
                            </layout>
                            <face>
                                <script type="text/template">
                                    <span class="panel-text-green-600 panel-font-bold">@creditor@</span>
                                </script>
                            </face>
                        </basis>

                        <basis core="print" datamembername="db.credit" run="atclient">
                            <layout>
                                <script type="text/template">
                                <div
                                    class="panel-flex-1 panel-flex panel-items-stretch panel-gap-2 panel-bg-white panel-border panel-border-solid panel-border-zinc-200 panel-rounded-xl panel-p-3">
                                    <span
                                        class="panel-flex panel-items-center panel-justify-center panel-bg-zinc-100 panel-rounded-xl panel-w-12 panel-h-12">
                                        <svg width="31" height="31">
                                            <use href="/userPanel/images/panel-sprite-icons.svg#icon-all-point">
                                            </use>
                                        </svg>
                                    </span>
                                    <div class="panel-flex panel-flex-col panel-justify-between">
                                        <span class="panel-text-xs panel-text-zinc-900">مانده (ریال)</span>
                                        @child
                                    </div>
                                </div>
                            </script>
                            </layout>
                            <face>
                                <script type="text/template">
                                    <span class="panel-text-zinc-900 panel-font-bold">@Remaining_credit@</span>
                                </script>
                            </face>
                        </basis>
                    </section>

                </div>
                <section
                    class="panel-bg-white panel-border panel-border-zinc-200 panel-border-solid panel-rounded-2xl panel-p-3 panel-mt-2">
                    <h1 class="panel-font-bold panel-text-zinc-900 panel-mb-3">شارژ آنلاین</h1>
                    <p class="panel-text-xs panel-text-zinc-900">جهت افزایش موجودی مبلغ را وارد کنید</p>
                    <div class="panel-flex panel-gap-3 panel-mt-6">
                        <div class="panel-w-full">
                            <div class="panel-relative">
                                <input type="text" name="" id="" placeholder="500000" class="panel-w-full panel-h-14 panel-border panel-border-solid panel-border-zinc-200 panel-bg-zinc-100 panel-rounded-xl panel-pr-4 panel-pl-11 placeholder-zinc-400 panel-outline-none  focus:panel-border-primary-800 focus:panel-bg-white
                                    focus:panel-shadow-md
                                    panel-transition panel-duration-300">
                                <span
                                    class="panel-absolute panel-left-4 panel-text-zinc-400 panel-top-1/2 -panel-translate-y-1/2">ریال</span>

                            </div>
                        </div>
                        <button
                            class="panel-relative panel-group panel-overflow-hidden panel-flex panel-items-center panel-justify-center panel-w-40 panel-h-14 panel-z-10 panel-bg-primary-800 panel-text-white panel-rounded-xl panel-text-sm panel-font-medium panel-border panel-border-solid panel-border-primary-800 panel-transition-all panel-duration-300 hover:panel-text-primary-800">
                            <div class="panel-relative panel-z-10 panel-flex panel-items-center panel-justify-center">
                                <span>پرداخت</span>
                            </div>
                            <span
                                class="panel-absolute panel-w-full panel-inset-0 panel-transition-transform panel-duration-300 panel-h-14 panel-origin-right panel-scale-x-0 panel-bg-white group-hover:panel-scale-x-100"></span>
                        </button>
                    </div>
                </section>
                <section class="panel-bg-white panel-rounded-2xl panel-p-3 panel-mt-2">
                    <h2 class="panel-font-medium panel-mb-3">لیست پرداخت شارژ آنلاین</h2>
                    <div class="panel_grid_style">
                        <basis core="component.grid.grid" run="atclient" dataMemberName="db.list"
                            options="OnlineChargingList">
                        </basis>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <div class="panel-increase-balance__popup panel-fixed panel-inset-0 panel-z-50 panel-flex panel-items-center panel-justify-center panel-bg-black/50 panel-backdrop-blur-sm panel-hidden"
        aria-hidden="true">
        <div
            class="panel-increase-balance-popup__content panel-bg-white panel-rounded-xl panel-p-4 panel-max-w-3xl panel-w-full panel-mx-auto">
            <div class="panel-flex panel-items-center panel-justify-between">
                <h2 class="panel-font-bold panel-text-zinc-900">شارژ آنلاین</h2>

                <button
                    class="panel-w-12 bopanelok-h-12 panel-rounded-full panel-flex panel-items-center panel-justify-center panel-text-zinc-600 hover:panel-bg-zinc-100 panel-transition-all panel-duration-300"
                    aria-label="Close">
                    <svg width="48" height="48" class="panel-increase-balance__close-btn" role="button" tabindex="0">
                        <use href="/userPanel/images/panel-sprite-icons.svg#icon-close"></use>
                    </svg>
                </button>

            </div>

            <div class="panel-mt-5">

                <div class="panel-mt-3 panel-increase-balance__gateways">
                    <h3 class="panel-font-medium panel-text-zinc-900">لیست درگاه های
                        پرداخت</h3>
                </div>
            </div>

            <button
                class="panel-increase-balance__pay-btn panel-relative panel-group panel-overflow-hidden panel-flex panel-items-center panel-justify-center panel-w-40 panel-h-14 panel-z-10 panel-bg-primary-800 panel-text-white panel-rounded-xl panel-text-sm panel-font-medium panel-border panel-border-solid panel-border-primary-800 panel-mt-5 panel-mx-auto panel-transition-all panel-duration-300 hover:panel-text-primary-800">
                <div class="panel-relative panel-z-10 panel-flex panel-items-center panel-justify-center">
                    <span>پرداخت</span>
                </div>
                <span
                    class="panel-absolute panel-w-full panel-inset-0 panel-transition-transform panel-duration-300 panel-h-14 panel-origin-right panel-scale-x-0 panel-bg-white group-hover:panel-scale-x-100"></span>
            </button>
        </div>
    </div>

    <!-- Footer-->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script src="[##cms.cms.cdn##]/userPanel/js/user-panel.js?ver=[##cms.cms.date2##][##cms.cms.time2##]"
        type="text/javascript"></script>

    <script>
        async function onProcessedAllowOnlineCharging(args) {
            try {
                const responseJson = await args.response.json();

                const ownerid = responseJson?.result?.ownerid;
                const credit = responseJson?.credit ?? {};

                const formatNumber = (val) => {
                    const num = Number(val ?? 0) || 0;
                    return Intl.NumberFormat().format(num);
                };

                $bc.setSource("db.ownerid", [{
                    reciverownerid: ownerid,
                    run: true,
                }]);

                $bc.setSource("db.credit", {
                    total_credit: formatNumber(credit.total_credit),
                    debtor: formatNumber(credit.debtor),
                    creditor: formatNumber(credit.creditor),
                    Remaining_credit: formatNumber(credit.Remaining_credit),
                });

            } catch (e) {
                console.log(e);

                $bc.setSource("db.ownerid", []);
                $bc.setSource("db.credit", {});
            }
        }

        async function onProcessedAllowChargingView(args) {
            try {
                const responseJson = await args.response.json();

                const rawList = Array.isArray(responseJson) ? responseJson : [];


                const list = rawList
                    .filter(item => item?.charging)
                    .map(item => item.charging);


                $bc.setSource("db.list", list);

            } catch (e) {
                console.log(e);
                $bc.setSource("db.list", []);
            }
        }

        var OnlineChargingList = {
            columns: {

                docID: {
                    title: "شماره سند",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.docID ?? "-"}</p>`,
                },

                accountname: {
                    title: "نام پرداخت کننده",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p>${row?.accountname ?? "-"}</p>`,
                },

                price: {
                    title: "مبلغ پرداختی (ریال)",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const val = Number(row?.price ?? 0);
                        if (!val) return `<p class="panel-ltr">-</p>`;

                        return `<p class="is-separated panel-ltr">
                    ${Intl.NumberFormat().format(val)}
                </p>`;
                    },
                },

                date: {
                    title: "تاریخ",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const j = row?.date?.sstring;
                        const g = row?.date?.mstring;

                        if (!j && !g)
                            return `<p>-</p>`;

                        return `
                    <div class="panel-flex panel-flex-col panel-gap-0.5">
                        ${j ? `<span>${j}</span>` : ""}
                        ${g ? `<span class="panel-ltr">${g}</span>` : ""}
                    </div>
                `;
                    },
                },

                hour: {
                    title: "ساعت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.date?.hour || "-"}</p>`,
                },

                bankname: {
                    title: "نام بانک",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p>${row?.bankname || "-"}</p>`,
                },

                cardno: {
                    title: "شماره کارت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.cardno || "-"}</p>`,
                },

                refnumber: {
                    title: "شماره پیگیری",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.refnumber || "-"}</p>`,
                },
            },

            filter: 'row',
            rowNumber: "ردیف",
            defaultSort: false,
            direction: "rtl",
            paging: 50,
            information: true,
            firstAndLastBtn: true,

            culture: {
                labels: {
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },

            noData: (td) => {
                td.innerHTML = `<div class="noData">
            <div class="icon panel-flex panel-justify-center panel-mb-3">
                <svg width="70" height="70">
                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                </svg>
            </div>
            <div class="text">
                ${translate('no_items_found')}
            </div>
        </div>`;
            },

            mode: "grid",
            pageCount: false
        };

    </script>
</body>

</html>
