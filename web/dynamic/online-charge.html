    <script>
        function buttonLoading(btn, state = true) {
            if (!btn) return;

            if (state) {
                // جلوگیری از تکرار
                if (btn.classList.contains("is-loading")) return;

                btn.classList.add("is-loading");

                // ذخیره وضعیت قبلی
                if (btn.dataset.wasDisabled == null) {
                    btn.dataset.wasDisabled = btn.disabled ? "1" : "0";
                }

                // ذخیره محتوا (فقط یک بار)
                if (btn.dataset.oldText == null) {
                    btn.dataset.oldText = btn.innerHTML;
                }

                btn.disabled = true;
                btn.setAttribute("aria-busy", "true");

                // جایگزینی کامل با لودینگ
                btn.innerHTML = '<div class="panel-loading__btn"></div>';
            } else {
                btn.classList.remove("is-loading");
                btn.removeAttribute("aria-busy");

                // برگرداندن محتوا
                if (btn.dataset.oldText != null) {
                    btn.innerHTML = btn.dataset.oldText;
                }

                // برگرداندن disabled به حالت قبل
                btn.disabled = btn.dataset.wasDisabled === "1";

                // پاکسازی
                delete btn.dataset.oldText;
                delete btn.dataset.wasDisabled;
            }
        }
        function ensureMessages(hostEl) {
            if (!hostEl) return null;
            if (hostEl.__messagesReady) return hostEl;

            const tpl = document.getElementById("panel-message__template");
            if (!tpl) return null;

            hostEl.appendChild(tpl.content.cloneNode(true));
            hostEl.__messagesReady = true;
            return hostEl;
        }

        function resolveHost(fromElOrHost) {
            if (!fromElOrHost) return document.querySelector(".panel-message__host");

            if (fromElOrHost instanceof Element) {
                if (fromElOrHost.classList.contains("panel-message__host")) return fromElOrHost;
                return fromElOrHost.closest(".panel-message__host") || document.querySelector(".panel-message__host");
            }

            return document.querySelector(".panel-message__host");
        }

        function showSuccessMessage(fromElOrHost, text = "تکمیل شد") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__success-text");

            failedWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            successWrap?.classList.remove("panel-hidden");
        }

        function showFailedMessage(fromElOrHost, text = "به‌روزرسانی ناموفق بود") {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            const successWrap = host.querySelector(".panel-successed__message__content");
            const failedWrap = host.querySelector(".panel-failed__message__content");
            const span = host.querySelector(".panel-message__failed-text");

            successWrap?.classList.add("panel-hidden");
            if (span && text != null) span.textContent = String(text);
            failedWrap?.classList.remove("panel-hidden");
        }

        function hideMessages(fromElOrHost) {
            const host = ensureMessages(resolveHost(fromElOrHost));
            if (!host) return;

            host.querySelector(".panel-successed__message__content")?.classList.add("panel-hidden");
            host.querySelector(".panel-failed__message__content")?.classList.add("panel-hidden");
        }
    </script>
    <script>
        window.pricePayment = 0;

        (function () {
            "use strict";

            function getPopup() {
                return document.querySelector(".panel-online-charging__popup");
            }

            function getPriceInput() {
                return document.getElementById("onlineChargingPriceInput");
            }

            function openPopup() {
                const popup = getPopup();
                if (!popup) return;

                const input = getPriceInput();
                if (input) {
                    clearInvalid(input);
                    hideMessages(input);
                    // اگر می‌خوای هر بار باز میشه ورودی خالی بشه:
                    // input.value = "";
                }

                popup.classList.remove("panel-hidden");
                popup.setAttribute("aria-hidden", "false");
                document.documentElement.style.overflow = "hidden";
            }

            function closePopup() {
                const popup = getPopup();
                if (!popup) return;

                popup.classList.add("panel-hidden");
                popup.setAttribute("aria-hidden", "true");
                document.documentElement.style.overflow = "";

                const input = getPriceInput();
                if (input) {
                    clearInvalid(input);
                    hideMessages(input);
                    // اگر می‌خوای هنگام بستن هم خالی شه:
                    // input.value = "";
                }

                window.pricePayment = 0;
            }

            function normalizeDigitsToLatin(str) {
                const map = {
                    "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
                    "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
                    "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
                    "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9"
                };
                return String(str || "").replace(/[۰-۹٠-٩]/g, (d) => map[d] || d);
            }

            function normalizeNumber(val) {
                return normalizeDigitsToLatin(val).replace(/[^\d]/g, "");
            }

            function validateAmount5Digits(inputEl) {
                const cleaned = normalizeNumber(inputEl?.value);
                if (inputEl && inputEl.value !== cleaned) inputEl.value = cleaned;

                if (!cleaned) return { ok: false, cleaned: "", reason: "empty" };
                if (cleaned.length < 5) return { ok: false, cleaned, reason: "min5" };

                return { ok: true, cleaned, reason: "" };
            }

            function markInvalid(input, msg) {
                if (!input) return;
                input.classList.add("panel-border-red-500");
                input.setAttribute("aria-invalid", "true");
                input.focus();

                // ✅ نمایش پیام خطا با سیستم پیام شما
                if (msg) showFailedMessage(input, msg);
            }

            function clearInvalid(input) {
                if (!input) return;
                input.classList.remove("panel-border-red-500");
                input.removeAttribute("aria-invalid");
            }

            document.addEventListener("click", (e) => {
                const actionEl = e.target.closest("[data-action]");
                if (!actionEl) return;

                const action = actionEl.getAttribute("data-action");

                if (action === "onlineChargingOpen") {
                    e.preventDefault();

                    const input = getPriceInput();
                    const v = validateAmount5Digits(input);

                    if (!v.ok) {
                        window.pricePayment = 0;

                        if (v.reason === "empty") {
                            markInvalid(input, translate("enter_amount"));
                            return;
                        }

                        if (v.reason === "min5") {
                            markInvalid(input, translate("amount_min_5_digits"));
                            return;
                        }

                        markInvalid(input, translate("enter_amount"));
                        return;
                    }

                    clearInvalid(input);
                    hideMessages(input); // ✅ پیام‌ها پاک

                    window.pricePayment = Number(v.cleaned);

                    $bc.setSource("cms.setTrueWebservice", [{ run: true }]);
                    $bc.setSource("cms.price", [{ priceValue: v.cleaned }]);

                    openPopup();
                    return;
                }

                if (action === "onlineChargingClose") {
                    e.preventDefault();
                    closePopup();
                }
            });

            document.addEventListener("input", (e) => {
                const input = e.target;
                if (!(input instanceof HTMLInputElement)) return;
                if (input.id !== "onlineChargingPriceInput") return;

                const cleaned = normalizeNumber(input.value);
                if (input.value !== cleaned) input.value = cleaned;

                if (input.classList.contains("panel-border-red-500")) {
                    clearInvalid(input);
                }

                hideMessages(input); // ✅ با هر تغییر، پیام خطا مخفی
            });

            document.addEventListener("click", (e) => {
                const popup = getPopup();
                if (!popup || popup.classList.contains("panel-hidden")) return;

                if (e.target === popup) closePopup();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;

                const popup = getPopup();
                if (!popup || popup.classList.contains("panel-hidden")) return;

                closePopup();
            });
        })();
    </script>
    <script>
        function makeGrid(columns) {
            return { columns, ...GRID_BASE_OPTIONS };
        }

        const GRID_BASE_OPTIONS = {
            sorting: false,
            filter: false,
            rowNumber: false,
            defaultSort: false,
            direction: "rtl",
            paging: "",
            information: false,
            firstAndLastBtn: false,
        };

        const formatNumber = (val) => {
            const num = Number(val ?? 0) || 0;
            return Intl.NumberFormat().format(num);
        };
        function toText(value, fallback = "-") {
            if (value == null) return fallback;
            const s = String(value).trim();
            return s === "" ? fallback : s;
        }

        window.currencyTitle = "";
        window.currencyId = "";

        async function onProcessedGetCurrency(args) {
            try {
                const responseJson = await args.response.json();

                let row = null;

                if (responseJson && typeof responseJson === "object" && ("id" in responseJson || "title" in responseJson)) {
                    row = responseJson;
                }

                window.currencyTitle = (row?.title ?? "").toString();
                window.currencyId = (row?.id ?? "").toString();

            } catch (e) {
                console.error(e);
                window.currencyTitle = "";
                window.currencyId = "";
            }
        }
        async function onProcessedAllowOnlineCharging(args) {
            try {
                const responseJson = await args.response.json();

                const ownerid = responseJson?.result?.ownerid;
                const credit = responseJson?.credit ?? {};



                $bc.setSource("cms.ownerid", [{
                    reciverownerid: ownerid,
                    run: true,
                }]);

                $bc.setSource("cms.credit", {
                    total_credit: formatNumber(credit.total_credit),
                    debtor: formatNumber(credit.debtor),
                    creditor: formatNumber(credit.creditor),
                    Remaining_credit: formatNumber(credit.Remaining_credit),
                });

            } catch (e) {
                console.log(e);

                $bc.setSource("cms.ownerid", []);
                $bc.setSource("cms.credit", {});
            }
        }

        function setBcSourceSafe(key, value) {
            if (!window.$bc || typeof $bc.setSource !== "function") {
                console.warn("$bc.setSource is not available");
                return;
            }
            $bc.setSource(key, value);
        }

        function handlePayment(btn, id) {
            btn.dataset.loading = "true";
            buttonLoading(btn, true);
            setBcSourceSafe("cms.final-payment", id);
        }

        const generateSixDigitNumber = () => {
            try {
                const sixDigitNumber = Math.floor(100000 + Math.random() * 900000);



                return sixDigitNumber;
            } catch (err) {
                console.error("Error generating six-digit number: " + err.message);
            }
        };
        let sixDigitNumber = generateSixDigitNumber();
        window.bankId = 0; window.bankProviderId = 0;


        function webserviceDetailCallback(args) {
            const resultJson = args?.source?.rows || [];
            const unit = resultJson[0]?.unit || ""
            const paymentDiv = document.querySelector('div[data-payment-type]');
            const invoicetypeElement = document.querySelector('.panel-invoice__value');
            const id = invoicetypeElement.getAttribute('data-factorid') || 0;
            window.bankId = resultJson[0].bankid;
            window.bankProviderId = resultJson[0].provider;
            if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'invoice') {
                $bc.setSource("cms.token", {
                    randomId: sixDigitNumber,
                    provider: window.bankProviderId,
                    bankid: window.bankId,
                    doc_type: 6,
                    factorid: id,
                    email: userEmail,
                    mobile: userMobile,
                    title: 'پرداخت مرحله دوم',
                });
            } else if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'onlineCharging') {
                $bc.setSource("cms.unit", {
                    value: unit,
                    run: true,
                });
                console.log("token", window.currencyTitle);
            } else {

            }


        }

        async function onProcessedACurrencyConversion(args) {
            try {
                const responseJson = await args.response.json();
                const convertedPrice = Number(responseJson?.price ?? 0);
                const invoicetypeElement = document.querySelector('.panel-invoice__value');
                const id = invoicetypeElement.getAttribute('data-factorid') || 0;

                $bc.setSource("cms.token", {
                    randomId: sixDigitNumber,
                    provider: window.bankProviderId,
                    bankid: window.bankId,
                    doc_type: 7,
                    amount: convertedPrice,
                    currency: window.currencyTitle,
                    factorid: id,
                    email: userEmail,
                    mobile: userMobile,
                    title: "شارژ آنلاین",
                });

            } catch (e) {
                console.error("onProcessedACurrencyConversion error:", e);
            }
        }

        async function onProcessedAllowChargingView(args) {
            try {
                const responseJson = await args.response.json();

                const rawList = Array.isArray(responseJson) ? responseJson : [];


                const list = rawList
                    .filter(item => item?.charging)
                    .map(item => item.charging);


                $bc.setSource("cms.list", list);

            } catch (e) {
                console.log(e);
                $bc.setSource("cms.list", []);
            }
        }

        if (typeof WebserviceListGrid === "undefined") {
            /**
             * Grid: Buyer -> Person (includes userid column).
             */
            var WebserviceListGrid = makeGrid({
                logo: {
                    title: "درگاه",
                    cellMaker: (row) => {
                        return `<img src="/${row?.logo}" class="panel-mx-auto" width="40" height="40" alt="${row?.name}"/>`
                    }
                },
                total: {
                    title: "مبلغ قابل پرداخت",
                    cellMaker: (row) => `<span class="panel-font-bold">${formatNumber(window.pricePayment)}</span>`,
                },
                moneytype: {
                    title: "واحد",
                    cellMaker: (row) => toText(row?.moneytype),
                },
                link: {
                    title: "پرداخت",
                    cellMaker: (row) => `<button onclick="handlePayment(this, ${row?.id})" class="panel-handlePayment__btn panel-w-40 panel-h-12 panel-font-medium panel-text-sm panel-rounded-xl panel-bg-primary-800 panel-text-white panel-mr-auto panel-transition-all panel-duration-300 hover:panel-shadow-xl hover:panel-scale-90">پرداخت </button>`
                },

            });
        }

        function tokenCallback(args) {
            try {
                const paymentDiv = document.querySelector('div[data-payment-type]');
                const invoicetypeElement = document.querySelector('.panel-invoice__value');
                const id = invoicetypeElement?.getAttribute('data-factorid') || 0;

                const source = args.source?.rows;
                if (source && source[0].url_gateway) {
                    // ارسال داده‌ها به cms.save-inputs اگر payment-type برابر با 'invoice' باشد
                    if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'invoice') {
                        $bc.setSource("cms.save-inputs", {
                            randomId: sixDigitNumber,
                            provider: window.bankProviderId,
                            bankid: window.bankId,
                            factorid: id,
                            session: source[0].session,
                            orderid: source[0].orderid,
                            doc_type: 6,
                        });
                    } else if (paymentDiv && paymentDiv.getAttribute('data-payment-type') === 'onlineCharging') {
                        $bc.setSource("cms.save-inputs", {
                            randomId: sixDigitNumber,
                            provider: window.bankProviderId,
                            bankid: window.bankId,
                            factorid: id,
                            session: source[0].session,
                            orderid: source[0].orderid,
                            doc_type: 7,
                        });

                        $bc.setSource("cms.paymentid", {
                            orderid: source[0].orderid,
                        });
                    }

                    // بررسی متد درخواست و ارسال فرم یا انتقال به درگاه
                    if (source[0].method === 'POST') {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = source[0].form;
                        const form = tempDiv.querySelector('form');
                        if (form) {
                            document.body.appendChild(form);  // فرم را به body اضافه می‌کنیم
                            form.submit();
                        }
                    } else {
                        window.location = source[0].url_gateway;
                    }



                } else {
                    const paymentBtn = document.querySelector('.panel-handlePayment__btn[data-loading="true"]');

                    if (paymentBtn) {
                        buttonLoading(paymentBtn, false);
                        delete paymentBtn.dataset.loading; // یا paymentBtn.dataset.loading = "false"
                    }

                    const msg = "امکان اتصال به درگاه پرداخت الکترونیک وجود ندارد.";

                    const container = document.querySelector(".panel-online-charging__content");
                    const host = container?.querySelector(".panel-message__host");

                    // اگر سیستم پیام‌ها هست و host درست پیدا شد
                    if (host && typeof showFailedMessage === "function" && typeof hideMessages === "function") {
                        hideMessages(host);
                        showFailedMessage(host, msg);
                        return;
                    }

                    // fallback: UI بزرگ (اگر پیام‌ها نبود یا host نبود)
                    if (container && !document.getElementById("payment-gateway-error")) {
                        container.insertAdjacentHTML("beforeend", errorHtml);
                    }
                }
            } catch (err) {
                console.error('tokenCallback=' + err.lineNumber + ',' + err.message);
            }
        }

        var OnlineChargingList = {
            columns: {

                docID: {
                    title: "شماره سند",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.docID ?? "-"}</p>`,
                },

                accountname: {
                    title: "نام پرداخت کننده",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p>${row?.accountname ?? "-"}</p>`,
                },

                price: {
                    title: "مبلغ پرداختی (ریال)",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const val = Number(row?.price ?? 0);
                        if (!val) return `<p class="panel-ltr">-</p>`;

                        return `<p class="is-separated panel-ltr">
                    ${Intl.NumberFormat().format(val)}
                </p>`;
                    },
                },

                date: {
                    title: "تاریخ",
                    filter: false,
                    sort: false,
                    cellMaker: (row) => {
                        const j = row?.date?.sstring;
                        const g = row?.date?.mstring;

                        if (!j && !g)
                            return `<p>-</p>`;

                        return `
                    <div class="panel-flex panel-flex-col panel-gap-0.5">
                        ${j ? `<span>${j}</span>` : ""}
                        ${g ? `<span class="panel-ltr">${g}</span>` : ""}
                    </div>
                `;
                    },
                },

                hour: {
                    title: "ساعت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.date?.hour || "-"}</p>`,
                },

                bankname: {
                    title: "نام بانک",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p>${row?.bankname || "-"}</p>`,
                },

                cardno: {
                    title: "شماره کارت",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.cardno || "-"}</p>`,
                },

                refnumber: {
                    title: "شماره پیگیری",
                    filter: false,
                    sort: false,
                    cellMaker: (row) =>
                        `<p class="panel-ltr">${row?.refnumber || "-"}</p>`,
                },
            },

            filter: 'row',
            rowNumber: "ردیف",
            defaultSort: false,
            direction: "rtl",
            paging: 50,
            information: true,
            firstAndLastBtn: true,

            culture: {
                labels: {
                    "next": "بعدی",
                    "previous": "قبلی",
                    "first": "اولین صفحه",
                    "last": "آخرین صفحه",
                    "information": "نمایش ${from} تا ${to} از مجموع ${total}"
                }
            },

            noData: (td) => {
                td.innerHTML = `<div class="noData">
            <div class="icon panel-flex panel-justify-center panel-mb-3">
                <svg width="70" height="70">
                    <use href="/userPanel/images/panel-sprite-icons.svg#icon-no-items"></use>
                </svg>
            </div>
            <div class="text">
                ${translate('no_items_found')}
            </div>
        </div>`;
            },
            export: [
                {
                    type: "excel",
                    tooltip: "دانلود اکسل"
                }
            ],

            mode: "grid",
            pageCount: 5
        };

    </script>
</body>

</html>
